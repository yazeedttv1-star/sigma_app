<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>منصة سيجما التعليمية</title>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" id="mf">
<link rel="apple-touch-icon" id="ai">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

<style>
:root{
  --bg:#f4f7fb; --surface:#ffffff; --surface2:#eef3fa;
  --tx:#0f172a; --tx2:#475569; --mu:#8592a6;
  --ac:#2563eb; --ac2:#1e40af; --ac-soft:#e0ebff;
  --ok:#10b981; --er:#ef4444; --warn:#f59e0b;
  --bd:#e3e9f2; --r:16px; --r-sm:11px; --r-lg:22px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 18px rgba(15,23,42,.06);
  --shadow-lg:0 18px 50px rgba(37,99,235,.18);
  --grad:linear-gradient(135deg,#2563eb 0%,#4f46e5 100%);
}
html.dark{
  --bg:#0a1122; --surface:#111a2e; --surface2:#18233d;
  --tx:#f1f5f9; --tx2:#cbd5e1; --mu:#64748b;
  --ac:#60a5fa; --ac2:#3b82f6; --ac-soft:#1e3a8a;
  --bd:#1e2a44;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3);
  --shadow-lg:0 18px 50px rgba(0,0,0,.5);
  --grad:linear-gradient(135deg,#1d4ed8 0%,#4338ca 100%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{min-height:100%}
body{font-family:Cairo,system-ui,sans-serif;color:var(--tx);min-height:100vh;
  background:radial-gradient(1200px 600px at 10% -10%,rgba(37,99,235,.08),transparent 60%),
             radial-gradient(900px 500px at 110% 0%,rgba(79,70,229,.07),transparent 60%),var(--bg);
  padding-bottom:calc(120px + env(safe-area-inset-bottom));overflow-x:hidden;
  -webkit-user-select:none;user-select:none;transition:background .25s,color .25s}
input,select,textarea{-webkit-user-select:text;user-select:text}
h1,h2,h3{font-weight:800;line-height:1.3}
h2{font-size:20px;margin-bottom:16px;color:var(--tx)}
h3{font-size:17px}

/* شاشة التحميل */
#loading-overlay{position:fixed;inset:0;z-index:9999;background:rgba(244,247,251,.75);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .3s ease}
html.dark #loading-overlay{background:rgba(10,17,34,.75)}
#loading-overlay.hide{opacity:0;pointer-events:none}
.spinner{width:44px;height:44px;border:4px solid var(--ac-soft);border-top-color:var(--ac);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* الشريط العلوي */
.top-bar{position:relative;overflow:hidden;background:var(--grad);color:#fff;padding:26px 22px 30px;
  border-bottom-left-radius:28px;border-bottom-right-radius:28px;margin-bottom:22px;
  display:flex;justify-content:space-between;align-items:flex-start;box-shadow:var(--shadow-lg)}
.top-bar::before,.top-bar::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.top-bar::before{width:220px;height:220px;top:-90px;left:-60px}
.top-bar::after{width:160px;height:160px;bottom:-80px;right:-40px}
.top-bar .welcome{position:relative;z-index:1}
.top-bar .welcome h1{font-size:23px;margin-bottom:4px;font-weight:900}
.top-bar .welcome p{font-size:14px;opacity:.9;margin-bottom:14px}
.top-bar .user-area{position:relative;z-index:1}
.top-bar .avatar-lg{width:58px;height:58px;border-radius:50%;border:3px solid rgba(255,255,255,.5);object-fit:cover;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.top-bar .actions{display:flex;gap:10px;align-items:center}
.action-btn{position:relative;background:rgba(255,255,255,.18);color:#fff;border:0;width:42px;height:42px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;backdrop-filter:blur(4px)}
.action-btn:hover{background:rgba(255,255,255,.3);transform:translateY(-1px)}
.action-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge-dot{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:#ef4444;color:#fff;border:2px solid #fff;align-items:center;justify-content:center;font-size:10px;font-weight:800;display:flex}

main{max-width:1000px;margin:0 auto;padding:0 18px 40px}

/* بطاقات المدرسين */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);cursor:pointer;text-align:center;
  transition:transform .2s,box-shadow .2s,border-color .2s;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.card:hover{border-color:var(--ac);box-shadow:var(--shadow-lg);transform:translateY(-4px)}
.card:active{transform:scale(.98)}
.card .card-img-wrap{width:100%;height:170px;background:linear-gradient(135deg,#dbe7ff 0%,#eef2ff 100%);position:relative}
.card .card-img-wrap img{width:100%;height:100%;object-fit:cover}
.card .card-img-wrap::after{content:"";position:absolute;inset:auto 0 0 0;height:50%;background:linear-gradient(transparent,rgba(0,0,0,.25))}
.card .card-body{padding:14px 10px;flex:1;display:flex;flex-direction:column;justify-content:center}
.card b{font-size:16px;display:block;color:var(--tx);font-weight:800}
.card.lib .lib-ico{width:84px;height:84px;border-radius:50%;object-fit:cover;margin:20px auto 12px;display:block;background:var(--surface2);border:3px solid var(--ac-soft)}

/* صفوف القوائم */
.row{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;
  display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.row:hover{border-color:var(--ac);transform:translateX(-2px);box-shadow:var(--shadow-lg)}
.row:active{transform:scale(.995)}
.row>div{flex:1;min-width:0}
.row b{font-size:15px;display:block;color:var(--tx)}
.row small{color:var(--mu);font-size:13px;display:block;margin-top:3px}

/* أزرار ومدخلات */
button,.btn{font-family:inherit;font-weight:700;border:0;border-radius:var(--r-sm);padding:10px 18px;background:var(--ac);color:#fff;cursor:pointer;transition:.15s;font-size:14px}
button:hover{background:var(--ac2);transform:translateY(-1px);box-shadow:0 6px 16px rgba(37,99,235,.28)}
button:active{transform:translateY(0) scale(.97)}
button:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
button.s{background:var(--surface2);color:var(--tx)}
button.s:hover{background:var(--bd);box-shadow:none;transform:none}
button.d{background:var(--er)}button.d:hover{background:#dc2626;box-shadow:0 6px 16px rgba(239,68,68,.28)}
button.g{background:var(--ok)}button.g:hover{background:#059669;box-shadow:0 6px 16px rgba(16,185,129,.28)}

label{font-size:13px;color:var(--tx2);font-weight:700;display:block;margin-bottom:6px}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:12px 14px;border-radius:var(--r-sm);
  border:1px solid var(--bd);background:var(--surface);color:var(--tx);margin-bottom:14px;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px var(--ac-soft)}

/* الصناديق */
.box{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:22px;margin-bottom:20px;box-shadow:var(--shadow)}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tabs button{background:var(--surface2);color:var(--tx2);padding:9px 18px}
.tabs button.on{background:var(--ac);color:#fff}

/* الجداول */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:11px 10px;text-align:right;border-bottom:1px solid var(--bd)}
th{background:var(--surface2);font-weight:700;color:var(--tx2);font-size:12px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r)}

/* شارات */
.b{display:inline-block;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--tx2)}
.b.g{background:#d1fae5;color:#065f46}
.b.r{background:#fee2e2;color:#991b1b}
.b.y{background:#fef3c7;color:#92400e}
html.dark .b.g{background:#064e3b;color:#6ee7b7}
html.dark .b.r{background:#7f1d1d;color:#fca5a5}
html.dark .b.y{background:#78350f;color:#fcd34d}
.g{color:var(--ok)}.r{color:var(--er)}.y{color:var(--warn)}

.code{font-family:'Courier New',monospace;font-size:15px;letter-spacing:2px;direction:ltr;display:inline-block;background:var(--surface2);padding:4px 10px;border-radius:8px;color:var(--ac2);font-weight:700}
.mut{color:var(--mu);text-align:center;padding:40px 20px}

/* المشغل */
.player-wrap{width:100%;margin-bottom:16px}
.pl{position:relative;background:#000;border-radius:var(--r);overflow:hidden;width:100%;aspect-ratio:16/9;max-height:80vh;margin:0 auto;box-shadow:var(--shadow-lg)}
.pl iframe,.pl video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
.pl.crop-yt iframe{height:115%!important;top:-7.5%!important}
.yt-bottom-mask{position:absolute;bottom:0;left:0;right:0;height:50px;z-index:11;background:#000;pointer-events:none}
.yt-top-mask{position:absolute;top:0;left:0;right:0;height:50px;z-index:11;background:#000;pointer-events:none}
.yt-shield{position:absolute;inset:0;z-index:10;background:transparent;cursor:pointer}
.wm{position:absolute;pointer-events:none;z-index:20;display:flex;align-items:center;gap:6px;font-size:12px;opacity:.45;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:99px;animation:mv 24s linear infinite alternate;direction:ltr;color:#fff}
.wm img{width:22px;height:22px;border-radius:50%;object-fit:cover}
@keyframes mv{0%{top:20%;left:4%}25%{top:70%;left:55%}50%{top:35%;left:70%}75%{top:80%;left:8%}100%{top:20%;left:60%}}

.custom-player-ctrl{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--bd);padding:14px 16px;border-radius:var(--r);margin-top:12px;box-shadow:var(--shadow)}
.custom-player-ctrl .progress-row{display:flex;align-items:center;gap:12px}
.custom-player-ctrl .play-btn{background:var(--grad);color:#fff;border:0;border-radius:50%;width:50px;height:50px;font-size:20px;font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;flex-shrink:0;padding:0}
.custom-player-ctrl .play-btn:hover{transform:scale(1.06)}
.custom-player-ctrl .progress-container{flex:1;display:flex;align-items:center;gap:8px}
.custom-player-ctrl input[type=range]{flex:1;padding:0;margin:0;height:6px;accent-color:var(--ac);cursor:pointer;background:transparent;border:0;box-shadow:none}
.custom-player-ctrl .time{font-family:monospace;font-size:14px;font-weight:700;color:var(--tx);direction:ltr;min-width:45px;text-align:center}
.custom-player-ctrl .tools-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;border-top:1px solid var(--bd);padding-top:10px}
.custom-player-ctrl .tools-row button{padding:7px 12px;font-size:13px;border-radius:9px;background:var(--surface2);color:var(--tx)}
.custom-player-ctrl .tools-row button:hover{background:var(--ac);color:#fff}
.custom-player-ctrl .tools-row select{width:auto;padding:7px 10px;margin:0;font-size:13px;border-radius:9px}

/* شريط التنقل السفلي */
.bottombar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:40;background:var(--surface);border:1px solid var(--bd);
  border-radius:24px;display:flex;justify-content:space-around;gap:4px;padding:8px 10px;box-shadow:0 12px 36px rgba(15,23,42,.15);
  width:calc(100% - 28px);max-width:560px;margin-bottom:env(safe-area-inset-bottom)}
.bottombar button{background:transparent;color:var(--tx2);border:0;padding:8px 10px;border-radius:18px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;box-shadow:none}
.bottombar button:hover{background:var(--surface2);color:var(--tx);transform:none;box-shadow:none}
.bottombar button.on{color:var(--ac);background:var(--ac-soft)}
.bottombar button.on svg{fill:var(--ac)}
.bottombar button svg{width:22px;height:22px;fill:var(--tx2);transition:.15s}
.contact-btn-nav{color:#25D366 !important}
.contact-btn-nav svg{fill:#25D366 !important}
.contact-btn-nav:hover{background:#e8f5e9 !important}

#t{position:fixed;bottom:calc(110px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 22px;border-radius:var(--r);font-weight:700;display:none;z-index:100;box-shadow:var(--shadow-lg);max-width:90vw;text-align:center;font-size:14px}
#t.show{display:block;animation:pop .25s}
@keyframes pop{0%{transform:translateX(-50%) scale(.85);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}

/* الملف الشخصي */
.profile-card{text-align:center;padding:34px 20px}
.profile-card img{width:110px;height:110px;border-radius:50%;border:4px solid var(--ac-soft);margin-bottom:16px;object-fit:cover;box-shadow:var(--shadow)}
.profile-card h2{margin-bottom:8px}
.profile-card p{color:var(--mu);font-size:15px;margin-bottom:22px}

/* النوافذ */
.modal{position:fixed;inset:0;background:rgba(5,10,25,.55);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex;animation:pop .2s}
.modal-content{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:400px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-lg)}
.modal-header{padding:16px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:16px;margin:0}
.modal-body{padding:6px 16px;overflow-y:auto;flex:1}
.noti-item{padding:13px 4px;border-bottom:1px solid var(--bd);font-size:13px;line-height:1.6}
.noti-item:last-child{border-bottom:0}
.noti-item span{display:block;color:var(--mu);font-size:11px;margin-top:4px}

/* تسجيل الدخول */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth-container{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--bd);border-radius:28px;padding:34px 26px;box-shadow:var(--shadow-lg);text-align:center}
.auth-logo{width:70px;height:70px;border-radius:22px;background:var(--grad);color:#fff;font-size:34px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 10px 24px rgba(37,99,235,.35)}
.auth-container h1{font-size:28px;color:var(--ac);margin-bottom:6px;font-weight:900}
.auth-container>p{color:var(--mu);margin-bottom:22px;font-size:15px}
.auth-btn{width:100%;padding:14px;font-size:16px;border-radius:14px;margin-bottom:4px;display:flex;align-items:center;justify-content:center;gap:10px}
.auth-btn.phone{background:var(--grad);color:#fff}
.auth-form{text-align:right}
.auth-form label{display:block;margin-bottom:6px;font-weight:700;font-size:13px;color:var(--tx2)}
.auth-form input{margin-bottom:14px}
.auth-form .error{color:var(--er);font-size:13px;margin-bottom:12px;display:none;background:#fee2e2;padding:9px 12px;border-radius:10px}
html.dark .auth-form .error{background:#7f1d1d}
.auth-switch{text-align:center;margin-top:18px;font-size:14px;color:var(--mu)}
.auth-switch a{color:var(--ac);font-weight:700;text-decoration:none}

/* لوحة التحكم */
.admin-layout{display:flex;gap:20px;align-items:flex-start}
.admin-sidebar{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);width:260px;flex-shrink:0;padding:16px 0;box-shadow:var(--shadow);position:sticky;top:12px}
.admin-profile{text-align:center;padding:0 15px 16px;border-bottom:1px solid var(--bd);margin-bottom:10px}
.admin-profile img{width:64px;height:64px;border-radius:16px;object-fit:cover;margin-bottom:8px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.admin-profile h4{font-size:15px;color:var(--tx);font-weight:800}
.admin-menu{display:flex;flex-direction:column}
.admin-menu button{background:transparent;color:var(--tx2);border-radius:0;padding:12px 20px;text-align:right;font-size:14px;font-weight:700;display:flex;align-items:center;gap:10px;margin:0;border-right:3px solid transparent;transition:.2s}
.admin-menu button:hover{background:var(--surface2);color:var(--ac);transform:none;box-shadow:none}
.admin-menu button.on{background:var(--ac-soft);color:var(--ac);border-right-color:var(--ac)}
.admin-menu button svg{width:18px;height:18px;fill:currentColor;flex-shrink:0}
.admin-content{flex:1;min-width:0}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:18px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.stat-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-icon svg{width:24px;height:24px;fill:currentColor}
.stat-info b{display:block;font-size:22px;color:var(--tx);line-height:1.2}
.stat-info span{font-size:12px;color:var(--mu);font-weight:700}

@media(max-width:768px){
  .admin-layout{flex-direction:column;gap:10px}
  .admin-sidebar{width:100%;display:flex;flex-direction:column;padding:10px 0;position:static}
  .admin-profile{padding:0 10px 10px;display:flex;align-items:center;justify-content:flex-start;gap:10px;border-bottom:0;margin-bottom:0}
  .admin-profile img{width:40px;height:40px;margin-bottom:0;border-radius:10px}
  .admin-menu{flex-direction:row;overflow-x:auto;white-space:nowrap;padding-bottom:5px}
  .admin-menu button{border-right:0;border-bottom:3px solid transparent;padding:10px 15px;border-radius:8px}
  .admin-menu button.on{border-right-color:transparent;border-bottom-color:var(--ac)}
}
@media(max-width:720px){
  main{padding:0 14px 40px}
  h2{font-size:18px}
  .top-bar{padding:18px 16px 22px}
  .top-bar .welcome h1{font-size:19px}
  .pl.crop-yt iframe{height:118%!important;top:-9%!important}
  .yt-bottom-mask,.yt-top-mask{height:55px}
}
@media(max-width:520px){
  .pl{max-height:60vh}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .card .card-img-wrap{height:140px}
  .card b{font-size:14px}
}

/* شاشة الحظر */
.ban-screen{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.ban-screen .box-max{max-width:420px;background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:30px;box-shadow:var(--shadow-lg)}
.ban-screen h1{font-size:26px;color:var(--er);margin-bottom:14px}
.ban-screen p{color:var(--tx2);margin-bottom:22px;line-height:1.8}

/* تحسينات وصول وتجاوب إضافية */
:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
button:disabled,.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
input,select,textarea{min-height:44px}
textarea{resize:vertical;line-height:1.7}
img{max-width:100%}
@media(hover:none){.card:hover,.row:hover{transform:none;box-shadow:var(--shadow)}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

</style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <p style="font-weight:700;color:var(--ac)">جارٍ التحميل...</p>
</div>

<div id="app"></div><div id="t"></div>

<div class="modal" id="notiModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>الإشعارات</h3>
      <button class="s" onclick="closeNoti()" style="padding:5px 10px;font-size:12px">إغلاق</button>
    </div>
    <div class="modal-body" id="notiBody">
      <div class="mut" style="padding:20px">لا توجد إشعارات حالياً.</div>
    </div>
  </div>
</div>

<div class="modal" id="cropModal">
  <div class="modal-content" style="max-width:500px">

/* ===== قص الصورة ===== */
function img(f,s){
  return new Promise((resolve,reject)=>{
    if(!f || !f.type || !f.type.startsWith('image/')){
      toast('اختر ملف صورة صالحاً');
      resolve(null);
      return;
    }
    if(f.size>10*1024*1024){
      toast('حجم الصورة كبير؛ اختر صورة أقل من 10 ميجابايت');
      resolve(null);
      return;
    }
    if(typeof Cropper==='undefined'){
      toast('أداة قص الصور لم تُحمّل. تحقق من اتصال الإنترنت');
      reject(new Error('Cropper.js غير متاح'));
      return;
    }
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('تعذرت قراءة ملف الصورة'));
    reader.onload=e=>{
      const cropImage=$('#cropImage');
      if(!cropImage){reject(new Error('نافذة قص الصورة غير موجودة'));return}
      cropImage.onload=()=>{
        $('#cropModal').classList.add('show');
        if(cropper)cropper.destroy();
        cropper=new Cropper(cropImage,{aspectRatio:1,viewMode:1,background:false,autoCropArea:1});
        cropResolve=(croppedDataUrl)=>{
          $('#cropModal').classList.remove('show');
          if(cropper){cropper.destroy();cropper=null}
          if(!croppedDataUrl){resolve(null);return}
          const imgObj=new Image();
          imgObj.onerror=()=>reject(new Error('تعذر تجهيز الصورة بعد القص'));
          imgObj.onload=()=>{
            const canvas=document.createElement('canvas');
            const size=Math.max(1,Math.min(1200,Number(s)||200));
            canvas.width=canvas.height=size;
            const ctx=canvas.getContext('2d');
            if(!ctx){reject(new Error('المتصفح لا يدعم معالجة الصور'));return}
            ctx.drawImage(imgObj,0,0,size,size);
            resolve(canvas.toDataURL('image/jpeg',0.82));
          };
          imgObj.src=croppedDataUrl;
        };
      };
      cropImage.onerror=()=>reject(new Error('الملف ليس صورة قابلة للعرض'));
      cropImage.src=e.target.result;
    };
    reader.readAsDataURL(f);
  });
}
function confirmCrop(){if(!cropper)return;const canvas=cropper.getCroppedCanvas({width:400,height:400});cropResolve&&cropResolve(canvas.toDataURL('image/jpeg'))}
function cancelCrop(){cropResolve&&cropResolve(null)}

function embed(u){
  u=u.trim();let m;
  if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([\w-]{11})/))
    return{t:'yt',id:m[1],s:`https://www.youtube-nocookie.com/embed/${m[1]}?rel=0&modestbranding=1&playsinline=1&enablejsapi=1&controls=0&showinfo=0&iv_load_policy=3&fs=0&disablekb=1`};
  if(m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?.*?id=)([\w-]+)/))
    return{t:'drive',s:`https://drive.google.com/file/d/${m[1]}/preview`,id:m[1]};
  if(/\.(mp4|webm|ogg)(\?|$)/i.test(u))return{t:'v',s:u};
  return{t:'f',s:u};
}

async function enforceSingleDevice(){
  if(A||IS_SUPERVISOR)return true;
  const devId=getDeviceId();
  const sessionsRef=R('sessions/'+U.uid);
  const cur=(await get(sessionsRef)).val()||{};
  const now=Date.now();
  const existingDevice=cur.deviceId;
  const existingTs=cur.updatedAt||0;
  if(existingDevice&&existingDevice!==devId&&now-existingTs<10*60*1000){
    await set(R('bans/'+U.uid),{uid:U.uid,name:U.displayName||'',email:U.email||'',photo:U.photoURL||'',oldDevice:existingDevice,oldDeviceLabel:cur.deviceLabel||'',newDevice:devId,newDeviceLabel:deviceLabel(),bannedAt:now,reason:'تسجيل دخول من جهاز آخر'});
    return false;
  }
  await set(sessionsRef,{deviceId:devId,deviceLabel:deviceLabel(),updatedAt:now,name:U.displayName||'',email:U.email||''});
  const ban=await G('bans/'+U.uid);
  if(ban&&ban.newDevice===devId)await remove(R('bans/'+U.uid));
  return true;
}

async function registerPhone(){
  const name=$('#reg-name').value.trim();
  const phone=$('#reg-phone').value.trim();
  const pass=$('#reg-pass').value;
  const pass2=$('#reg-pass2').value;
  const err=$('#reg-error');
  err.style.display='none';
  const showErr=m=>{err.textContent=m;err.style.display='block'};
  if(!name||name.split(/\s+/).length<4)return showErr('يجب كتابة الاسم الرباعي كاملاً (4 مقاطع)');
  if(!/^01[0-9]{9}$/.test(phone))return showErr('رقم الهاتف يجب أن يكون 11 رقم ويبدأ بـ 01');
  if(pass.length<6)return showErr('كلمة المرور يجب أن تكون 6 أحرف على الأقل');
  if(pass!==pass2)return showErr('كلمتا المرور غير متطابقتين');
  try{
    const fakeEmail=`${phone}@sigma.user`;
    const cred=await createUserWithEmailAndPassword(auth,fakeEmail,pass);
    const user=cred.user;
    await updateProfile(user,{displayName:name});
    await set(R('users/'+user.uid),{name,phone,email:fakeEmail,photo:'',createdAt:Date.now(),isSupervisor:false});
    toast('تم إنشاء الحساب بنجاح');
    setTimeout(()=>location.reload(),1000);
  }catch(e){
    showErr(e.code==='auth/email-already-in-use'?'رقم الهاتف مسجل بالفعل، يمكنك تسجيل الدخول.':'حدث خطأ: '+e.message);
  }
}

async function loginPhone(){
  const phone=$('#login-phone').value.trim();
  const pass=$('#login-pass').value;
  const err=$('#login-error');
  err.style.display='none';
  const showErr=m=>{err.textContent=m;err.style.display='block'};
  if(!/^01[0-9]{9}$/.test(phone))return showErr('رقم الهاتف غير صحيح');
  const failKey=`login_fails_${phone}`,lockKey=`login_lock_${phone}`;
  const lockTime=localStorage.getItem(lockKey);
  if(lockTime){
    const remaining=Math.ceil((parseInt(lockTime)-Date.now())/60000);
    if(remaining>0)return showErr(`تم قفل الحساب مؤقتاً. يرجى المحاولة بعد ${remaining} دقيقة.`);
    localStorage.removeItem(lockKey);localStorage.removeItem(failKey);
  }
  try{
    await signInWithEmailAndPassword(auth,`${phone}@sigma.user`,pass);
    localStorage.removeItem(failKey);
    toast('تم تسجيل الدخول بنجاح');
  }catch(e){
    const fails=parseInt(localStorage.getItem(failKey)||'0')+1;
    localStorage.setItem(failKey,fails);
    if(fails>=3){
      localStorage.setItem(lockKey,Date.now()+15*60*1000);
      localStorage.removeItem(failKey);
      showErr('تم إدخال كلمة مرور خاطئة 3 مرات. الحساب مقفل لمدة 15 دقيقة.');
    }else showErr(`رقم الهاتف أو كلمة المرور غير صحيحة (المحاولة ${fails} من 3)`);
  }
}

async function redeem(vid){
  const v=videos[vid];
  if(!v||v.disabled)return toast('الفيديو موقوف');
  const c=$('#cd').value.trim();
  if(!/^\d{6}$/.test(c))return toast('الكود يجب أن يكون 6 أرقام');
  const r=await runTransaction(R('codes/'+c),cur=>{
    if(cur===null)return cur;
    if(cur.videoId!==vid)return;
    if(cur.used&&cur.usedBy!==U.uid)return;
    if(!cur.used)Object.assign(cur,{used:true,usedBy:U.uid,usedByName:U.displayName,usedByEmail:U.email,usedAt:Date.now()});
    return cur;
  }).catch(()=>null);
  const vv=r?.snapshot.val();
  if(!vv||vv.usedBy!==U.uid||vv.videoId!==vid)return toast('الكود غير صحيح أو مستخدم من قبل');
  await set(R(`users/${U.uid}/videos/${vid}`),c);
  window.__mineVideos=window.__mineVideos||{};
  window.__mineVideos[vid]=c;
  go('watch',vid);
}

async function vWatch(){
  const v=videos[S.id];if(!v)return vHome();
  if(v.disabled&&!A&&!IS_SUPERVISOR)return`<div class="mut">هذا الفيديو موقوف حالياً.</div>`;
  let c,rec;
  if(A||IS_SUPERVISOR){c='admin';rec={url:v.url,usedBy:U.uid,videoId:S.id}}
  else{
    c=(window.__mineVideos&&window.__mineVideos[S.id])?window.__mineVideos[S.id]:(await G(`users/${U.uid}/videos/${S.id}`));
    if(!c){S.v='code';return vCode()}
    rec=await G('codes/'+c);
    if(!rec||rec.usedBy!==U.uid){if(window.__mineVideos)delete window.__mineVideos[S.id];S.v='code';return vCode()}
  }
  const e=embed(rec.url),lp=`logs/${S.id}/${U.uid}`;
  const old=(A||IS_SUPERVISOR)?{}:((await G(lp))||{});
  let sec=old.seconds||0;
  const dur=(+v.duration||0)*60;
  if(!A&&!IS_SUPERVISOR){
    await update(R(lp),{name:U.displayName,email:U.email,photo:U.photoURL||'',code:c,openedAt:old.openedAt||Date.now(),lastAt:Date.now(),seconds:sec,completed:!!old.completed});
    const tick=async add=>{
      if(document.hidden)return;
      sec+=add;
      const done=dur&&sec>=dur*.9;
      await update(R(lp),{seconds:sec,lastAt:Date.now(),completed:!!(done||old.completed)}).catch(()=>{});
    };
    stopHB();
    hb=setInterval(()=>tick(10),10000);
  }
  const wm=(A||IS_SUPERVISOR)?'':`<div class="wm">${badge?`<img src="${badge}" alt="">`:''}${esc(U.displayName||'')} · ${esc(U.email||'')}</div>`;
  let playerHTML='';
  const isYT=e.t==='yt';
  if(e.t==='v')playerHTML=`<video id="vplayer" src="${esc(e.s)}" playsinline></video>`;
  else if(isYT)playerHTML=`<iframe id="vplayer" src="${esc(e.s)}" allow="autoplay;encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  else if(e.t==='drive')playerHTML=`<iframe id="vplayer" src="${esc(e.s)}" allow="autoplay;encrypted-media;fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  else playerHTML=`<iframe id="vplayer" src="${esc(e.s)}" allow="autoplay;encrypted-media;fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" sandbox="allow-scripts allow-same-origin allow-presentation allow-popups"></iframe>`;
  let controlsHTML='';
  if(isYT||e.t==='v'){
    controlsHTML=`<div class="custom-player-ctrl"><div class="progress-row"><button id="playPauseBtn" class="play-btn" onclick="togglePlay()">▶</button><div class="progress-container"><span class="time" id="cTime">0:00</span><input type="range" id="cSeek" min="0" max="100" value="0" step="0.1" oninput="onSeek(this.value)"><span class="time" id="dTime">0:00</span></div></div><div class="tools-row"><button onclick="seekRel(-5)">⏪ -5 ثوان</button><button onclick="seekRel(5)">+5 ثوان ⏩</button><span style="color:var(--mu);font-size:13px;font-weight:700;margin:0 4px">السرعة:</span><select id="speedSelector" onchange="setRate(this.value)"><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1x (عادي)</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option></select><button onclick="toggleFullscreen()" id="fsBtn">⛶ ملء الشاشة</button></div></div>`;
  }
  return`<button class="s" onclick="go('teacher','${v.teacherId}','','${v.stage}')">← رجوع</button>
  <h2 style="margin-top:14px">${esc(v.title)} ${(A||IS_SUPERVISOR)?'<span class="b g">إدارة</span>':''}</h2>

}

/* ===== مشغل الفيديو ===== */
function initPlayer(){
  const el=document.getElementById('vplayer');if(!el)return;
  if(el.tagName==='IFRAME'&&el.src.includes('youtube')){
    if(!window.YT){
      const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
      window.onYouTubeIframeAPIReady=()=>setupYT();
    }else setupYT();
  }else if(el.tagName==='VIDEO'){
    el.addEventListener('timeupdate',updateUI);
    el.addEventListener('loadedmetadata',updateUI);
    el.addEventListener('play',()=>{const b=$('#playPauseBtn');if(b)b.textContent='❚❚';updateUI()});
    el.addEventListener('pause',()=>{const b=$('#playPauseBtn');if(b)b.textContent='▶';updateUI()});
  }
}
function setupYT(){
  const iframe=document.getElementById('vplayer');if(!iframe||!window.YT)return;
  ytPlayer=new YT.Player(iframe,{events:{
    onReady:()=>{updateUI();startPoll()},
    onStateChange:e=>{const b=$('#playPauseBtn');if(b)b.textContent=e.data===1?'❚❚':'▶'}
  }});
}
function startPoll(){stopPoll();pollInterval=setInterval(updateUI,250)}
function stopPoll(){if(pollInterval){clearInterval(pollInterval);pollInterval=null}}
function updateUI(){
  const seek=$('#cSeek'),cTime=$('#cTime'),dTime=$('#dTime');if(!seek)return;
  let cur=0,dur=0;
  if(ytPlayer&&ytPlayer.getCurrentTime){try{cur=ytPlayer.getCurrentTime()||0;dur=ytPlayer.getDuration()||0}catch(e){}}
  else{const vid=$('#vplayer');if(vid&&vid.tagName==='VIDEO'){cur=vid.currentTime||0;dur=vid.duration||0}}
  if(dur>0){seek.value=(cur/dur)*100;cTime.textContent=fmt(cur);dTime.textContent=fmt(dur)}
}
function fmt(s){s=Math.max(0,Math.floor(s||0));const m=Math.floor(s/60),ss=s%60;return m+':'+String(ss).padStart(2,'0')}
function togglePlay(){
  if(ytPlayer&&ytPlayer.getPlayerState){const st=ytPlayer.getPlayerState();st===1?ytPlayer.pauseVideo():ytPlayer.playVideo()}
  else{const vid=$('#vplayer');if(vid&&vid.tagName==='VIDEO'){vid.paused?vid.play():vid.pause()}}
}
function onSeek(val){
  if(ytPlayer&&ytPlayer.getDuration){try{const dur=ytPlayer.getDuration()||0;ytPlayer.seekTo((val/100)*dur,true)}catch(e){}}
  else{const vid=$('#vplayer');if(vid&&vid.tagName==='VIDEO')vid.currentTime=(val/100)*(vid.duration||0)}
}
function seekRel(sec){
  if(ytPlayer&&ytPlayer.getCurrentTime){try{const cur=ytPlayer.getCurrentTime()||0;ytPlayer.seekTo(cur+sec,true)}catch(e){}}
  else{const vid=$('#vplayer');if(vid&&vid.tagName==='VIDEO')vid.currentTime=(vid.currentTime||0)+sec}
}
function setRate(rate){
  const r=parseFloat(rate);
  if(ytPlayer&&ytPlayer.setPlaybackRate){try{ytPlayer.setPlaybackRate(r)}catch(e){}}
  else{const vid=$('#vplayer');if(vid&&vid.tagName==='VIDEO')vid.playbackRate=r}
}
async function toggleFullscreen(){
  const box=$('#plbox'),btn=$('#fsBtn');if(!box)return;
  try{
    if(!document.fullscreenElement){
      const fn=box.requestFullscreen||box.webkitRequestFullscreen||box.msRequestFullscreen;
      if(!fn)return toast('ملء الشاشة غير مدعوم في هذا المتصفح');
      await fn.call(box);
    }else{
      const fn=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
      if(fn)await fn.call(document);
    }
  }catch(e){toast('تعذر تغيير وضع الشاشة')}
  if(btn)btn.innerHTML=document.fullscreenElement?'⛶ خروج من ملء الشاشة':'⛶ ملء الشاشة';
}
function stopHB(){if(hb){clearInterval(hb);hb=null}}

async function vAdminStudents(){
  if(!A)return'<div class="mut">غير مصرح.</div>';
  const users=(await G('users'))||{};
  const arr=Object.entries(users).map(([id,u])=>({id,...u})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(!arr.length)return'<div class="mut">لا يوجد طلاب مسجلون بعد.</div>';
  let html=`<h2>الطلاب المسجلون (${arr.length})</h2><div class="box tw" style="padding:0"><table><thead><tr><th>الاسم</th><th>رقم الهاتف</th><th>البريد الإلكتروني</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>`;
  arr.forEach(u=>{
    const isSup=u.isSupervisor===true;
    const isAdmin=ADMIN_PHONES.includes(u.phone||'');
    html+=`<tr>
      <td><b>${esc(u.name||'-')}</b></td>
      <td dir="ltr">${esc(u.phone||'-')}</td>
      <td>${esc(u.email||'-')}</td>
      <td>${isAdmin?'<span class="b r">أدمن</span>':isSup?'<span class="b y">مشرف</span>':'<span class="b">طالب</span>'}</td>
      <td>${!isAdmin?`<button class="s" style="padding:5px 9px;font-size:12px;margin-left:4px" onclick="toggleSupervisor('${u.id}',${isSup})">${isSup?'إلغاء الإشراف':'تعيين مشرف'}</button><button class="d" style="padding:5px 9px;font-size:12px" onclick="delUser('${u.id}')">حذف</button>`:''}</td>
    </tr>`;
  });
  return html+`</tbody></table></div>`;
}

async function toggleSupervisor(uid,isSup){
  if(!A)return toast('غير مصرح');
  if(!confirm(isSup?'إلغاء صلاحية الإشراف؟':'تعيين هذا الطالب كمشرف؟ (سيتمكن من إضافة فيديوهات فقط)'))return;
  try{await update(R('users/'+uid),{isSupervisor:!isSup});toast(isSup?'تم إلغاء الإشراف':'تم تعيين الطالب كمشرف');render()}
  catch(e){toast('تعذر التعديل')}
}
async function delUser(uid){

function vStudentSearch(){
  return `<div class="box"><h2>بحث عن طالب</h2><label>اسم الطالب أو الإيميل أو رقم الهاتف أو الكود</label><div style="display:flex;gap:8px"><input id="searchStudent" placeholder="اكتب أي شيء للبحث..." style="margin-bottom:0"><button onclick="doStudentSearch()">بحث</button></div></div><div id="studentResult"></div>`;
}
async function doStudentSearch(){
  const q=$('#searchStudent').value.trim().toLowerCase();
  if(!q)return;
  const res=$('#studentResult');
  res.innerHTML='<div class="mut">جارٍ البحث...</div>';
  const allLogs=(await G('logs'))||{};
  const studentLogs={};
  for(const vid in allLogs){
    for(const uid in allLogs[vid]){
      const log=allLogs[vid][uid];
      const match=(log.name&&log.name.toLowerCase().includes(q))||(log.email&&log.email.toLowerCase().includes(q))||(log.code&&String(log.code).includes(q));
      if(match){
        if(!studentLogs[uid])studentLogs[uid]={name:log.name,email:log.email,videos:[]};
        studentLogs[uid].videos.push({vid,title:videos[vid]?.title||'محذوف',time:log.lastAt,completed:log.completed});
      }
    }
  }
  const entries=Object.values(studentLogs);
  if(!entries.length){res.innerHTML='<div class="mut">لم يتم العثور على نتائج.</div>';return}
  res.innerHTML=entries.map(s=>`
    <div class="box">
      <h3>${esc(s.name)} <small style="color:var(--mu);font-size:12px">(${esc(s.email)})</small></h3>
      <p style="margin:10px 0;font-weight:bold">عدد المحاضرات التي حضرها: <span class="b g">${s.videos.length}</span></p>
      <div class="tw"><table><tr><th>المحاضرة</th><th>آخر مشاهدة</th><th>الحالة</th></tr>
        ${s.videos.map(v=>`<tr><td>${esc(v.title)}</td><td>${fd(v.time)}</td><td>${v.completed?'<span class="g">أكمل</span>':'<span class="y">لم يكمل</span>'}</td></tr>`).join('')}
      </table></div>
    </div>`).join('');
}

/* ===== إضافة فيديو ===== */
async function addV(){
  const v={teacherId:$('#vt').value,stage:$('#vs').value,grade:$('#vg').value,title:$('#vn').value.trim(),desc:$('#vd').value.trim(),url:$('#vu').value.trim(),duration:+$('#vm').value||0,created:Date.now(),disabled:false};
  if(!v.teacherId||!v.title||!v.url)return toast('أكمل الحقول');
  const k='v'+Date.now();
  await set(R('videos/'+k),v);
  videos={...videos,[k]:v};
  const rawCount=$('#vc')?.value;
  const n=rawCount===''||rawCount==null?0:Number(rawCount);
  if(!Number.isInteger(n)||n<0||n>500)return toast('عدد الأكواد يجب أن يكون من 0 إلى 500');
  if(n>0){
    toast('جارٍ توليد الأكواد...');
    try{
      const ok=await gen(k,n,v);
      toast(ok===n?`تم الحفظ وتوليد ${ok} كود`:`تم توليد ${ok} كود من أصل ${n}`);
    }catch(err){
      console.error(err);
      toast('تم حفظ الفيديو لكن حدث خطأ في التوليد: '+(err.code||err.message));
    }
  }else toast('تم الحفظ');
  go('vid',k);
}

/* ===== جلب أكواد فيديو (يعمل بدون فهرس أيضاً) ===== */
async function codesFor(vid){
  try{
    const s=await get(query(R('codes'),orderByChild('videoId'),equalTo(vid)));
    const out=[];
    s.forEach(c=>{out.push({c:c.key,...c.val()})});
    return out;
  }catch(e){
    const all=(await G('codes'))||{};
    return Object.entries(all).filter(([,x])=>x&&x.videoId===vid).map(([k,x])=>({c:k,...x}));
  }
}

function syncGradeOptions(){
  const stage=$('#vs')?.value||'prep',grade=$('#vg');if(!grade)return;
  const vals=stage==='prep'?GRADES_PREP:GRADES_SEC;
  const prev=grade.value;
  grade.innerHTML=vals.map(x=>`<option>${x}</option>`).join('');
  if(vals.includes(prev))grade.value=prev;
}

  const stage=$('#evs')?.value||'prep',grade=$('#evg');if(!grade)return;

  grade.innerHTML=vals.map(x=>`<option>${x}</option>`).join('');
  if(vals.includes(prev))grade.value=prev;
}

/* ===== توليد الأكواد (مُصلح) =====
   - يتحقق من عدم تكرار الكود قبل كتابته
   - يكتب الأكواد على دفعات بعملية update واحدة لكل دفعة (أسرع بكثير وأكثر موثوقية)
   - يُرجع عدد الأكواد الفعلي الذي تم توليده */
async function gen(vid,n,video){
  const v=video||videos[vid];
  n=Number(n);
  if(!v)throw new Error('الفيديو غير موجود لتوليد الأكواد');
  if(!Number.isInteger(n)||n<1||n>500)throw new Error('عدد الأكواد يجب أن يكون من 1 إلى 500');
  if(!window.crypto?.getRandomValues)throw new Error('مولّد الأكواد الآمن غير مدعوم في هذا المتصفح');
  const picked=[];
  const local=new Set();
  let tries=0;
  const maxTries=n*30+200;
  while(picked.length<n&&tries<maxTries){
    const batch=[];
    while(batch.length<Math.min(40,n-picked.length)&&tries<maxTries){
      const c=String(100000+(crypto.getRandomValues(new Uint32Array(1))[0]%900000));
      tries++;
      if(!local.has(c)&&!batch.some(x=>x.c===c)){
        local.add(c);
        batch.push({c,record:{videoId:vid,url:v.url,title:v.title,used:false,createdAt:Date.now()}});
      }
    }
    const results=await Promise.all(batch.map(async item=>{
      const tx=await runTransaction(R('codes/'+item.c),current=>current===null?item.record:undefined);
      return tx.committed?item.c:null;
    }));
    for(const c of results){
      if(c&&picked.length<n)picked.push(c);
    }
    // الأكواد التي اصطدمت بسجل موجود لا تُعاد محاولة كتابتها.
  }
  if(picked.length!==n)throw new Error(`تم إنشاء ${picked.length} من ${n} فقط؛ حاول مرة أخرى`);
  return picked.length;
}
async function moreCodes(vid,one){
  const input=$('#gn');
  const n=one?1:Number(input?.value);
  if(!Number.isInteger(n)||n<1||n>500)return toast('أدخل عدداً صحيحاً من 1 إلى 500');
  toast('جارٍ توليد الأكواد...');
  try{
    const ok=await gen(vid,n);
    toast(`تم توليد ${ok} كود بنجاح`);
  }catch(e){
    console.error('فشل توليد الأكواد:',e);
    toast('تعذر التوليد: '+(e.code||e.message||'خطأ غير معروف'));
  }finally{
    render();
  }
}

const cp=async t=>{
  try{
    if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t)}
    else{
      const el=document.createElement('textarea');el.value=t;el.style.position='fixed';el.style.opacity='0';
      document.body.appendChild(el);el.select();const ok=document.execCommand('copy');el.remove();
      if(!ok)throw new Error('تعذر النسخ');
    }
    toast('تم النسخ');
  }catch(e){toast('تعذر النسخ تلقائياً؛ حاول تحديد النص ونسخه')}
};
window.copyFree=async id=>{

  win.document.close();
}
