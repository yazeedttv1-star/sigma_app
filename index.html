<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>منصة سيجما التعليمية</title>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" id="mf">
<link rel="apple-touch-icon" id="ai">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8fafc; --surface:#ffffff; --surface2:#f1f5f9;
  --tx:#0f172a; --tx2:#475569; --mu:#94a3b8;
  --ac:#2563eb; --ac2:#1d4ed8; --ac-soft:#dbeafe;
  --ok:#10b981; --er:#ef4444; --warn:#f59e0b;
  --bd:#e2e8f0; --r:16px; --r-sm:10px; --r-lg:22px;
  --shadow:0 1px 3px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.04);
  --shadow-lg:0 10px 40px rgba(15,23,42,.12);
}
html.dark{
  --bg:#0b1220; --surface:#111a2e; --surface2:#1a2440;
  --tx:#f1f5f9; --tx2:#cbd5e1; --mu:#64748b;
  --ac:#60a5fa; --ac2:#3b82f6; --ac-soft:#1e3a8a;
  --bd:#1e293b;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.3);
  --shadow-lg:0 10px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;
  padding-bottom:calc(90px + env(safe-area-inset-bottom));overflow-x:hidden;
  -webkit-user-select:none;user-select:none;transition:background .25s,color .25s}
input,select,textarea{-webkit-user-select:text;user-select:text}
h1,h2,h3{font-weight:800;line-height:1.3}
h2{font-size:20px;margin-bottom:16px;color:var(--tx)}

.top-bar{background:linear-gradient(135deg,var(--ac) 0%,var(--ac2) 100%);color:#fff;padding:24px 20px;
  border-bottom-left-radius:24px;border-bottom-right-radius:24px;margin-bottom:20px;
  display:flex;justify-content:space-between;align-items:center;position:relative;box-shadow:var(--shadow)}
.top-bar .welcome h1{font-size:22px;margin-bottom:4px;font-weight:800}
.top-bar .welcome p{font-size:14px;opacity:.9}
.top-bar .avatar-lg{width:56px;height:56px;border-radius:50%;border:3px solid rgba(255,255,255,.4);object-fit:cover}

header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);
  padding:12px 20px;display:flex;align-items:center;gap:12px}
html.dark header{background:rgba(17,26,46,.85)}
.logo{font-weight:800;font-size:22px;color:var(--ac);cursor:pointer;margin-inline-end:auto;
  display:flex;align-items:center;gap:8px;letter-spacing:-.5px}
.logo:before{content:'';width:8px;height:22px;background:var(--ac);border-radius:4px}
.chip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2);font-weight:600;cursor:pointer}
.chip img,.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--surface2);border:2px solid var(--ac-soft)}
.header-btn{background:var(--surface2);color:var(--tx);border:0;border-radius:var(--r-sm);
  padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;position:relative}
.header-btn:hover{background:var(--ac);color:#fff}
.badge-dot{position:absolute;top:-4px;right:-4px;background:var(--er);color:#fff;font-size:10px;font-weight:bold;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface);display:none}

main{max-width:1000px;margin:0 auto;padding:0 20px 40px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);
  padding:20px 16px;cursor:pointer;text-align:center;transition:.2s var(--shadow)}
.card:hover{border-color:var(--ac);box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.card:active{transform:scale(.98)}
.card .ph{width:88px;height:88px;border-radius:50%;object-fit:cover;margin:0 auto 12px;
  display:block;background:var(--surface2);border:3px solid var(--ac-soft)}
.card b{font-size:15px;display:block;color:var(--tx)}

.row{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);
  padding:16px 18px;margin-bottom:12px;display:flex;align-items:center;gap:12px;
  cursor:pointer;transition:.15s var(--shadow)}
.row:hover{border-color:var(--ac);box-shadow:var(--shadow-lg)}
.row:active{transform:scale(.995)}
.row>div{flex:1;min-width:0}
.row b{font-size:15px;display:block;color:var(--tx)}
.row small{color:var(--mu);font-size:13px;display:block;margin-top:2px}

button,.btn{font-family:inherit;font-weight:600;border:0;border-radius:var(--r-sm);
  padding:10px 18px;background:var(--ac);color:#fff;cursor:pointer;transition:.15s;font-size:14px}
button:hover{background:var(--ac2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.3)}
button:active{transform:translateY(0) scale(.97)}
button.s{background:var(--surface2);color:var(--tx)}
button.s:hover{background:var(--bd);box-shadow:none;transform:none}
button.d{background:var(--er)}button.d:hover{background:#dc2626}
button.g{background:var(--ok)}button.g:hover{background:#059669}

label{font-size:13px;color:var(--tx2);font-weight:600;display:block;margin-bottom:6px}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:11px 14px;
  border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--surface);color:var(--tx);
  margin-bottom:14px;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}

.box{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);
  padding:22px;margin-bottom:20px;box-shadow:var(--shadow)}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tabs button{background:var(--surface2);color:var(--tx2);padding:9px 18px;font-size:14px}
.tabs button.on{background:var(--ac);color:#fff}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px;text-align:right;border-bottom:1px solid var(--bd)}
th{background:var(--surface2);font-weight:700;color:var(--tx2);font-size:12px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r)}

.b{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--tx2)}
.b.g{background:#d1fae5;color:#065f46}
.b.r{background:#fee2e2;color:#991b1b}
.b.y{background:#fef3c7;color:#92400e}
html.dark .b.g{background:#064e3b;color:#6ee7b7}
html.dark .b.r{background:#7f1d1d;color:#fca5a5}
html.dark .b.y{background:#78350f;color:#fcd34d}
.g{color:var(--ok)}.r{color:var(--er)}.y{color:var(--warn)}

.code{font-family:'Courier New',monospace;font-size:15px;letter-spacing:2px;direction:ltr;
  display:inline-block;background:var(--surface2);padding:3px 10px;border-radius:6px;color:var(--ac2);font-weight:700}

.center{text-align:center;padding:15vh 20px 0}
.center h1{font-size:clamp(40px,10vw,64px);color:var(--ac);margin-bottom:12px;letter-spacing:-2px}
.center p{color:var(--mu);margin-bottom:32px;font-size:15px}
.center button{padding:14px 32px;font-size:16px;border-radius:var(--r)}
.mut{color:var(--mu);text-align:center;padding:40px 20px}

.player-wrap{width:100%;margin-bottom:16px}
.pl{position:relative;background:#000;border-radius:var(--r);overflow:hidden;
  width:100%;aspect-ratio:16/9;max-height:80vh;margin:0 auto;box-shadow:var(--shadow-lg)}
.pl iframe,.pl video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
.pl.crop-yt iframe{height:115%!important;top:-7.5%!important}
.yt-bottom-mask{position:absolute;bottom:0;left:0;right:0;height:50px;z-index:11;background:#000;pointer-events:none}
.yt-top-mask{position:absolute;top:0;left:0;right:0;height:50px;z-index:11;background:#000;pointer-events:none}
.yt-shield{position:absolute;inset:0;z-index:10;background:transparent;cursor:pointer}
.wm{position:absolute;pointer-events:none;z-index:20;display:flex;align-items:center;gap:6px;font-size:12px;opacity:.45;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:99px;animation:mv 24s linear infinite alternate;direction:ltr;color:#fff}
.wm img{width:22px;height:22px;border-radius:50%;object-fit:cover}
@keyframes mv{0%{top:20%;left:4%}25%{top:70%;left:55%}50%{top:35%;left:70%}75%{top:80%;left:8%}100%{top:20%;left:60%}}

.custom-player-ctrl{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--bd);padding:12px 16px;border-radius:var(--r);margin-top:12px;box-shadow:var(--shadow)}
.custom-player-ctrl .progress-row{display:flex;align-items:center;gap:12px}
.custom-player-ctrl .play-btn{background:var(--ac);color:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:20px;font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;flex-shrink:0}
.custom-player-ctrl .play-btn:hover{background:var(--ac2);transform:scale(1.05)}
.custom-player-ctrl .progress-container{flex:1;display:flex;align-items:center;gap:8px}
.custom-player-ctrl input[type=range]{flex:1;padding:0;margin:0;height:6px;accent-color:var(--ac);cursor:pointer;background:transparent}
.custom-player-ctrl .time{font-family:monospace;font-size:14px;font-weight:700;color:var(--tx);direction:ltr;min-width:45px;text-align:center}
.custom-player-ctrl .tools-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;border-top:1px solid var(--bd);padding-top:10px}
.custom-player-ctrl .tools-row button{padding:6px 12px;font-size:13px;border-radius:8px;background:var(--surface2);color:var(--tx)}
.custom-player-ctrl .tools-row button:hover{background:var(--ac);color:#fff}
.custom-player-ctrl .tools-row select{width:auto;padding:6px 10px;margin:0;font-size:13px;border-radius:8px}

/* شريط التنقل السفلي الثابت والمنظم */
.bottombar{position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:var(--surface);border-top:1px solid var(--bd);
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -4px 20px rgba(0,0,0,.06)}
.bottombar button{background:transparent;color:var(--tx2);border:0;
  padding:8px 12px;border-radius:var(--r-sm);font-size:12px;font-weight:700;
  cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.bottombar button:hover{background:var(--surface2);color:var(--tx)}
.bottombar button.on{color:var(--ac);background:var(--ac-soft)}
.bottombar button.on svg{fill:var(--ac)}
.bottombar button.danger{color:var(--er)}
.bottombar button.danger:hover{background:var(--er);color:#fff}
.bottombar button.danger:hover svg{fill:#fff}
.bottombar button svg{width:22px;height:22px;fill:var(--tx2);transition:.15s}

#t{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 22px;border-radius:var(--r);font-weight:700;display:none;z-index:100;box-shadow:var(--shadow-lg);max-width:90vw;text-align:center;font-size:14px}
#t.show{display:block;animation:pop .25s}
@keyframes pop{0%{transform:translateX(-50%) scale(.8);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}

.profile-card{text-align:center;padding:30px 20px}
.profile-card img{width:100px;height:100px;border-radius:50%;border:4px solid var(--ac-soft);margin-bottom:16px;object-fit:cover}
.profile-card h2{margin-bottom:8px}
.profile-card p{color:var(--mu);font-size:15px;margin-bottom:24px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex;animation:pop .2s}
.modal-content{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:400px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-lg)}
.modal-header{padding:16px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:16px;margin:0}
.modal-body{padding:16px;overflow-y:auto;flex:1}
.noti-item{padding:12px;border-bottom:1px solid var(--bd);font-size:13px;line-height:1.5}
.noti-item:last-child{border-bottom:0}
.noti-item span{display:block;color:var(--mu);font-size:11px;margin-top:4px}

@media(max-width:720px){
header{padding:10px 14px}
header .logo{font-size:19px}
.header-btn{padding:7px 11px;font-size:12px}
main{padding:0 14px 40px}
h2{font-size:18px}
.top-bar{padding:20px 14px}
.top-bar .welcome h1{font-size:18px}
.pl.crop-yt iframe{height:118%!important;top:-9%!important}
.yt-bottom-mask{height:55px}
.yt-top-mask{height:55px}
}
@media(max-width:520px){
header .chip span{display:none}
.pl{max-height:60vh}
.center h1{font-size:44px}
}
@media print{body{display:none}}
.ban-screen{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.ban-screen .box-max{max-width:420px}
.ban-screen h1{font-size:28px;color:var(--er);margin-bottom:14px}
.ban-screen p{color:var(--tx2);margin-bottom:24px;line-height:1.7}
</style>
</head>
<body>
<div id="app"></div><div id="t"></div>

<div class="modal" id="notiModal">

</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut,setPersistence,browserLocalPersistence} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase,ref,get,set,update,remove,runTransaction,query,orderByChild,equalTo,onValue} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const ADMIN_EMAILS=["yazeedttv1@gmail.com","youssefttv1@gmail.com"];
const app=initializeApp({apiKey:"AIzaSyCoHGEyhlsjmB_diUNm-R8SXB0Gm0kXw0A",authDomain:"sigma-6f162.firebaseapp.com",databaseURL:"https://sigma-6f162-default-rtdb.firebaseio.com",projectId:"sigma-6f162",storageBucket:"sigma-6f162.firebasestorage.app",messagingSenderId:"420365348074",appId:"1:420365348074:web:0aaecb71ec613bb32abb93"});
const auth=getAuth(app),db=getDatabase(app);
setPersistence(auth,browserLocalPersistence).catch(()=>{});

const R=p=>ref(db,p),G=async p=>(await get(R(p))).val();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=t=>t?new Date(t).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'}):'-';

let U=null,A=false,S={v:'home'},teachers={},videos={},library={},notifications={},badge='',hb=null,ip=null;
let banned=null,unsubBan=null,unsubTeachers=null,unsubVideos=null,unsubLibrary=null,unsubBans=null,unsubNoti=null;
let ytPlayer=null,pollInterval=null;

const DEVICE_KEY='sigma-device-id';
function getDeviceId(){let id=localStorage.getItem(DEVICE_KEY);if(!id){id='d'+Date.now()+Math.random().toString(36).slice(2,8);localStorage.setItem(DEVICE_KEY,id)}return id}
function deviceLabel(){const ua=navigator.userAgent;if(/android/i.test(ua))return'Android';if(/iPhone|iPad|iPod/i.test(ua))return'iOS';if(/Windows/i.test(ua))return'Windows';if(/Mac/i.test(ua))return'Mac';if(/Linux/i.test(ua))return'Linux';return'جهاز'}

const THEME_KEY='sigma-theme';
function initTheme(){const saved=localStorage.getItem(THEME_KEY);const prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;if(saved==='dark'||(!saved&&prefersDark))document.documentElement.classList.add('dark')}
function toggleTheme(){document.documentElement.classList.toggle('dark');localStorage.setItem(THEME_KEY,document.documentElement.classList.contains('dark')?'dark':'light');render()}
initTheme();

function toast(m){const t=$('#t');t.textContent=m;t.classList.add('show');clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove('show'),2400)}
const img=(f,s)=>new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=s;const m=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,s,s);r(c.toDataURL('image/jpeg',.8))};i.src=URL.createObjectURL(f)});

(()=>{
  const c=document.createElement('canvas');c.width=c.height=192;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,192,192);g.addColorStop(0,'#2563eb');g.addColorStop(1,'#1d4ed8');
  x.fillStyle=g;x.fillRect(0,0,192,192);x.fillStyle='#fff';x.font='bold 120px sans-serif';
  x.textAlign='center';x.textBaseline='middle';x.fillText('S',96,104);
  const u=c.toDataURL('image/png');
  $('#ai').href=u;
  const m={name:'منصة سيجما التعليمية',short_name:'سيجما',start_url:location.pathname,display:'standalone',background_color:'#2563eb',theme_color:'#2563eb',dir:'rtl',lang:'ar',icons:[{src:u,sizes:'192x192',type:'image/png'}]};
  $('#mf').href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
})();

addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;render()});
document.addEventListener('visibilitychange',()=>{const p=$('.pl');if(p)p.classList.toggle('bl',document.hidden)});

function embed(u){u=u.trim();let m;if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([\w-]{11})/))return{t:'yt',id:m[1],s:`https://www.youtube-nocookie.com/embed/${m[1]}?rel=0&modestbranding=1&playsinline=1&enablejsapi=1&controls=0&showinfo=0&iv_load_policy=3&fs=0&disablekb=1`};if(m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?.*?id=)([\w-]+)/))return{t:'drive',s:`https://drive.google.com/file/d/${m[1]}/preview`,id:m[1]};if(/\.(mp4|webm|ogg)(\?|$)/i.test(u))return{t:'v',s:u};return{t:'f',s:u}}

async function enforceSingleDevice(){const devId=getDeviceId();const sessionsRef=R('sessions/'+U.uid);const cur=(await get(sessionsRef)).val()||{};const now=Date.now();const existingDevice=cur.deviceId;const existingTs=cur.updatedAt||0;if(existingDevice&&existingDevice!==devId&&now-existingTs<10*60*1000){await set(R('bans/'+U.uid),{uid:U.uid,name:U.displayName||'',email:U.email||'',photo:U.photoURL||'',oldDevice:existingDevice,oldDeviceLabel:cur.deviceLabel||'',newDevice:devId,newDeviceLabel:deviceLabel(),bannedAt:now,reason:'تسجيل دخول من جهاز آخر'});return false}await set(sessionsRef,{deviceId:devId,deviceLabel:deviceLabel(),updatedAt:now,name:U.displayName||'',email:U.email||''});const ban=(await G('bans/'+U.uid));if(ban&&ban.newDevice===devId){await remove(R('bans/'+U.uid))}return true}
async function checkBan(){return await G('bans/'+U.uid)}
function renderBanned(ban){document.body.innerHTML=`<div class="ban-screen"><div class="box-max"><h1>⛔ تم حظر حسابك</h1><p>تم اكتشاف تسجيل دخول من جهاز آخر.<br>حسابك مسجّل على: <b>${esc(ban.oldDeviceLabel||'جهاز سابق')}</b><br>حاول الدخول من: <b>${esc(ban.newDeviceLabel||'جهاز جديد')}</b><br><br>تواصل مع المدير لفك الحظر.</p><p style="font-size:12px;color:var(--mu)">الإيميل: ${esc(ban.email||'')}</p><button onclick="signOut(auth).then(()=>location.reload())">خروج</button></div></div>`}
function clearListeners(){if(unsubBan)unsubBan();if(unsubTeachers)unsubTeachers();if(unsubVideos)unsubVideos();if(unsubLibrary)unsubLibrary();if(unsubBans)unsubBans();if(unsubNoti)unsubNoti()}

onAuthStateChanged(auth,async u=>{
clearListeners();U=u;A=!!u&&ADMIN_EMAILS.includes((u.email||'').toLowerCase());

function vTeacher(){

  const isPrep = S.filter==='prep';

  let html = `<button class="s" onclick="go('teacher','${S.id}')" style="margin-bottom:16px">← رجوع</button><h2>${esc(t.name)} - ${isPrep?'إعدادي':'ثانوي'}</h2>`;

    }
  });

function initPlayer(){const el=document.getElementById('vplayer');if(!el)return;if(el.tagName==='IFRAME'&&el.src.includes('youtube')){if(!window.YT){const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);window.onYouTubeIframeAPIReady=()=>setupYT()}else{setupYT()}}else if(el.tagName==='VIDEO'){el.addEventListener('timeupdate',updateUI);el.addEventListener('loadedmetadata',updateUI);el.addEventListener('play',()=>{document.getElementById('playPauseBtn').textContent='❚❚';updateUI()});el.addEventListener('pause',()=>{document.getElementById('playPauseBtn').textContent='▶';updateUI()})}}
function setupYT(){const iframe=document.getElementById('vplayer');if(!iframe)return;ytPlayer=new YT.Player(iframe,{events:{'onReady':()=>{updateUI();startPoll()},'onStateChange':(event)=>{if(event.data===1){document.getElementById('playPauseBtn').textContent='❚❚'}else{document.getElementById('playPauseBtn').textContent='▶'}}}})}
function startPoll(){stopPoll();pollInterval=setInterval(updateUI,500)}
function stopPoll(){if(pollInterval){clearInterval(pollInterval);pollInterval=null}}
function updateUI(){const seek=document.getElementById('cSeek');const cTime=document.getElementById('cTime');const dTime=document.getElementById('dTime');if(!seek)return;let cur=0,dur=0;if(ytPlayer&&ytPlayer.getCurrentTime){try{cur=ytPlayer.getCurrentTime()||0;dur=ytPlayer.getDuration()||0}catch(e){}}else{const vid=document.getElementById('vplayer');if(vid&&vid.tagName==='VIDEO'){cur=vid.currentTime||0;dur=vid.duration||0}}if(dur>0){seek.value=(cur/dur)*100;cTime.textContent=fmt(cur);dTime.textContent=fmt(dur)}}
function fmt(s){s=Math.max(0,Math.floor(s||0));const m=Math.floor(s/60),ss=s%60;return m+':'+String(ss).padStart(2,'0')}
function togglePlay(){if(ytPlayer&&ytPlayer.getPlayerState){const state=ytPlayer.getPlayerState();if(state===1){ytPlayer.pauseVideo()}else{ytPlayer.playVideo()}}else{const vid=document.getElementById('vplayer');if(vid&&vid.tagName==='VIDEO'){if(vid.paused)vid.play();else vid.pause()}}}
function onSeek(val){let dur=0,target=0;if(ytPlayer&&ytPlayer.getDuration){try{dur=ytPlayer.getDuration()||0;target=(val/100)*dur;ytPlayer.seekTo(target,true)}catch(e){}}else{const vid=document.getElementById('vplayer');if(vid&&vid.tagName==='VIDEO'){dur=vid.duration||0;vid.currentTime=(val/100)*dur}}}
function seekRel(seconds){let cur=0;if(ytPlayer&&ytPlayer.getCurrentTime){try{cur=ytPlayer.getCurrentTime()||0;ytPlayer.seekTo(cur+seconds,true)}catch(e){}}else{const vid=document.getElementById('vplayer');if(vid&&vid.tagName==='VIDEO'){cur=vid.currentTime||0;vid.currentTime=cur+seconds}}}
function setRate(rate){if(ytPlayer&&ytPlayer.setPlaybackRate){try{ytPlayer.setPlaybackRate(parseFloat(rate))}catch(e){}}else{const vid=document.getElementById('vplayer');if(vid&&vid.tagName==='VIDEO'){vid.playbackRate=parseFloat(rate)}}}
function toggleFullscreen(){const box=document.getElementById('plbox');const btn=document.getElementById('fsBtn');if(!box)return;if(!document.fullscreenElement){(box.requestFullscreen||box.webkitRequestFullscreen||box.msRequestFullscreen).call(box).catch(()=>{});if(btn)btn.innerHTML='⛶ خروج من ملء الشاشة'}else{(document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen).call(document).catch(()=>{});if(btn)btn.innerHTML='⛶ ملء الشاشة'}}
function stopHB(){clearInterval(hb);hb=null}

function vAdmin(){if(!A)return'<div class="mut">غير مصرح.</div>';const tab=S.tab||'videos';const tb=`<div class="tabs">${[['videos','الفيديوهات'],['teachers','المدرسون'],['library','المكتبة'],['studentSearch','بحث طالب'],['bans','الحظر'],['badge','صورة التعريف']].map(([k,n])=>`<button class="${tab===k?'on':''}" onclick="go('admin','','${k}')">${n}</button>`).join('')}</div>`;if(tab==='teachers')return tb+`<div class="box"><h2>إضافة مدرس</h2><label>الاسم</label><input id="tn"><label>الصورة</label><input id="tp" type="file" accept="image/*"><button onclick="addT()">إضافة</button></div><div class="grid">${Object.entries(teachers).map(([id,x])=>`<div class="card" style="cursor:default"><img class="ph" src="${x.photo||''}" alt=""><b>${esc(x.name)}</b><div style="display:flex;gap:6px;justify-content:center;margin-top:10px"><button class="s" style="padding:6px 10px;font-size:12px" onclick="go('edit','${id}','teacher')">تعديل</button><button class="d" style="padding:6px 10px;font-size:12px" onclick="delT('${id}')">حذف</button></div></div>`).join('')}</div>`;if(tab==='library')return tb+`<div class="box"><h2>إضافة ملف PDF</h2><label>العنوان</label><input id="ltn"><label>الوصف</label><input id="ltd"><label>صورة الغلاف (اختياري)</label><input id="ltp" type="file" accept="image/*"><label>رابط الملف</label><input id="ltu" dir="ltr" placeholder="https://..."><button onclick="addLib()">إضافة</button></div><div class="grid">${Object.entries(library).sort((a,b)=>b[1].created-a[1].created).map(([id,x])=>`<div class="card" style="cursor:default"><img class="ph" src="${x.photo||'https://ui-avatars.com/api/?name=PDF&background=2563eb&color=fff&size=200'}" alt=""><b>${esc(x.title)}</b><div style="display:flex;gap:6px;justify-content:center;margin-top:10px"><button class="s" style="padding:6px 10px;font-size:12px" onclick="go('editLib','${id}')">تعديل</button><button class="d" style="padding:6px 10px;font-size:12px" onclick="delLib('${id}')">حذف</button></div></div>`).join('')}</div>`;if(tab==='badge')return tb+`<div class="box"><h2>صورة التعريف</h2><p style="color:var(--tx2);margin-bottom:14px;line-height:1.7">تظهر بجانب اسم كل طالب وعلى العلامة المائية.</p>${badge?`<img src="${badge}" style="width:100px;height:100px;border-radius:50%;margin-bottom:14px;border:3px solid var(--ac-soft)">`:''}<input id="bp" type="file" accept="image/*"><button onclick="setB()">حفظ</button></div>`;if(tab==='bans')return tb+renderBans();if(tab==='studentSearch')return tb+vStudentSearch();const tOpts=Object.entries(teachers).map(([id,x])=>`<option value="${id}">${esc(x.name)}</option>`).join('');return tb+`<div class="box"><h2>إضافة فيديو</h2><label>المدرس</label><select id="vt">${tOpts}</select><label>المرحلة</label><select id="vs"><option value="prep">إعدادي</option><option value="sec">ثانوي</option></select><label>الصف</label><select id="vg"><option>الصف الأول الإعدادي</option><option>الصف الثاني الإعدادي</option><option>الصف الثالث الإعدادي</option><option>الصف الأول الثانوي</option><option>الصف الثاني الثانوي</option><option>الصف الثالث الثانوي</option></select><label>العنوان</label><input id="vn"><label>الوصف</label><textarea id="vd" rows="2"></textarea><label>رابط الفيديو</label><input id="vu" dir="ltr" placeholder="https://..."><label>مدة الفيديو بالدقائق</label><input id="vm" type="number" min="0"><label>عدد الأكواد</label><input id="vc" type="number" min="0" value="10"><button onclick="addV()">حفظ وتوليد الأكواد</button></div><h2>الفيديوهات</h2>${Object.entries(videos).sort((a,b)=>b[1].created-a[1].created).map(([id,v])=>`<div class="row"><div onclick="go('vid','${id}')" style="cursor:pointer"><b>${esc(v.title)}</b><small>${esc(teachers[v.teacherId]?.name||'-')} | ${esc(v.grade||'-')}${v.disabled?' — موقوف':''}</small></div><button class="s" onclick="go('edit','${id}','video')" style="padding:8px 14px;font-size:13px">تعديل</button><button class="s" onclick="go('vid','${id}')" style="padding:8px 14px;font-size:13px">السجل</button></div>`).join('')||'<div class="mut">لا توجد فيديوهات.</div>'}`}

function vStudentSearch(){
  return `<div class="box"><h2>بحث عن طالب</h2><label>اسم الطالب أو الإيميل</label><div style="display:flex;gap:8px"><input id="searchStudent" placeholder="اكتب الاسم أو الإيميل..." style="margin-bottom:0"><button onclick="doStudentSearch()">بحث</button></div></div><div id="studentResult"></div>`;
}
async function doStudentSearch(){
  const q=$('#searchStudent').value.trim().toLowerCase();
  if(!q)return;
  const res=$('#studentResult');res.innerHTML='<div class="mut">جارٍ البحث...</div>';
  
  const allLogs = await G('logs') || {};
  const studentLogs = {};
  
  for (const vid in allLogs) {
    for (const uid in allLogs[vid]) {
      const log = allLogs[vid][uid];
      if ((log.name && log.name.toLowerCase().includes(q)) || (log.email && log.email.toLowerCase().includes(q))) {
        if (!studentLogs[uid]) studentLogs[uid] = {name: log.name, email: log.email, videos: []};
        studentLogs[uid].videos.push({vid, title: videos[vid]?.title || 'محذوف', time: log.lastAt, completed: log.completed});
      }
    }
  }
  
  const entries = Object.values(studentLogs);
  if (!entries.length) { res.innerHTML = '<div class="mut">لم يتم العثور على نتائج.</div>'; return; }
  
  res.innerHTML = entries.map(s => `
    <div class="box">
      <h3>${esc(s.name)} <small style="color:var(--mu);font-size:12px">(${esc(s.email)})</small></h3>
      <p style="margin:10px 0;font-weight:bold">عدد المحاضرات التي حضرها: <span class="b g">${s.videos.length}</span></p>
      <table style="margin-top:10px">
        <tr><th>المحاضرة</th><th>آخر مشاهدة</th><th>الحالة</th></tr>
        ${s.videos.map(v => `<tr><td>${esc(v.title)}</td><td>${fd(v.time)}</td><td>${v.completed ? '<span class="g">أكمل</span>' : '<span class="y">لم يكمل</span>'}</td></tr>`).join('')}
      </table>
    </div>
  `).join('');
}

async function renderBans(){const bans=await G('bans')||{};const entries=Object.values(bans);const note=`<div class="box" style="background:var(--ac-soft);border-color:var(--ac)"><b>ملاحظة:</b> حسابات الإدارة محمية ولا تُحظر أبداً.</div>`;if(!entries.length)return note+`<div class="mut">لا يوجد طلاب محظورون.</div>`;return note+`<h2>الطلاب المحظورون (${entries.length})</h2>`+entries.map(b=>`<div class="box"><div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">${b.photo?`<img src="${esc(b.photo)}" style="width:50px;height:50px;border-radius:50%;object-fit:cover">`:''}<div style="flex:1"><b>${esc(b.name||'')}</b><br><small style="color:var(--mu)">${esc(b.email||'')}</small></div><span class="b r">محظور</span></div><p style="color:var(--tx2);font-size:13px;line-height:1.8;margin-bottom:12px">الجهاز السابق: <b>${esc(b.oldDeviceLabel||'-')}</b><br>الجهاز الجديد: <b>${esc(b.newDeviceLabel||'-')}</b><br>وقت الحظر: ${fd(b.bannedAt)}</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="g" onclick="unban('${esc(b.uid)}')">فك الحظر</button><button class="s" onclick="keepBan('${esc(b.uid)}')">تركه محظوراً</button></div></div>`).join('')}

async function unban(uid){await remove(R('bans/'+uid));toast('تم فك الحظر');render()}
async function keepBan(uid){toast('بقي محظوراً')}
async function addT(){const n=$('#tn').value.trim(),f=$('#tp').files[0];if(!n)return toast('اكتب اسم المدرس');const k='t'+Date.now();const photo=f?await img(f,200):'';await set(R('teachers/'+k),{name:n,photo});toast('تمت الإضافة');render()}
async function delT(id){if(!confirm('حذف المدرس؟'))return;await remove(R('teachers/'+id));toast('تم الحذف');render()}
async function setB(){const f=$('#bp').files[0];if(!f)return toast('اختر صورة');badge=await img(f,160);await set(R('settings/badge'),badge);toast('تم الحفظ');render()}

async function addV(){
  const v={teacherId:$('#vt').value,stage:$('#vs').value,grade:$('#vg').value,title:$('#vn').value.trim(),desc:$('#vd').value.trim(),url:$('#vu').value.trim(),duration:+$('#vm').value||0,created:Date.now(),disabled:false};
  if(!v.teacherId||!v.title||!v.url)return toast('أكمل الحقول');
  const k='v'+Date.now();await set(R('videos/'+k),v);
  const n=Math.min(+$('#vc').value||0,500);if(n)await gen(k,n);
  
  await set(R('notifications/all/'+Date.now()), {text: `تمت إضافة فيديو جديد: ${v.title}`, created: Date.now()});
  
  toast('تم الحفظ');go('vid',k);
}

function vEdit(){if(!A)return'<div class="mut">غير مصرح.</div>';const isT=S.tab==='teacher';const data=isT?teachers[S.id]:videos[S.id];if(!data)return vAdmin();if(isT){return`<button class="s" onclick="go('admin','','teachers')">← رجوع</button><h2 style="margin-top:14px">تعديل المدرس</h2><div class="box"><label>الاسم</label><input id="etn" value="${esc(data.name)}"><label>الصورة (اختياري)</label><input id="etp" type="file" accept="image/*"><div style="display:flex;gap:8px;margin-top:8px"><button onclick="saveEditT('${S.id}')">حفظ</button><button class="s" onclick="go('admin','','teachers')">إلغاء</button></div></div>`}else{const tOpts=Object.entries(teachers).map(([id,x])=>`<option value="${id}" ${id===data.teacherId?'selected':''}>${esc(x.name)}</option>`).join('');return`<button class="s" onclick="go('admin','','videos')">← رجوع</button><h2 style="margin-top:14px">تعديل الفيديو</h2><div class="box"><label>المدرس</label><select id="evt">${tOpts}</select><label>المرحلة</label><select id="evs"><option value="prep" ${data.stage==='prep'?'selected':''}>إعدادي</option><option value="sec" ${data.stage==='sec'?'selected':''}>ثانوي</option></select><label>الصف</label><select id="evg"><option ${data.grade==='الصف الأول الإعدادي'?'selected':''}>الصف الأول الإعدادي</option><option ${data.grade==='الصف الثاني الإعدادي'?'selected':''}>الصف الثاني الإعدادي</option><option ${data.grade==='الصف الثالث الإعدادي'?'selected':''}>الصف الثالث الإعدادي</option><option ${data.grade==='الصف الأول الثانوي'?'selected':''}>الصف الأول الثانوي</option><option ${data.grade==='الصف الثاني الثانوي'?'selected':''}>الصف الثاني الثانوي</option><option ${data.grade==='الصف الثالث الثانوي'?'selected':''}>الصف الثالث الثانوي</option></select><label>العنوان</label><input id="evn" value="${esc(data.title)}"><label>الوصف</label><textarea id="evd" rows="2">${esc(data.desc||'')}</textarea><label>رابط الفيديو</label><input id="evu" dir="ltr" value="${esc(data.url)}"><label>مدة الفيديو بالدقائق</label><input id="evm" type="number" min="0" value="${data.duration||0}"><label>الحالة</label><select id="evst"><option value="0" ${!data.disabled?'selected':''}>نشط</option><option value="1" ${data.disabled?'selected':''}>موقوف</option></select><div style="display:flex;gap:8px;margin-top:8px"><button onclick="saveEditV('${S.id}')">حفظ</button><button class="s" onclick="go('admin','','videos')">إلغاء</button></div></div>`}}
function vEditLib(){if(!A)return'<div class="mut">غير مصرح.</div>';const data=library[S.id];if(!data)return vAdmin();return`<button class="s" onclick="go('admin','','library')">← رجوع</button><h2 style="margin-top:14px">تعديل الملف</h2><div class="box"><label>العنوان</label><input id="eltn" value="${esc(data.title)}"><label>الوصف</label><input id="eltd" value="${esc(data.desc||'')}"><label>صورة الغلاف (اختياري)</label><input id="eltp" type="file" accept="image/*"><label>رابط الملف</label><input id="eltu" dir="ltr" value="${esc(data.url)}"><div style="display:flex;gap:8px;margin-top:8px"><button onclick="saveEditLib('${S.id}')">حفظ</button><button class="s" onclick="go('admin','','library')">إلغاء</button></div></div>`}
async function saveEditT(id){const n=$('#etn').value.trim(),f=$('#etp').files[0];if(!n)return toast('اكتب الاسم');const t=teachers[id];const photo=f?await img(f,200):(t.photo||'');await update(R('teachers/'+id),{name:n,photo});toast('تم التعديل');go('admin','','teachers')}
async function saveEditV(id){const v=videos[id];if(!v)return;const nv={teacherId:$('#evt').value,stage:$('#evs').value,grade:$('#evg').value,title:$('#evn').value.trim(),desc:$('#evd').value.trim(),url:$('#evu').value.trim(),duration:+$('#evm').value||0,disabled:$('#evst').value==='1'};if(!nv.teacherId||!nv.title||!nv.url)return toast('أكمل الحقول');await update(R('videos/'+id),nv);try{const s=await get(query(R('codes'),orderByChild('videoId'),equalTo(id)));const updates={};s.forEach(c=>{updates['codes/'+c.key+'/url']=nv.url;updates['codes/'+c.key+'/title']=nv.title});if(Object.keys(updates).length)await update(R('/'),updates)}catch(e){}toast('تم التعديل');go('admin','','videos')}
async function saveEditLib(id){const n=$('#eltn').value.trim(),d=$('#eltd').value.trim(),u=$('#eltu').value.trim(),f=$('#eltp').files[0];if(!n||!u)return toast('أكمل الحقول');const l=library[id];const photo=f?await img(f,200):(l.photo||'');await update(R('library/'+id),{title:n,desc:d,url:u,photo});toast('تم التعديل');go('admin','','library')}
async function gen(vid,n){const v=videos[vid];let ok=0;while(ok<n){const c=String(crypto.getRandomValues(new Uint32Array(1))[0]%900000+100000);const r=await runTransaction(R('codes/'+c),cur=>cur===null?{videoId:vid,url:v.url,title:v.title,used:false,createdAt:Date.now()}:undefined);if(r.committed)ok++}return ok}
async function moreCodes(vid,one){const n=one?1:Math.min(+$('#gn').value||0,500);if(!n)return toast('اكتب العدد');toast('جارٍ التوليد...');await gen(vid,n);render()}
async function delV(id){if(!confirm('حذف الفيديو؟'))return;await remove(R('videos/'+id));toast('تم الحذف');go('admin','','videos')}
async function toggleVid(id){const v=videos[id];if(!v)return;const next=!v.disabled;if(!confirm(next?'إيقاف الأكواد؟':'إعادة التفعيل؟'))return;await update(R('videos/'+id),{disabled:next});toast(next?'تم الإيقاف':'تم التفعيل');render()}
const cp=t=>navigator.clipboard.writeText(t).then(()=>toast('تم النسخ'));
window.copyFree=async id=>{const s=await get(query(R('codes'),orderByChild('videoId'),equalTo(id)));const a=[];s.forEach(c=>{if(!c.val().used)a.push(c.key)});cp(a.join('\n'))};

function exportPDF(vid){const v=videos[vid];if(!v)return;const rows=[];document.querySelectorAll('#pdf-src tbody tr').forEach(tr=>{const tds=tr.querySelectorAll('td');if(tds.length)rows.push([...tds].map(td=>td.innerText.trim()))});const headers=[...document.querySelectorAll('#pdf-src thead th')].map(th=>th.innerText.trim());const win=window.open('','_blank');win.document.write(`<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>${v.title}</title><style>body{font-family:Cairo,sans-serif;padding:24px;color:#0f172a}h2{color:#2563eb}table{width:100%;border-collapse:collapse;margin-top:14px;font-size:12px}th,td{border:1px solid #cbd5e1;padding:8px;text-align:right}th{background:#2563eb;color:#fff}@media print{button{display:none}}</style></head><body><h2>${v.title}</h2><p>${v.desc||''}</p><p>عدد السجلات: ${rows.length}</p><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table><br><button onclick="window.print()">طباعة / حفظ PDF</button><script>window.onload=()=>setTimeout(()=>window.print(),400)<\/script></body></html>`);win.document.close()}

async function vVid(){const id=S.id,v=videos[id];if(!v)return vAdmin();const cs=[];(await get(query(R('codes'),orderByChild('videoId'),equalTo(id)))).forEach(c=>{cs.push({c:c.key,...c.val()})});cs.sort((a,b)=>b.createdAt-a.createdAt);const lg=Object.values(await G('logs/'+id)||{}).sort((a,b)=>b.lastAt-a.lastAt);const st=l=>l.completed?'<span class="g">حضره كاملاً</span>':l.seconds>20?'<span class="y">شاهد جزءًا</span>':'<span>فتح فقط</span>';return`<button class="s" onclick="go('admin','','videos')">← رجوع</button><h2 style="margin-top:14px">${esc(v.title)} ${v.disabled?'<span class="b r">موقوف</span>':''}</h2><div class="box"><p style="color:var(--mu);margin-bottom:10px">${esc(teachers[v.teacherId]?.name||'')} — ${esc(v.desc||'')}</p><p style="margin-bottom:14px"><span class="b">${cs.length} كود</span> <span class="b g">${cs.filter(x=>!x.used).length} متاح</span> <span class="b">${lg.length} فتحوه</span> <span class="b g">${lg.filter(x=>x.completed).length} أكملوه</span></p><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end"><div style="width:110px"><label>العدد</label><input id="gn" type="number" min="1" value="10" style="margin-bottom:0"></div><button onclick="moreCodes('${id}')">توليد أكواد</button><button class="s" onclick="moreCodes('${id}',1)">كود لطالب</button><button class="s" onclick="copyFree('${id}')">نسخ المتاح</button><button class="s" onclick="go('edit','${id}','video')">تعديل</button><button class="${v.disabled?'g':'d'}" onclick="toggleVid('${id}')">${v.disabled?'تفعيل':'إيقاف'}</button><button class="s" onclick="exportPDF('${id}')">تصدير PDF</button><button class="d" onclick="delV('${id}')">حذف</button></div></div><h2>سجل الطلاب</h2><div class="box tw"><table id="pdf-src"><thead><tr><th>الطالب</th><th>الإيميل</th><th>الكود المستخدم</th><th>أول فتح</th><th>آخر نشاط</th><th>المشاهدة</th><th>الحالة</th></tr></thead><tbody>${lg.map(l=>`<tr><td>${esc(l.name)}</td><td>${esc(l.email)}</td><td>${esc(l.code||'-')}</td><td>${fd(l.openedAt)}</td><td>${fd(l.lastAt)}</td><td>${Math.round((l.seconds||0)/60)} د</td><td>${st(l)}</td></tr>`).join('')||'<tr><td colspan="7" class="mut">لم يفتحه أحد بعد.</td></tr>'}</tbody></table></div><h2>الأكواد</h2><div class="box tw"><table><thead><tr><th>الكود</th><th>الحالة</th><th>استخدمه</th><th>الوقت</th><th></th></tr></thead><tbody>${cs.map(x=>`<tr><td><span class="code">${x.c}</span></td><td>${x.used?'<span class="b r">مستخدم</span>':'<span class="b g">متاح</span>'}</td><td>${esc(x.usedByName||'-')}</td><td>${fd(x.usedAt)}</td><td>${x.used?'':`<button class="s" style="padding:5px 12px" onclick="cp('${x.c}')">نسخ</button>`}</td></tr>`).join('')}</tbody></table></div>`}

Object.assign(window,{login,go,out,inst,redeem,addT,delT,setB,addV,moreCodes,delV,cp,toggleVid,exportPDF,toggleTheme,unban,keepBan,saveEditT,saveEditV,togglePlay,onSeek,seekRel,setRate,toggleFullscreen,addLib,delLib,saveEditLib,openNoti,closeNoti,doStudentSearch});
render();
