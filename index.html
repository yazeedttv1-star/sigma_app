<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>منصة سيجما التعليمية</title>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" id="mf">
<link rel="apple-touch-icon" id="ai">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7fb;--surface:#fff;--surface2:#f1f5f9;
  --tx:#0f172a;--tx2:#475569;--mu:#8a96a8;
  --ac:#2563eb;--ac2:#1d4ed8;--ac-soft:#e0ebff;
  --ok:#10b981;--er:#ef4444;--warn:#f59e0b;
  --bd:#e5eaf2;--r:16px;--r-sm:11px;--r-lg:22px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 18px rgba(15,23,42,.05);
  --shadow-lg:0 14px 44px rgba(15,23,42,.16);
}
html.dark{
  --bg:#0a1122;--surface:#101a30;--surface2:#17233f;
  --tx:#f1f5f9;--tx2:#cbd5e1;--mu:#7c8aa3;
  --ac:#60a5fa;--ac2:#3b82f6;--ac-soft:#1b3370;
  --bd:#1f2b45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --shadow-lg:0 14px 44px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{min-height:100%;-webkit-text-size-adjust:100%}
body{font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx);
  min-height:100vh;min-height:100dvh;padding-bottom:calc(120px + env(safe-area-inset-bottom));overflow-x:hidden;
  -webkit-user-select:none;user-select:none;transition:background .25s,color .25s}
input,select,textarea{-webkit-user-select:text;user-select:text}
h1,h2,h3{font-weight:800;line-height:1.3}
h2{font-size:20px;margin-bottom:16px}
#loading-overlay{position:fixed;inset:0;z-index:9999;background:rgba(245,247,251,.85);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .3s}
html.dark #loading-overlay{background:rgba(10,17,34,.85)}
#loading-overlay.hide{opacity:0;pointer-events:none}
.spinner{width:40px;height:40px;border:4px solid var(--ac-soft);border-top-color:var(--ac);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}

.top-bar{background:linear-gradient(135deg,var(--ac) 0%,var(--ac2) 100%);color:#fff;padding:24px 20px;
  border-bottom-left-radius:28px;border-bottom-right-radius:28px;margin-bottom:22px;
  display:flex;justify-content:space-between;align-items:flex-start;box-shadow:var(--shadow-lg)}
.top-bar h1{font-size:22px;margin-bottom:4px}
.top-bar p{font-size:14px;opacity:.9;margin-bottom:14px}
.top-bar .avatar-lg{width:58px;height:58px;border-radius:50%;border:3px solid rgba(255,255,255,.45);object-fit:cover;cursor:pointer;background:#fff}
.actions{display:flex;gap:9px;align-items:center}
.icon-only{width:42px;height:42px;padding:0;border-radius:50%;position:relative;flex:0 0 42px;
  background:rgba(255,255,255,.2);color:#fff;box-shadow:none}
.icon-only:hover{background:rgba(255,255,255,.32);transform:none;box-shadow:none}
.icon-only svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge-dot{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;
  background:var(--er);color:#fff;border:2px solid var(--ac);font-size:10px;font-weight:800;
  display:none;align-items:center;justify-content:center;animation:pop2 .4s}
@keyframes pop2{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

main{max-width:1000px;margin:0 auto;padding:0 20px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);cursor:pointer;text-align:center;
  transition:.2s;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.card:hover{border-color:var(--ac);box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.card:active{transform:scale(.98)}
.card .card-img-wrap{width:100%;height:160px;background:linear-gradient(135deg,#dbe7ff,#f1f5f9)}
.card .card-img-wrap img{width:100%;height:100%;object-fit:cover}
.card .card-body{padding:13px 10px;flex:1;display:flex;flex-direction:column;justify-content:center}
.card b{font-size:16px;display:block;font-weight:800}
.row{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;
  display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s;flex-wrap:wrap;box-shadow:var(--shadow)}
.row:hover{border-color:var(--ac);box-shadow:var(--shadow-lg)}
.row>div{flex:1;min-width:0}
.row b{font-size:15px;display:block}
.row small{color:var(--mu);font-size:13px;display:block;margin-top:2px}

button,.btn{font-family:inherit;font-weight:700;border:0;border-radius:var(--r-sm);padding:10px 18px;background:var(--ac);
  color:#fff;cursor:pointer;transition:.15s;font-size:14px;touch-action:manipulation}
button:hover{background:var(--ac2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.28)}
button:active{transform:scale(.97)}
button:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
button.s{background:var(--surface2);color:var(--tx)}
button.s:hover{background:var(--bd);box-shadow:none;transform:none}
button.d{background:var(--er)}button.d:hover{background:#dc2626}
button.g{background:var(--ok)}button.g:hover{background:#059669}
label{font-size:13px;color:var(--tx2);font-weight:700;display:block;margin-bottom:6px}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:12px 14px;border-radius:var(--r-sm);
  border:1px solid var(--bd);background:var(--surface);color:var(--tx);margin-bottom:14px;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
.box{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:22px;margin-bottom:20px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px;text-align:right;border-bottom:1px solid var(--bd)}
th{background:var(--surface2);font-weight:700;color:var(--tx2);font-size:12px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r)}
.b{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--tx2);display:inline-block}
.b.g{background:#d1fae5;color:#065f46}.b.r{background:#fee2e2;color:#991b1b}.b.y{background:#fef3c7;color:#92400e}
html.dark .b.g{background:#064e3b;color:#6ee7b7}html.dark .b.r{background:#7f1d1d;color:#fca5a5}html.dark .b.y{background:#78350f;color:#fcd34d}
.g{color:var(--ok)}.r{color:var(--er)}.y{color:var(--warn)}
.code{font-family:'Courier New',monospace;font-size:15px;letter-spacing:2px;direction:ltr;display:inline-block;
  background:var(--surface2);padding:3px 10px;border-radius:6px;color:var(--ac2);font-weight:700}
.mut{color:var(--mu);text-align:center;padding:40px 20px}
.h-sec{margin:20px 0 10px;color:var(--ac2)}

/* Player */
.player-wrap{width:100%;margin-bottom:16px}
.pl{position:relative;background:#000;border-radius:var(--r);overflow:hidden;width:100%;aspect-ratio:16/9;margin:0 auto;box-shadow:var(--shadow-lg)}
.pl iframe,.pl video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000;pointer-events:none;object-fit:contain}
.pl.is-embed iframe{pointer-events:auto}
.pl.is-yt iframe{pointer-events:none!important;transform:scale(1.01)!important}
.pl .video-blocker{position:absolute;inset:0;z-index:99;background:transparent;cursor:pointer;touch-action:none}
.pl .end-cover{position:absolute;inset:0;z-index:100;background:#000;display:none;align-items:center;justify-content:center}
.pl .end-cover button{background:var(--ac);color:#fff;padding:12px 22px;font-size:15px}
.pl .big-play-overlay{position:absolute;inset:0;z-index:101;display:none;align-items:center;justify-content:center;pointer-events:none}
.pl .big-play-btn{width:80px;height:80px;border-radius:50%;background:rgba(15,15,15,.7);border:2px solid #fff;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;padding:0}
.pl .big-play-btn:hover{transform:scale(1.08);background:rgba(15,15,15,.9)}
.pl .big-play-btn svg{width:40px;height:40px;fill:#fff;margin-left:4px}
.wm{position:absolute;pointer-events:none;z-index:22;display:flex;align-items:center;gap:6px;font-size:12px;opacity:.45;
  background:rgba(0,0,0,.6);padding:4px 10px;border-radius:99px;animation:mv 24s linear infinite alternate;direction:ltr;color:#fff;white-space:nowrap}
.wm img{width:22px;height:22px;border-radius:50%;object-fit:cover}
@keyframes mv{0%{top:20%;left:4%}25%{top:70%;left:55%}50%{top:35%;left:70%}75%{top:80%;left:8%}100%{top:20%;left:60%}}
.custom-player-ctrl{direction:ltr;background:#1e1e2f;padding:10px 14px;border-radius:8px;margin-top:8px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:var(--shadow)}
.custom-player-ctrl .ctrl-left,.custom-player-ctrl .ctrl-right{display:flex;align-items:center;flex-shrink:0}
.custom-player-ctrl .icon-btn{background:transparent;color:#fff;border:0;border-radius:0;padding:6px;margin:0 2px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:0;min-width:36px;min-height:36px;transition:transform .15s;box-shadow:none}
.custom-player-ctrl .icon-btn:hover{transform:scale(1.1);background:transparent;box-shadow:none}
.custom-player-ctrl .icon-btn svg{width:22px;height:22px;fill:#fff}
.custom-player-ctrl .time{font-size:12px;font-weight:600;color:#fff;direction:ltr;margin:0 4px;white-space:nowrap;min-width:36px;text-align:center}
.custom-player-ctrl .time-sep{color:#fff;margin:0 2px}
.custom-player-ctrl .slider-wrap{position:relative;flex:1;height:4px;background:rgba(255,255,255,.3);border-radius:99px;margin:0 10px;min-width:80px}
.custom-player-ctrl .slider-fill{position:absolute;top:0;left:0;height:100%;width:0;background:#ff0000;border-radius:99px;pointer-events:none}
.custom-player-ctrl .slider-wrap input[type=range]{position:absolute;left:0;top:-9px;width:100%;height:22px;margin:0;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;outline:none;-webkit-appearance:none;appearance:none;cursor:pointer;z-index:2;touch-action:none}
.custom-player-ctrl .slider-wrap input[type=range]::-webkit-slider-runnable-track{height:22px;background:transparent}
.custom-player-ctrl .slider-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#ff0000;border:0;margin-top:4px;cursor:pointer}
.custom-player-ctrl .slider-wrap input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#ff0000;border:0}
.player-wrap:fullscreen{background:#000;display:flex;flex-direction:column;justify-content:center;width:100%;height:100%}
.player-wrap:fullscreen .pl{flex:1;min-height:0;aspect-ratio:auto;border-radius:0;box-shadow:none}
@media (orientation:landscape) and (pointer:coarse){
  body.is-watching .bottombar{display:none!important}
  body.is-watching main{padding:0!important}
  body.is-watching .player-wrap{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:99999!important;margin:0!important;background:#000!important;display:flex!important;flex-direction:column!important}
  body.is-watching .pl{flex:1!important;min-height:0!important;height:auto!important;aspect-ratio:auto!important;border-radius:0!important;box-shadow:none!important}
  body.is-watching .custom-player-ctrl{width:100%!important;border-radius:0!important;margin-top:0!important}
}

/* Bottom bar */
.bottombar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);border:1px solid var(--bd);border-bottom:0;
  border-radius:22px 22px 0 0;display:flex;justify-content:space-around;gap:4px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 26px rgba(0,0,0,.08)}
.bottombar button{background:transparent;color:var(--tx2);border:0;padding:9px 4px;border-radius:20px;font-size:11px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;box-shadow:none;transform:none}
.bottombar button:hover{background:var(--surface2);color:var(--tx);box-shadow:none;transform:none}
.bottombar button.on{color:var(--ac);background:var(--ac-soft)}
.bottombar button.on svg{fill:var(--ac)}
.bottombar button svg{width:22px;height:22px;fill:var(--tx2)}

/* Toast + banner */
#t{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);
  padding:12px 22px;border-radius:var(--r);font-weight:700;display:none;z-index:300;box-shadow:var(--shadow-lg);max-width:90vw;text-align:center;font-size:14px}
#t.show{display:block;animation:pop .25s}
@keyframes pop{0%{transform:translateX(-50%) scale(.85);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
#nbanner{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;max-width:520px;margin:0 auto;z-index:500;
  background:var(--surface);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--shadow-lg);padding:12px 14px;
  display:flex;align-items:center;gap:12px;cursor:pointer;transform:translateY(-140%);transition:transform .4s cubic-bezier(.2,.9,.3,1.2)}
#nbanner.show{transform:translateY(0)}
#nbanner .nb-ic{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;flex-shrink:0}
#nbanner .nb-ic svg{width:20px;height:20px;fill:#fff}
#nbanner .nb-txt{flex:1;min-width:0;font-size:14px;font-weight:700;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#nbanner .nb-sub{font-size:11px;color:var(--mu);font-weight:700;margin-bottom:2px}

/* Settings */
.profile-card{text-align:center;padding:30px 20px}
.profile-card img{width:100px;height:100px;border-radius:50%;border:4px solid var(--ac-soft);margin-bottom:14px;object-fit:cover;background:var(--surface2)}
.profile-card h2{margin-bottom:8px}
.profile-card p{color:var(--mu);font-size:15px;margin-bottom:20px}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:20px}
.settings-btn{background:var(--surface2);border:1px solid var(--bd);border-radius:var(--r);padding:16px 12px;text-align:center;cursor:pointer;
  transition:.2s;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--tx)}
.settings-btn:hover{border-color:var(--ac);background:var(--ac-soft);transform:translateY(-2px)}
.settings-btn svg{width:28px;height:28px;fill:var(--ac)}
.settings-btn span{font-size:13px;font-weight:700}
.push-card{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.push-ic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--ac-soft)}
.push-ic svg{width:26px;height:26px;fill:var(--ac)}
.push-ic.ok{background:#d1fae5}.push-ic.ok svg{fill:var(--ok)}
.push-ic.warn{background:#fef3c7}.push-ic.warn svg{fill:var(--warn)}
.push-ic.den{background:#fee2e2}.push-ic.den svg{fill:var(--er)}
.push-info{flex:1;min-width:200px}
.push-info b{display:block;font-size:15px;margin-bottom:3px}
.push-info small{color:var(--mu);font-size:13px;line-height:1.6}
.pass-box{display:none;margin-top:20px;animation:pop .25s}
.pass-box.open{display:block}

/* Stats */
.stats-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.stat-box{background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--bd);border-radius:var(--r);padding:16px;text-align:center}
.stat-box .stat-num{font-size:26px;font-weight:800;color:var(--ac);margin-bottom:4px}
.stat-box .stat-label{font-size:12px;color:var(--mu);font-weight:700}
.stat-box.ok .stat-num{color:var(--ok)}.stat-box.warn .stat-num{color:var(--warn)}
.stats-table-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--bd)}
.stats-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface)}
.stats-table th{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:12px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.stats-table td{padding:12px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
.stats-table tr:last-child td{border-bottom:0}
.grade-chip{display:inline-block;padding:3px 8px;border-radius:8px;background:var(--ac-soft);color:var(--ac2);font-size:11px;font-weight:700;white-space:nowrap}
.stats-filter{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.stats-filter button{padding:8px 16px;font-size:12px;border-radius:99px;background:var(--surface2);color:var(--tx2);border:1px solid var(--bd)}
.stats-filter button.on{background:var(--ac);color:#fff;border-color:var(--ac)}

/* Auth */
.auth-container{max-width:400px;margin:0 auto;padding:40px 20px;text-align:center}
.auth-container h1{font-size:32px;color:var(--ac);margin-bottom:8px;letter-spacing:-1px}
.auth-container>p{color:var(--mu);margin-bottom:24px;font-size:15px}
.auth-btn{width:100%;padding:14px;font-size:16px;border-radius:12px;margin-bottom:12px}
.auth-form{text-align:right}
.auth-form .error{color:var(--er);font-size:13px;margin-bottom:10px;display:none;line-height:1.6}
.link-btn{color:var(--ac);font-weight:700;text-decoration:none;cursor:pointer}
.code-input{font-size:26px;text-align:center;letter-spacing:8px;font-family:monospace}

/* Admin */
.admin-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;background:var(--surface2);padding:6px;border-radius:12px}
.admin-tabs button{flex:1 1 calc(50% - 6px);padding:10px;font-size:13px;border-radius:8px;background:var(--surface);color:var(--tx2);border:1px solid var(--bd)}
.admin-tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
@media(max-width:768px){.admin-tabs button{flex:1 1 100%}}
.notice{background:var(--ac-soft);border:1px solid var(--ac);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;line-height:1.7}
.ban-screen{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.ban-screen h1{font-size:28px;color:var(--er);margin-bottom:14px}
.ban-screen p{color:var(--tx2);margin-bottom:24px;line-height:1.7}
.news-card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:16px;margin-bottom:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.news-card img{width:100%;max-height:400px;object-fit:contain;border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--surface2)}
.embed-box{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
.embed-box iframe,.embed-box video{position:absolute;inset:0;width:100%;height:100%;border:0}
.news-text{font-size:15px;line-height:1.7;white-space:pre-wrap}
.news-date{font-size:12px;color:var(--mu);font-weight:700}

/* Notifications sheet */
.modal{position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:200;display:none;align-items:flex-end;justify-content:center;padding:0}
.modal.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:85vh;display:flex;flex-direction:column;border-radius:26px 26px 0 0;
  box-shadow:var(--shadow-lg);animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:720px){.modal{align-items:center}.sheet{border-radius:26px;max-height:80vh}}
.sheet-head{padding:18px 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--bd)}
.sheet-head h3{font-size:18px}
.sheet-head small{display:block;color:var(--mu);font-size:12px;font-weight:700;margin-top:2px}
.sheet-acts{display:flex;gap:8px;align-items:center}
.sheet-acts button{padding:7px 12px;font-size:12px;border-radius:10px}
.sheet-body{padding:14px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}

/* ================= رفع الصور ================= */
function img(f,maxSize=800){
  return new Promise((resolve,reject)=>{
    if(!f)return resolve(null);
    if(!f.type.startsWith('image/'))return reject(new Error('الملف ليس صورة'));
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('تعذر قراءة الصورة'));
    reader.onload=e=>{
      const im=new Image();
      im.onload=()=>{
        let w=im.width,h=im.height;
        if(w>maxSize||h>maxSize){const r=Math.min(maxSize/w,maxSize/h);w=Math.max(1,Math.round(w*r));h=Math.max(1,Math.round(h*r))}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(im,0,0,w,h);
        let data;
        try{data=c.toDataURL('image/jpeg',0.8)}catch(err){data=c.toDataURL('image/png')}
        if(!data||data==='data:,')return reject(new Error('تعذر معالجة الصورة'));
        resolve(data);
      };
      im.onerror=()=>reject(new Error('صيغة الصورة غير مدعومة'));
      im.src=e.target.result;
    };
    reader.readAsDataURL(f);
  });
}

/* ================= الصوت والاهتزاز ================= */
const SOUND_KEY='sigma-sound';
let soundOn=store.get(SOUND_KEY)!=='off';
let audioCtx=null;
function unlockAudio(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
  }catch(e){}
}
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));
function playChime(){
  if(!soundOn)return;
  try{
    unlockAudio();
    if(!audioCtx)return;
    const t0=audioCtx.currentTime;
    [{f:880,d:0},{f:1320,d:.13}].forEach(({f,d})=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t0+d);
      g.gain.exponentialRampToValueAtTime(0.22,t0+d+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.4);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0+d);o.stop(t0+d+0.45);
    });
  }catch(e){console.warn('sound:',e)}
}
function buzz(){try{navigator.vibrate&&navigator.vibrate([120,70,120])}catch(e){}}

/* ================= الإشعارات الخارجية ================= */
function pushState(){
  if(!hasNotifApi())return{k:'x',t:'المتصفح لا يدعم الإشعارات',h:'جرّب Chrome أو Edge أو Safari.'};
  if(isIOS()&&!isStandalone())return{k:'warn',t:'أضف التطبيق للشاشة الرئيسية أولاً',h:'اضغط زر المشاركة في Safari ثم اختر "إضافة إلى الشاشة الرئيسية" ثم افتح التطبيق من هناك.'};
  const p=Notification.permission;
  if(p==='denied')return{k:'den',t:'الإشعارات محظورة من المتصفح',h:'افتح إعدادات الموقع في المتصفح وفعّل الإشعارات ثم أعد المحاولة.'};
  if(p==='granted')return{k:'ok',t:'الإشعارات مفعّلة ✅',h:'ستصلك الإشعارات داخل المنصة وخارجها حتى لو كانت مغلقة.'};
  return{k:'off',t:'الإشعارات غير مفعّلة',h:'فعّلها لتصلك الإشعارات حتى والمنصة مغلقة.'};
}
async function enableNotifications(){
  if(!hasNotifApi())return toast('المتصفح لا يدعم الإشعارات');
  if(isIOS()&&!isStandalone())return toast('أضف التطبيق للشاشة الرئيسية أولاً');
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){
      toast(perm==='denied'?'تم رفض الإشعارات من إعدادات المتصفح':'لم يتم السماح بالإشعارات');
      return;
    }
    await syncPushToken();
    toast('تم تفعيل الإشعارات ✅');
    playChime();
  }catch(e){
    console.error(e);
    toast('تعذر تفعيل الإشعارات، حاول مرة أخرى');
  }finally{
    if(S.v==='settings')render();
  }
}

async function syncPushToken(){
  if(!U||!hasNotifApi()||Notification.permission!=='granted')return;
  const [m,reg]=await Promise.all([msgReady,swReady]);
  if(!m||!reg){console.warn('Push not supported here');return;}
  const token=await getToken(m,{vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});
  if(token)await set(R(`users/${U.uid}/fcmTokens/${token}`),true);
}

}
function refreshNotifications(){
  try{
    const merged={};
    if(A){
      Object.entries(adminNotifications||{}).forEach(([id,n])=>{if(n&&typeof n==='object')merged[id]={...n,_key:id}});
    }else{
      Object.entries(broadcastNotifications||{}).forEach(([id,n])=>{if(n&&typeof n==='object')merged[id]={...n,_key:id}});
      Object.entries(ownNotifications||{}).forEach(([id,n])=>{if(n&&typeof n==='object')merged[id]={...(merged[id]||{}),...n,_key:id}});
    }
    notifications=Object.fromEntries(Object.entries(merged).filter(([,n])=>!n.dismissed));

    // اكتشاف الإشعارات الجديدة
    const keys=Object.keys(notifications);
    if(seenIds===null||!notiBaselineReady){
      seenIds=new Set(keys);
    }else{
      const fresh=Object.values(notifications).filter(n=>!seenIds.has(n._key)).sort((a,b)=>(b.created||0)-(a.created||0));
      keys.forEach(k=>seenIds.add(k));
      if(fresh.length){
        alertNew(fresh[0]);
        if(!$('#notiModal').classList.contains('show'))setText('notiHead','');
      }
    }

    const unread=Object.values(notifications).filter(n=>!n.read).length;
    const dot=document.getElementById('notiBadge');
    if(dot){dot.textContent=unread>99?'99+':String(unread);dot.style.display=unread?'flex':'none'}
    if($('#notiModal')?.classList.contains('show'))renderNoti();
  }catch(e){reportError(e)}
}
function openNoti(){$('#notiModal').classList.add('show');renderNoti()}
function closeNoti(){$('#notiModal').classList.remove('show')}
function renderNoti(){
  const list=Object.values(notifications).sort((a,b)=>(b.created||0)-(a.created||0));
  const body=$('#notiBody');
  const unread=list.filter(n=>!n.read).length;
  setText('notiHead',list.length?(unread?`${unread} غير مقروء`:'كل الإشعارات مقروءة'):'لا توجد إشعارات');
  if(!list.length){
    body.innerHTML=`<div class="nempty"><div class="big"><svg viewBox="0 0 24 24"><path d="${BELL_PATH}"/></svg></div><p style="font-weight:700">لا توجد إشعارات حالياً</p><small>ستظهر هنا أي رسالة من الإدارة</small></div>`;
    return;
  }
  body.innerHTML=list.map(n=>`
    <div class="ncard ${n.read?'':'unread'}">
      <div class="nic"><svg viewBox="0 0 24 24"><path d="${BELL_PATH}"/></svg></div>
      <div class="nbody">
        <div class="ntxt">${esc(n.text||'إشعار جديد')}</div>
        <div class="nmeta"><span>${ago(n.created)}</span>${n.read?'':'<i class="ndot"></i>'}</div>
      </div>
      <button class="ndel" onclick="delNoti('${esc(n._key)}')" aria-label="حذف الإشعار">✕</button>
    </div>`).join('');
  // تعليم الإشعارات كمقروءة بعد العرض
  if(U){
    const updates={};
    list.forEach(n=>{if(!n.read)updates[n._key]={text:n.text||'',created:n.created||Date.now(),read:true}});
    if(Object.keys(updates).length){
      const path=A?'adminNotifications':'notifications/'+U.uid;
      update(R(path),updates).catch(e=>console.warn('mark read:',e));
    }

const P={type:null,el:null,yt:null,ytTimer:null,seeking:false,token:0};
const ICON=p=>`<path d="${p}"/>`;
let ytLoading=false,ytQueue=[];
function loadYT(cb){
  if(window.YT&&window.YT.Player){cb(true);return}
  ytQueue.push(cb);
  if(ytLoading)return;
  ytLoading=true;
  window.onYouTubeIframeAPIReady=()=>{const q=ytQueue;ytQueue=[];q.forEach(f=>{try{f(true)}catch(e){}})};
  const s=document.createElement('script');
  s.src='https://www.youtube.com/iframe_api';s.async=true;
  s.onerror=()=>{ytLoading=false;const q=ytQueue;ytQueue=[];q.forEach(f=>{try{f(false)}catch(e){}})};
  document.head.appendChild(s);
}
function pIsPlaying(){
  if(P.type==='native')return !!P.el&&!P.el.paused&&!P.el.ended;
  if(P.type==='yt'&&P.yt){try{return P.yt.getPlayerState()===1}catch(e){return false}}
  return false;
}
function pGetTime(){
  if(P.type==='native')return P.el?P.el.currentTime||0:0;
  if(P.type==='yt'&&P.yt){try{return P.yt.getCurrentTime()||0}catch(e){return 0}}
  return 0;
}
function pGetDur(){
  if(P.type==='native'){const d=P.el?P.el.duration:0;return Number.isFinite(d)?d:0}
  if(P.type==='yt'&&P.yt){try{return P.yt.getDuration()||0}catch(e){return 0}}
  return 0;
}
function pSeekTo(t){
  if(P.type==='native'&&P.el)P.el.currentTime=t;
  else if(P.type==='yt'&&P.yt){try{P.yt.seekTo(t,true)}catch(e){}}
}
function isMutedNow(){
  if(P.type==='native')return !!(P.el&&P.el.muted);
  if(P.type==='yt'&&P.yt){try{return P.yt.isMuted()}catch(e){return false}}
  return false;
}
function setMuteIcon(m){const i=document.getElementById('muteIcon');if(i)i.innerHTML=ICON(m?MUTE_ON_PATH:MUTE_OFF_PATH)}
function setFsIcon(on){const i=document.getElementById('fsIcon');if(i)i.innerHTML=ICON(on?FS_EXIT_PATH:FS_ENTER_PATH)}
function syncPlayUI(){
  const playing=pIsPlaying();
  const i=document.getElementById('playIcon');if(i)i.innerHTML=ICON(playing?PAUSE_PATH:PLAY_PATH);
  const ov=document.getElementById('bigPlayOverlay');if(ov)ov.style.display=playing?'none':'flex';
}
function syncProgress(){
  if(P.seeking)return;
  const cur=pGetTime(),dur=pGetDur();
  setText('cTime',fmtTime(cur));setText('dTime',fmtTime(dur));
  const pct=dur>0?clamp(cur/dur*100,0,100):0;
  const seek=document.getElementById('cSeek');if(seek)seek.value=String(Math.round(pct*10));
  const fill=document.getElementById('seekFill');if(fill)fill.style.width=pct+'%';
}
function syncMute(){setMuteIcon(isMutedNow())}
function showEndCover(on){const c=document.getElementById('endCover');if(c)c.style.display=on?'flex':'none'}
function fmtTime(v){
  if(!Number.isFinite(v)||v<0)return'0:00';
  const n=Math.floor(v),h=Math.floor(n/3600),m=Math.floor((n%3600)/60),s=n%60;
  const ss=String(s).padStart(2,'0');
  return h>0?`${h}:${String(m).padStart(2,'0')}:${ss}`:`${m}:${ss}`;
}
function destroyPlayer(){
  if(P.ytTimer){clearInterval(P.ytTimer);P.ytTimer=null}
  if(P.yt){try{P.yt.destroy()}catch(e){}}
  P.yt=null;P.el=null;P.type=null;P.seeking=false;P.token++;pendingEmbed=null;
}
function initPlayer(){
  destroyPlayer();
  const pe=pendingEmbedSnapshot;if(!pe)return;
  const token=P.token;
  if(pe.type==='v')initNative(token);
  else if(pe.type==='yt')initYT(pe.id,token);
  else P.type='embed';
  bindSeek();
}
function initNative(token){
  const v=document.getElementById('vplayer');
  if(!v||token!==P.token)return;
  P.type='native';P.el=v;
  v.addEventListener('play',syncPlayUI);v.addEventListener('pause',syncPlayUI);
  v.addEventListener('ended',()=>{syncPlayUI();syncProgress()});
  v.addEventListener('timeupdate',syncProgress);v.addEventListener('loadedmetadata',syncProgress);
  v.addEventListener('durationchange',syncProgress);v.addEventListener('volumechange',syncMute);
  v.addEventListener('error',()=>toast('تعذر تشغيل الفيديو، تحقق من الرابط أو الاتصال'));
  syncPlayUI();syncProgress();syncMute();
}
function initYT(id,token){
  P.type='yt';
  const guard=setTimeout(()=>{if(token===P.token&&!P.yt)toast('تعذر تحميل مشغل يوتيوب، تحقق من الاتصال')},12000);
  loadYT(ok=>{
    clearTimeout(guard);
    if(token!==P.token)return;
    if(!ok){toast('تعذر تحميل مشغل يوتيوب');return}
    if(!document.getElementById('vplayer'))return;
    try{
      P.yt=new YT.Player('vplayer',{events:{
        onReady:()=>{if(token!==P.token)return;startYTTimer();syncPlayUI();syncMute();syncProgress()},
        onStateChange:e=>{if(token!==P.token)return;syncPlayUI();if(e.data===0)showEndCover(true);else if(e.data===1)showEndCover(false)}
      }});
    }catch(e){toast('تعذر تشغيل الفيديو')}
  });
}
function startYTTimer(){
  if(P.ytTimer)clearInterval(P.ytTimer);
  P.ytTimer=setInterval(()=>{if(!P.yt)return;syncPlayUI();syncProgress();syncMute()},250);
}
function bindSeek(){
  const s=document.getElementById('cSeek');
  if(!s||s._bound)return;
  s._bound=true;
  const start=()=>{P.seeking=true};
  s.addEventListener('pointerdown',start);s.addEventListener('touchstart',start,{passive:true});
  s.addEventListener('input',()=>{
    P.seeking=true;const dur=pGetDur();
    setText('cTime',fmtTime(dur*(s.value/1000)));
    const f=document.getElementById('seekFill');if(f)f.style.width=(s.value/10)+'%';
  });
  s.addEventListener('change',()=>{const dur=pGetDur();if(dur>0)pSeekTo(dur*(s.value/1000));P.seeking=false;syncProgress()});
  const endDrag=()=>setTimeout(()=>{P.seeking=false},300);
  s.addEventListener('pointerup',endDrag);s.addEventListener('touchend',endDrag);s.addEventListener('pointercancel',endDrag);
}
function togglePlay(){
  const next=!pIsPlaying();
  const i=document.getElementById('playIcon');if(i)i.innerHTML=ICON(next?PAUSE_PATH:PLAY_PATH);
  const ov=document.getElementById('bigPlayOverlay');if(ov)ov.style.display=next?'none':'flex';
  if(P.type==='native'&&P.el){
    if(next)P.el.play().catch(()=>toast('تعذر التشغيل، اضغط مرة أخرى'));else P.el.pause();
    return;
  }
  if(P.type==='yt'&&P.yt){try{next?P.yt.playVideo():P.yt.pauseVideo()}catch(e){}}
}
function seekRel(sec){
  if(P.type==='native'&&P.el){const d=pGetDur();if(!d)return;P.el.currentTime=clamp(P.el.currentTime+sec,0,d)}
  else if(P.type==='yt'&&P.yt){try{const d=P.yt.getDuration()||0;P.yt.seekTo(clamp((P.yt.getCurrentTime()||0)+sec,0,d),true)}catch(e){}}
  syncProgress();
}
function toggleMute(){
  if(P.type==='native'&&P.el)P.el.muted=!P.el.muted;
  else if(P.type==='yt'&&P.yt){try{P.yt.isMuted()?P.yt.unMute():P.yt.mute()}catch(e){}}
  else return;
  syncMute();
}
function replayYT(){if(P.yt){try{P.yt.seekTo(0,true);P.yt.playVideo()}catch(e){}}showEndCover(false)}
function isFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
function lockLandscape(){try{const o=screen.orientation;if(o&&o.lock)o.lock('landscape').catch(()=>{})}catch(e){}}
function unlockOrientation(){try{const o=screen.orientation;if(o&&o.unlock)o.unlock()}catch(e){}}
function toggleFullscreen(){
  if(isFS()){
    const f=document.exitFullscreen||document.webkitExitFullscreen;
    if(f){try{const p=f.call(document);if(p&&p.catch)p.catch(()=>{})}catch(e){}}
    unlockOrientation();return;
  }
  const wrap=document.getElementById('playerWrap');if(!wrap)return;
  const req=wrap.requestFullscreen||wrap.webkitRequestFullscreen||wrap.webkitRequestFullScreen;
  if(req){
    try{const p=req.call(wrap);if(p&&p.then)p.then(lockLandscape).catch(fallbackFS);else lockLandscape();return}catch(e){}
  }
  fallbackFS();
}
function fallbackFS(){
  if(P.type==='native'&&P.el&&P.el.webkitEnterFullscreen){try{P.el.webkitEnterFullscreen();return}catch(e){}}
  toast('ملء الشاشة غير مدعوم هنا، أدر الهاتف للوضع الأفقي');
}
function onFsChange(){if(!isFS())unlockOrientation();setFsIcon(isFS())}
document.addEventListener('fullscreenchange',onFsChange);
document.addEventListener('webkitfullscreenchange',onFsChange);
function isPlayingForTracking(){
  if(P.type==='embed')return !document.hidden;
  if(P.type)return pIsPlaying();
  return false;
}

function switchPhoneMode(mode,e){
  if(e)e.preventDefault();
  $('#phone-register').style.display=mode==='login'?'none':'block';
  $('#phone-login').style.display=mode==='login'?'block':'none';
}
function showErr(id,msg){const el=$('#'+id);if(!el)return;el.textContent=msg;el.style.display='block'}
function authMsg(e){
  const c=e?.code||'';
  if(c==='auth/network-request-failed')return'تعذر الاتصال بالإنترنت، تحقق من الشبكة وحاول مرة أخرى';
  if(c==='auth/too-many-requests')return'محاولات كثيرة جداً، انتظر قليلاً ثم حاول مرة أخرى';
  if(c==='auth/weak-password')return'كلمة المرور ضعيفة، استخدم 6 أحرف على الأقل';
  if(c==='auth/email-already-in-use')return'رقم الهاتف مسجل بالفعل، يمكنك تسجيل الدخول.';
  if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(c))return null;
  return'حدث خطأ: '+(e?.message||c||'غير معروف');
}
function registerPhone(){return once('register',doRegister)}
async function doRegister(){
  const name=$('#reg-name').value.trim().replace(/\s+/g,' ');
  const phone=normPhone($('#reg-phone').value);
  const pass=$('#reg-pass').value,pass2=$('#reg-pass2').value;
  $('#reg-error').style.display='none';
  if(name.split(' ').filter(Boolean).length<4)return showErr('reg-error','يجب كتابة الاسم الرباعي كاملاً (4 مقاطع)');
  if(!/^01[0-9]{9}$/.test(phone))return showErr('reg-error','رقم الهاتف يجب أن يكون 11 رقم ويبدأ بـ 01');
  if(pass.length<6)return showErr('reg-error','كلمة المرور يجب أن تكون 6 أحرف على الأقل');
  if(pass!==pass2)return showErr('reg-error','كلمتا المرور غير متطابقتين');
  try{
    const fakeEmail=`${phone}@sigma.user`;
    const cred=await createUserWithEmailAndPassword(auth,fakeEmail,pass);
    await updateProfile(cred.user,{displayName:name});
    await set(R('users/'+cred.user.uid),{name,phone,email:fakeEmail,photo:'',createdAt:Date.now(),isSupervisor:false});
    toast('تم إنشاء الحساب بنجاح');
    setTimeout(()=>location.reload(),800);
  }catch(e){
    const m=authMsg(e);
    showErr('reg-error',m||'حدث خطأ غير متوقع');
  }
}
function loginPhone(){return once('login',doLogin)}
async function doLogin(){
  const phone=normPhone($('#login-phone').value);
  const pass=$('#login-pass').value;
  $('#login-error').style.display='none';
  if(!/^01[0-9]{9}$/.test(phone))return showErr('login-error','رقم الهاتف غير صحيح');
  if(!pass)return showErr('login-error','اكتب كلمة المرور');
  const failKey=`login_fails_${phone}`,lockKey=`login_lock_${phone}`;
  const lockTime=parseInt(store.get(lockKey)||'0',10);
  if(lockTime){
    const remaining=Math.ceil((lockTime-Date.now())/60000);
    if(remaining>0)return showErr('login-error',`تم قفل الحساب مؤقتاً. يرجى المحاولة بعد ${remaining} دقيقة.`);
    store.del(lockKey);store.del(failKey);
  }
  try{
    await signInWithEmailAndPassword(auth,`${phone}@sigma.user`,pass);
    store.del(failKey);
    toast('تم تسجيل الدخول بنجاح');
  }catch(e){
    const m=authMsg(e);
    if(m!==null)return showErr('login-error',m);
    const fails=parseInt(store.get(failKey)||'0',10)+1;
    if(fails>=3){
      store.set(lockKey,String(Date.now()+15*60*1000));store.del(failKey);
      showErr('login-error','تم إدخال كلمة مرور خاطئة 3 مرات. الحساب مقفل لمدة 15 دقيقة.');
    }else{
      store.set(failKey,String(fails));
      showErr('login-error',`رقم الهاتف أو كلمة المرور غير صحيحة (المحاولة ${fails} من 3)`);
    }
  }
}

async function changePassword(){
  const cur=$('#cur-pass').value,newPass=$('#new-pass').value,confirmPass=$('#confirm-pass').value;
  if(!cur)return toast('اكتب كلمة المرور الحالية');
  if(newPass.length<6)return toast('كلمة المرور الجديدة يجب أن تكون 6 أحرف على الأقل');
  if(newPass!==confirmPass)return toast('كلمتا المرور الجديدتان غير متطابقتين');
  if(newPass===cur)return toast('كلمة المرور الجديدة يجب أن تختلف عن الحالية');
  const user=auth.currentUser;
  if(!user)return toast('يجب تسجيل الدخول أولاً');
  try{
    // إعادة التحقق من الهوية قبل تغيير كلمة المرور (مطلوب من Firebase)
    await reauthenticateWithCredential(user,EmailAuthProvider.credential(user.email,cur));
    await updatePassword(user,newPass);
    toast('تم تغيير كلمة المرور بنجاح ✅');
    passOpen=false;
    ['cur-pass','new-pass','confirm-pass'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''});
    document.getElementById('pass-box')?.classList.remove('open');
  }catch(e){
    const c=e?.code||'';
    if(['auth/invalid-credential','auth/wrong-password','auth/invalid-login-credentials'].includes(c))toast('كلمة المرور الحالية غير صحيحة');
    else if(c==='auth/weak-password')toast('كلمة المرور الجديدة ضعيفة');
    else if(c==='auth/requires-recent-login')toast('انتهت صلاحية الجلسة، سجّل الخروج والدخول ثم حاول مرة أخرى');
    else toast(errMsg(e,'تعذر تغيير كلمة المرور، حاول مرة أخرى'));
  }
}

async function buildStudentStats(){
  const myVids=mineVideos||{};
  const allLogs=(await G('logs'))||{};
  const mine={};
  for(const vid in allLogs){const rec=allLogs[vid]&&allLogs[vid][U.uid];if(rec)mine[vid]=rec}
  const totalVideos=Object.keys(videos).length,watchedCount=Object.keys(mine).length,
    openedCount=Object.keys(myVids).length,lockedCount=Math.max(0,totalVideos-openedCount);
  const rows=[];
  for(const [vid,v] of Object.entries(videos)){
    const teacher=teachers[v.teacherId],log=mine[vid];
    const isOpen=A||IS_SUPERVISOR||!!myVids[vid];
    let status='';
    if(v.disabled&&!A&&!IS_SUPERVISOR)status='<span class="b r">موقوف</span>';
    else if(!isOpen)status='<span class="b y">يحتاج كود</span>';
    else if(log&&log.completed)status='<span class="b g">حضره كاملاً</span>';
    else if(log)status='<span class="b y">شاهد جزءاً</span>';
    else status='<span class="b g">مفتوح</span>';
    rows.push({vid,title:v.title||'-',teacher:teacher?.name||'-',grade:v.grade||'-',desc:v.desc||'',isOpen,status,log,watched:!!log,seconds:log?(log.seconds||0):0,disabled:!!v.disabled});
  }
  let filtered=rows;
  if(studentStatsFilter==='watched')filtered=rows.filter(r=>r.watched);
  else if(studentStatsFilter==='available')filtered=rows.filter(r=>r.isOpen&&!r.disabled);
  else if(studentStatsFilter==='locked')filtered=rows.filter(r=>!r.isOpen);
  filtered.sort((a,b)=>{
    const score=r=>r.watched?3:(r.isOpen?2:1);
    const d=score(b)-score(a);if(d)return d;
    return (b.log?.lastAt||0)-(a.log?.lastAt||0);
  });
  const summary=`<div class="stats-summary">
    <div class="stat-box"><div class="stat-num">${totalVideos}</div><div class="stat-label">إجمالي المحاضرات</div></div>
    <div class="stat-box ok"><div class="stat-num">${openedCount}</div><div class="stat-label">مفتوحة لك</div></div>
    <div class="stat-box warn"><div class="stat-num">${lockedCount}</div><div class="stat-label">تحتاج كود</div></div>
    <div class="stat-box"><div class="stat-num">${watchedCount}</div><div class="stat-label">حضرتها</div></div></div>`;
  const filterBar=`<div class="stats-filter">
    <button class="${studentStatsFilter==='all'?'on':''}" onclick="setStatsFilter('all')">الكل</button>
    <button class="${studentStatsFilter==='watched'?'on':''}" onclick="setStatsFilter('watched')">حضرتها (${watchedCount})</button>
    <button class="${studentStatsFilter==='available'?'on':''}" onclick="setStatsFilter('available')">مفتوحة (${openedCount})</button>
    <button class="${studentStatsFilter==='locked'?'on':''}" onclick="setStatsFilter('locked')">مقفلة (${lockedCount})</button></div>`;
  if(!filtered.length)return `<div class="box"><h2 style="color:var(--ac2)">📊 إحصائياتي</h2>${summary}${filterBar}<div class="mut">لا توجد محاضرات مطابقة.</div></div>`;
  const tableRows=filtered.map(r=>{
    const watchBtn=r.isOpen&&!r.disabled
      ?`<button class="s" style="padding:5px 10px;font-size:11px;border-radius:8px" onclick="go('watch','${esc(r.vid)}')">مشاهدة</button>`
      :(!r.disabled?`<button style="padding:5px 10px;font-size:11px;border-radius:8px" onclick="go('code','${esc(r.vid)}')">فتح بكود</button>`:'-');
    return `<tr>
      <td><b>${esc(r.title)}</b>${r.desc?`<small style="display:block;color:var(--mu);font-size:11px;margin-top:2px">${esc(r.desc)}</small>`:''}</td>
      <td>${esc(r.teacher)}</td>
      <td><span class="grade-chip">${esc(r.grade)}</span></td>
      <td>${r.status}</td>
      <td>${r.watched?`<span style="font-size:12px;color:var(--tx2)">${Math.round(r.seconds/60)} دقيقة</span>`:'-'}</td>
      <td>${watchBtn}</td></tr>`;
  }).join('');
  return `<div class="box"><h2 style="color:var(--ac2)">📊 إحصائياتي</h2>${summary}
    <h3 class="h-sec" style="font-size:16px">📚 سجل المحاضرات</h3>${filterBar}
    <div class="stats-table-wrap"><table class="stats-table">
      <thead><tr><th>المحاضرة</th><th>المدرس</th><th>الصف</th><th>الحالة</th><th>المشاهدة</th><th>إجراء</th></tr></thead>
      <tbody>${tableRows}</tbody></table></div></div>`;
}

function redeem(vid){return once('redeem',()=>doRedeem(vid))}
async function doRedeem(vid){
  const v=videos[vid];if(!v||v.disabled)return toast('الفيديو موقوف');
  const c=normDigits($('#cd').value).replace(/\D/g,'');
  if(!/^\d{6}$/.test(c))return toast('الكود يجب أن يكون 6 أرقام');
  try{
    const r=await runTransaction(R('codes/'+c),cur=>{
      if(cur===null)return cur;
      if(cur.videoId!==vid)return;
      if(cur.used&&cur.usedBy!==U.uid)return;
      if(!cur.used)Object.assign(cur,{used:true,usedBy:U.uid,usedByName:U.displayName||'',usedByEmail:U.email||'',usedAt:Date.now()});
      return cur;
    });
    const vv=r.snapshot.val();
    if(!vv||vv.usedBy!==U.uid||vv.videoId!==vid)return toast('الكود غير صحيح أو مستخدم من قبل');
    await set(R(`users/${U.uid}/videos/${vid}`),c);
    mineVideos={...mineVideos,[vid]:c};
    go('watch',vid);
  }catch(e){toast(errMsg(e,'حدث خطأ أثناء التحقق من الكود'))}
}
async function vWatch(){

function embed(u,full){
  u=String(u||'').trim();
  if(!/^https?:\/\//i.test(u))return{t:'f',s:''};
  const yt=ytId(u);
  if(yt){
    const origin=location.origin&&location.origin.startsWith('http')?'&origin='+encodeURIComponent(location.origin):'';
    const base=full?'rel=0&playsinline=1&modestbranding=1&enablejsapi=1&cc_load_policy=0'
      :'rel=0&playsinline=1&modestbranding=1&enablejsapi=1&controls=0&showinfo=0&iv_load_policy=3&fs=0&disablekb=1&cc_load_policy=0';
    return{t:'yt',id:yt,s:`https://www.youtube-nocookie.com/embed/${yt}?${base}${origin}`};
  }
  const dm=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:.*&)?id=)([\w-]+)/);
  if(dm)return{t:'drive',s:`https://drive.google.com/file/d/${dm[1]}/preview`,id:dm[1]};
  if(/\.(mp4|webm|ogg|m4v)(\?|#|$)/i.test(u))return{t:'v',s:u};
  return{t:'f',s:u};
}
function ytId(u){
  try{
    const url=new URL(u);
    const host=url.hostname.replace(/^(www\.|m\.)/,'');
    let id='';
    if(host==='youtu.be')id=url.pathname.slice(1).split('/')[0];
    else if(['youtube.com','youtube-nocookie.com','music.youtube.com'].includes(host)){
      if(url.pathname==='/watch')id=url.searchParams.get('v')||'';
      else{const m=url.pathname.match(/^\/(embed|shorts|live|v)\/([\w-]+)/);if(m)id=m[2]}
    }
    return /^[\w-]{11}$/.test(id)?id:'';
  }catch(e){return''}
}
function openLibraryItem(url){
  try{
    const p=new URL(url,location.href);
    if(!['http:','https:'].includes(p.protocol))return toast('نوع الرابط غير مسموح');
    window.open(p.href,'_blank','noopener,noreferrer');
  }catch(e){toast('رابط الملف غير صالح')}
}

async function gen(vid,n,video){
  const v=video||videos[vid];
  if(!v)throw new Error('الفيديو غير موجود لتوليد الأكواد');
  let ok=0,attempts=0;
  while(ok<n&&attempts<n*10){
    const c=String(crypto.getRandomValues(new Uint32Array(1))[0]%900000+100000);
    try{
      const r=await runTransaction(R('codes/'+c),cur=>cur===null?{videoId:vid,url:v.url,title:v.title||'',used:false,createdAt:Date.now()}:undefined);
      if(r.committed)ok++;
    }catch(e){console.warn('gen code:',e)}
    attempts++;
  }
  return ok;
}

const cp=async t=>{
  try{
    if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(t);
    else{
      const el=document.createElement('textarea');el.value=t;el.setAttribute('readonly','');
      el.style.position='fixed';el.style.top='0';el.style.opacity='0';
      document.body.appendChild(el);el.select();el.setSelectionRange(0,t.length);
      const ok=document.execCommand('copy');el.remove();
      if(!ok)throw new Error('copy failed');
    }
    toast('تم النسخ ✅');
  }catch(e){toast('تعذر النسخ تلقائياً، حاول تحديد النص ونسخه')}
};
