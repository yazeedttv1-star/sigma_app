<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سيجما</title>
<meta name="theme-color" content="#14172b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" id="mf">
<link rel="apple-touch-icon" id="ai">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#14172b;--p:#1d2140;--p2:#262b52;--tx:#eef0ff;--mu:#9aa0c8;--ac:#f5c542;--ok:#4ade80;--er:#fb7185;--r:14px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-user-select:none;user-select:none}
input,select,textarea{-webkit-user-select:text;user-select:text}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--p);position:sticky;top:0;z-index:5}
.logo{font-weight:800;font-size:22px;color:var(--ac);cursor:pointer;margin-inline-end:auto}
.chip{display:flex;align-items:center;gap:8px;font-size:13px}
.chip img,.av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--p2);border:2px solid var(--ac)}
main{max-width:980px;margin:0 auto;padding:18px 16px 60px}
h2{font-size:20px;margin:6px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:var(--p);border-radius:var(--r);padding:14px;cursor:pointer;text-align:center;border:1px solid transparent}
.card:hover{border-color:var(--ac)}
.card .ph{width:96px;height:96px;border-radius:50%;object-fit:cover;margin:0 auto 10px;display:block;background:var(--p2)}
.row{background:var(--p);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:center;cursor:pointer}
.row small{color:var(--mu);display:block}
.row>div{flex:1}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 16px;background:var(--ac);color:#241c00;cursor:pointer}
button.s{background:var(--p2);color:var(--tx)}button.d{background:var(--er);color:#fff}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--p2);background:var(--bg);color:var(--tx);margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}
.box{background:var(--p);border-radius:var(--r);padding:16px;margin-bottom:16px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:var(--p);color:var(--mu)}.tabs button.on{background:var(--ac);color:#241c00}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;text-align:right;border-bottom:1px solid var(--p2)}
.tw{overflow-x:auto}
.b{padding:2px 9px;border-radius:99px;font-size:12px;background:var(--p2)}
.g{color:var(--ok)}.r{color:var(--er)}.y{color:var(--ac)}
.code{font-family:monospace;font-size:15px;letter-spacing:2px;direction:ltr;display:inline-block}
.center{text-align:center;padding-top:14vh}
.center h1{font-size:54px;color:var(--ac)}.center p{color:var(--mu);margin:10px 0 24px}
.pl{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden}
.pl iframe,.pl video{position:absolute;inset:0;width:100%;height:100%;border:0}
.pl.bl iframe,.pl.bl video{filter:blur(30px)}
.wm{position:absolute;pointer-events:none;z-index:3;display:flex;align-items:center;gap:6px;font-size:12px;opacity:.55;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:99px;animation:mv 24s linear infinite alternate;direction:ltr}
.wm img{width:22px;height:22px;border-radius:50%}
@keyframes mv{0%{top:6%;left:4%}25%{top:70%;left:55%}50%{top:35%;left:70%}75%{top:80%;left:8%}100%{top:12%;left:60%}}
.blk{position:absolute;top:0;right:0;width:64px;height:64px;z-index:4}
#t{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ac);color:#241c00;padding:10px 18px;border-radius:10px;font-weight:600;display:none;z-index:9}
.mut{color:var(--mu);text-align:center;padding:30px}
@media print{body{display:none}}
</style>
</head>
<body>
<div id="app"></div><div id="t"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut,setPersistence,browserLocalPersistence} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase,ref,get,set,update,remove,runTransaction,query,orderByChild,equalTo} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ====== إيميل المدير ====== */
const ADMIN_EMAILS=["yazeedttv1@gmail.com"];

const app=initializeApp({apiKey:"AIzaSyCoHGEyhlsjmB_diUNm-R8SXB0Gm0kXw0A",authDomain:"sigma-6f162.firebaseapp.com",databaseURL:"https://sigma-6f162-default-rtdb.firebaseio.com",projectId:"sigma-6f162",storageBucket:"sigma-6f162.firebasestorage.app",messagingSenderId:"420365348074",appId:"1:420365348074:web:0aaecb71ec613bb32abb93"});
const auth=getAuth(app),db=getDatabase(app);
// إصلاح: ضبط persistence قبل أي عملية مصادقة
setPersistence(auth,browserLocalPersistence).catch(()=>{});

const R=p=>ref(db,p),G=async p=>(await get(R(p))).val();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=t=>t?new Date(t).toLocaleString('ar-EG'):'-';
let U=null,A=false,S={v:'home'},teachers={},videos={},badge='',hb=null,ip=null;

function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2600)}
const img=(f,s)=>new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=s;const m=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,s,s);r(c.toDataURL('image/jpeg',.8))};i.src=URL.createObjectURL(f)});

/* ===== PWA: manifest + أيقونة مولّدة ===== */
(()=>{const c=document.createElement('canvas');c.width=c.height=192;const x=c.getContext('2d');x.fillStyle='#14172b';x.fillRect(0,0,192,192);x.fillStyle='#f5c542';x.font='bold 130px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('Σ',96,104);const u=c.toDataURL();$('#ai').href=u;
const m={name:'سيجما',short_name:'سيجما',start_url:location.pathname,display:'standalone',background_color:'#14172b',theme_color:'#14172b',dir:'rtl',lang:'ar',icons:[{src:u,sizes:'192x192',type:'image/png'}]};
$('#mf').href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}))})();
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;render()});

/* ===== حماية المحتوى ===== */
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
 if(e.key==='PrintScreen'){navigator.clipboard?.writeText('');toast('التصوير ممنوع');e.preventDefault()}
 if(e.key==='F12'||(e.ctrlKey||e.metaKey)&&['s','p','u'].includes(k)||(e.ctrlKey||e.metaKey)&&e.shiftKey&&['i','j','c','s'].includes(k))e.preventDefault()});
document.addEventListener('visibilitychange',()=>$('.pl')?.classList.toggle('bl',document.hidden));
addEventListener('dragstart',e=>e.preventDefault());

/* ===== تحويل الرابط إلى مشغّل ===== */
function embed(u){u=u.trim();let m;
 if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([\w-]{11})/))return{t:'f',s:`https://www.youtube-nocookie.com/embed/${m[1]}?rel=0&modestbranding=1&playsinline=1`};
 if(m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?.*?id=)([\w-]+)/))return{t:'f',s:`https://drive.google.com/file/d/${m[1]}/preview`,drive:1};
 if(/facebook\.com|fb\.watch/.test(u))return{t:'f',s:`https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(u)}&show_text=false`};
 if(m=u.match(/tiktok\.com\/.*video\/(\d+)/))return{t:'f',s:`https://www.tiktok.com/embed/v2/${m[1]}`};
 if(/\.(mp4|webm|ogg)(\?|$)/i.test(u))return{t:'v',s:u};
 return{t:'f',s:u}}

/* ===== المصادقة (مُصلحة) ===== */
onAuthStateChanged(auth,async u=>{
 U=u;
 A=!!u&&ADMIN_EMAILS.includes((u.email||'').toLowerCase());
 if(u){
   try{
     teachers=await G('teachers')||{};
     videos=await G('videos')||{};
     badge=await G('settings/badge')||'';
   }catch(e){console.error('load err',e)}
 }else{teachers={};videos={};badge=''}
 S={v:'home'};render();
});

const login=async()=>{
 try{
   const provider=new GoogleAuthProvider();
   provider.setCustomParameters({prompt:'select_account'});
   await signInWithPopup(auth,provider);
 }catch(e){
   console.error(e);
   if(e.code==='auth/popup-blocked')toast('المتصفح منع النافذة، اسمح بها');
   else if(e.code==='auth/unauthorized-domain')toast('النطاق غير مصرح به في Firebase');
   else if(e.code==='auth/operation-not-allowed')toast('فعّل تسجيل الدخول بجوجل في Firebase');
   else toast('تعذر تسجيل الدخول: '+e.code);
 }
};
const go=(v,id,tab)=>{stopHB();S={v,id,tab:tab||S.tab};render();scrollTo(0,0)};

async function render(){
 const a=$('#app');
 if(!U){a.innerHTML=`<div class="center"><h1>Σ سيجما</h1><p>منصتك التعليمية. سجّل دخولك لتبدأ.</p><button onclick="login()">الدخول بحساب جوجل</button></div>`;return}
 let body='';
 try{body=await({home:vHome,teacher:vTeacher,code:vCode,watch:vWatch,admin:vAdmin,vid:vVid}[S.v])()}catch(e){body=`<div class="mut">حدث خطأ: ${esc(e.message)}</div>`}
 a.innerHTML=`<header><div class="logo" onclick="go('home')">Σ سيجما</div>
 ${ip?'<button class="s" onclick="inst()">تثبيت التطبيق</button>':''}
 ${A?`<button class="s" onclick="go('${S.v==='admin'||S.v==='vid'?'home':'admin'}','',S.tab||'videos')">${S.v==='admin'||S.v==='vid'?'واجهة الطالب':'لوحة التحكم'}</button>`:''}
 <div class="chip">${badge?`<img src="${badge}">`:`<span class="av"></span>`}<span>${esc(U.displayName)}</span></div>
 <button class="s" onclick="out()">خروج</button></header><main>${body}</main>`;
}
const inst=async()=>{ip.prompt();await ip.userChoice;ip=null;render()};
const out=()=>{stopHB();signOut(auth)};

/* ===== واجهة الطالب ===== */
async function vHome(){const t=Object.entries(teachers);
 if(!t.length)return'<div class="mut">لا يوجد مدرسون بعد.</div>';
 return`<h2>اختر المدرس</h2><div class="grid">${t.map(([id,x])=>`<div class="card" onclick="go('teacher','${id}')"><img class="ph" src="${x.photo||''}"><b>${esc(x.name)}</b></div>`).join('')}</div>`}
async function vTeacher(){const t=teachers[S.id];if(!t)return vHome();
 const mine=await G('users/'+U.uid+'/videos')||{};
 const l=Object.entries(videos).filter(([,v])=>v.teacherId===S.id).sort((a,b)=>b[1].created-a[1].created);
 return`<h2>${esc(t.name)}</h2>`+(l.length?l.map(([id,v])=>{
   // إضافة: منع الدخول إذا كان الفيديو موقوفاً
   if(v.disabled)return`<div class="row" style="opacity:.5;cursor:default"><div><b>${esc(v.title)}</b><small>${esc(v.desc||'')}</small></div><span class="b r">موقوف</span></div>`;
   return`<div class="row" onclick="${mine[id]?`go('watch','${id}')`:`go('code','${id}')`}"><div><b>${esc(v.title)}</b><small>${esc(v.desc||'')}</small></div><span class="b ${mine[id]?'g':''}">${mine[id]?'مفتوح':'يحتاج كود'}</span></div>`;
 }).join(''):'<div class="mut">لا توجد فيديوهات.</div>')}
async function vCode(){const v=videos[S.id];
 if(!v||v.disabled)return`<div class="mut">هذا الفيديو موقوف حالياً.</div>`;
 return`<div class="box"><h2>${esc(v.title)}</h2><label>أدخل الكود المكوّن من 6 أرقام (يُستخدم مرة واحدة)</label><input id="cd" inputmode="numeric" maxlength="6" placeholder="000000" style="font-size:24px;text-align:center;letter-spacing:6px"><button onclick="redeem('${S.id}')">فتح الفيديو</button></div>`}
async function redeem(vid){
 const v=videos[vid];if(!v||v.disabled)return toast('الفيديو موقوف');
 const c=$('#cd').value.trim();if(!/^\d{6}$/.test(c))return toast('الكود يجب أن يكون 6 أرقام');
 const r=await runTransaction(R('codes/'+c),cur=>{
  if(cur===null)return cur;
  if(cur.videoId!==vid)return;
  if(cur.used&&cur.usedBy!==U.uid)return;
  if(!cur.used){Object.assign(cur,{used:true,usedBy:U.uid,usedByName:U.displayName,usedByEmail:U.email,usedAt:Date.now()})}
  return cur}).catch(()=>null);
 const vv=r?.snapshot.val();
 if(!vv||vv.usedBy!==U.uid||vv.videoId!==vid)return toast('الكود غير صحيح أو مستخدم من قبل');
 await set(R(`users/${U.uid}/videos/${vid}`),c);go('watch',vid)}

async function vWatch(){
 const v=videos[S.id],c=(await G(`users/${U.uid}/videos/${S.id}`)),rec=c&&await G('codes/'+c);
 if(!v||v.disabled)return`<div class="mut">هذا الفيديو موقوف حالياً.</div>`;
 if(!rec||rec.usedBy!==U.uid)return go('code',S.id);
 const e=embed(rec.url),lp=`logs/${S.id}/${U.uid}`,old=await G(lp)||{};
 let sec=old.seconds||0;const dur=(+v.duration||0)*60;
 await update(R(lp),{name:U.displayName,email:U.email,photo:U.photoURL||'',code:c,openedAt:old.openedAt||Date.now(),lastAt:Date.now(),seconds:sec,completed:!!old.completed});
 const tick=async(add)=>{if(document.hidden)return;sec+=add;const done=dur&&sec>=dur*.9;await update(R(lp),{seconds:sec,lastAt:Date.now(),completed:done||!!old.completed}).catch(()=>{})};
 hb=setInterval(()=>tick(10),10000);
 const wm=`<div class="wm">${badge?`<img src="${badge}">`:''}${esc(U.displayName)} · ${esc(U.email)}</div>`;
 const pl=e.t==='v'?`<video src="${esc(e.s)}" controls controlsList="nodownload noremoteplayback" disablePictureInPicture playsinline onended="this.dispatchEvent(new Event('fin',{bubbles:true}))"></video>`:`<iframe src="${esc(e.s)}" allow="autoplay;encrypted-media;fullscreen" allowfullscreen referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-presentation allow-popups"></iframe>`;
 setTimeout(()=>$('.pl video')?.addEventListener('ended',()=>{sec=Math.max(sec,dur);update(R(lp),{completed:true,seconds:sec})}),0);
 return`<button class="s" onclick="go('teacher','${v.teacherId}')">رجوع</button><h2 style="margin-top:12px">${esc(v.title)}</h2><div class="pl">${pl}${wm}${e.drive?'<div class="blk"></div>':''}</div><p style="color:var(--mu);margin-top:12px">${esc(v.desc||'')}</p>`}
function stopHB(){clearInterval(hb);hb=null}

/* ===== لوحة التحكم ===== */
async function vAdmin(){
 const tab=S.tab||'videos',tb=`<div class="tabs">${[['videos','الفيديوهات'],['teachers','المدرسون'],['badge','صورة التعريف']].map(([k,n])=>`<button class="${tab===k?'on':''}" onclick="go('admin','','${k}')">${n}</button>`).join('')}</div>`;
 if(tab==='teachers')return tb+`<div class="box"><h2>إضافة مدرس</h2><label>الاسم</label><input id="tn"><label>الصورة</label><input id="tp" type="file" accept="image/*"><button onclick="addT()">إضافة</button></div><div class="grid">${Object.entries(teachers).map(([id,x])=>`<div class="card" style="cursor:default"><img class="ph" src="${x.photo||''}"><b>${esc(x.name)}</b><br><button class="d" style="margin-top:8px;padding:5px 10px" onclick="delT('${id}')">حذف</button></div>`).join('')}</div>`;
 if(tab==='badge')return tb+`<div class="box"><h2>صورة التعريف</h2><p style="color:var(--mu);margin-bottom:10px">تظهر بجانب اسم كل طالب في التطبيق المثبّت وعلى علامة الحماية فوق الفيديو.</p>${badge?`<img src="${badge}" class="av" style="width:90px;height:90px;margin-bottom:10px;display:block">`:''}<input id="bp" type="file" accept="image/*"><button onclick="setB()">حفظ الصورة</button></div>`;
 const tOpts=Object.entries(teachers).map(([id,x])=>`<option value="${id}">${esc(x.name)}</option>`).join('');
 return tb+`<div class="box"><h2>إضافة فيديو</h2><label>المدرس</label><select id="vt">${tOpts}</select><label>العنوان</label><input id="vn"><label>الوصف / المواصفات</label><textarea id="vd" rows="2"></textarea><label>رابط الفيديو</label><input id="vu" dir="ltr"><label>مدة الفيديو بالدقائق</label><input id="vm" type="number" min="0"><label>عدد الأكواد المبدئية</label><input id="vc" type="number" min="0" value="10"><button onclick="addV()">حفظ وتوليد الأكواد</button></div><h2>الفيديوهات</h2>`+(Object.entries(videos).sort((a,b)=>b[1].created-a[1].created).map(([id,v])=>`<div class="row" onclick="go('vid','${id}')"><div><b>${esc(v.title)}</b><small>${esc(teachers[v.teacherId]?.name||'-')}${v.disabled?' — موقوف':''}</small></div><span class="b ${v.disabled?'r':''}">${v.disabled?'موقوف':'السجل والأكواد'}</span></div>`).join('')||'<div class="mut">لا توجد فيديوهات.</div>')}

async function addT(){const n=$('#tn').value.trim(),f=$('#tp').files[0];if(!n)return toast('اكتب اسم المدرس');
 const k='t'+Date.now();teachers[k]={name:n,photo:f?await img(f,200):''};await set(R('teachers/'+k),teachers[k]);render()}
async function delT(id){if(!confirm('حذف المدرس؟'))return;delete teachers[id];await remove(R('teachers/'+id));render()}
async function setB(){const f=$('#bp').files[0];if(!f)return toast('اختر صورة');badge=await img(f,160);await set(R('settings/badge'),badge);toast('تم الحفظ');render()}
async function addV(){const v={teacherId:$('#vt').value,title:$('#vn').value.trim(),desc:$('#vd').value.trim(),url:$('#vu').value.trim(),duration:+$('#vm').value||0,created:Date.now(),disabled:false};
 if(!v.teacherId||!v.title||!v.url)return toast('أكمل المدرس والعنوان والرابط');
 const k='v'+Date.now();videos[k]=v;await set(R('videos/'+k),v);const n=Math.min(+$('#vc').value||0,500);if(n)await gen(k,n);go('vid',k)}

async function gen(vid,n){const v=videos[vid];let ok=0;
 while(ok<n){const c=String(crypto.getRandomValues(new Uint32Array(1))[0]%900000+100000);
  const r=await runTransaction(R('codes/'+c),cur=>cur===null?{videoId:vid,url:v.url,title:v.title,used:false,createdAt:Date.now()}:undefined);
  if(r.committed)ok++}
 return ok}
async function moreCodes(vid,one){const n=one?1:Math.min(+$('#gn').value||0,500);if(!n)return toast('اكتب العدد');toast('جارٍ التوليد...');await gen(vid,n);render()}
async function delV(id){if(!confirm('حذف الفيديو؟'))return;delete videos[id];await remove(R('videos/'+id));go('admin','','videos')}

/* ===== إضافة: إيقاف / تفعيل الأكواد ===== */
async function toggleVid(id){
 const v=videos[id];if(!v)return;
 const next=!v.disabled;
 if(!confirm(next?'إيقاف كل أكواد هذا الفيديو؟ (لن يستطيع الطلاب فتحه)':'إعادة تفعيل الفيديو؟'))return;
 v.disabled=next;
 await update(R('videos/'+id),{disabled:next});
 videos[id]=v;toast(next?'تم إيقاف الأكواد':'تم التفعيل');render();
}

const cp=t=>navigator.clipboard.writeText(t).then(()=>toast('تم النسخ'));
window.copyFree=async id=>{const s=await get(query(R('codes'),orderByChild('videoId'),equalTo(id)));const a=[];s.forEach(c=>{if(!c.val().used)a.push(c.key)});cp(a.join('\n'))};

/* ===== إضافة: تصدير PDF ===== */
function exportPDF(vid){
 const v=videos[vid];if(!v)return;
 // جمع بيانات الأكواد والسجل من الجداول الحالية
 const rows=[];
 document.querySelectorAll('#pdf-src tbody tr').forEach(tr=>{
   const tds=tr.querySelectorAll('td');
   if(tds.length)rows.push([...tds].map(td=>td.innerText.trim()));
 });
 const headers=[...document.querySelectorAll('#pdf-src thead th')].map(th=>th.innerText.trim());
 const win=window.open('','_blank');
 win.document.write(`<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>${v.title}</title>
