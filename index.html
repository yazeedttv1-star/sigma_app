<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>منصة سيجما التعليمية v4.0.0</title>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" id="mf">
<link rel="apple-touch-icon" id="ai">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8fafc;--surface:#fff;--surface2:#f1f5f9;--tx:#0f172a;--tx2:#475569;--mu:#94a3b8;--ac:#2563eb;--ac2:#1d4ed8;--ac-soft:#dbeafe;--ok:#10b981;--er:#ef4444;--warn:#f59e0b;--bd:#e2e8f0;--r:16px;--r-sm:10px;--r-lg:22px;--shadow:0 1px 3px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.04);--shadow-lg:0 10px 40px rgba(15,23,42,.12)}
html.dark{--bg:#0b1220;--surface:#111a2e;--surface2:#1a2440;--tx:#f1f5f9;--tx2:#cbd5e1;--mu:#64748b;--ac:#60a5fa;--ac2:#3b82f6;--ac-soft:#1e3a8a;--bd:#1e293b;--shadow:0 1px 3px rgba(0,0,0,.4);--shadow-lg:0 10px 40px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{min-height:100%;-webkit-text-size-adjust:100%}
body{font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;min-height:100dvh;padding-bottom:calc(120px + env(safe-area-inset-bottom));overflow-x:hidden;-webkit-user-select:none;user-select:none;transition:background .25s,color .25s}
input,select,textarea{-webkit-user-select:text;user-select:text}
h1,h2,h3{font-weight:800;line-height:1.3}
h2{font-size:20px;margin-bottom:16px}
#loading-overlay{position:fixed;inset:0;z-index:9999;background:rgba(248,250,252,.85);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .3s}
html.dark #loading-overlay{background:rgba(11,18,32,.85)}
#loading-overlay.hide{opacity:0;pointer-events:none}
.spinner{width:40px;height:40px;border:4px solid var(--ac-soft);border-top-color:var(--ac);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.top-bar{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:24px 20px;border-bottom-left-radius:24px;border-bottom-right-radius:24px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-start;box-shadow:var(--shadow)}
.top-bar h1{font-size:22px;margin-bottom:4px}
.top-bar p{font-size:14px;opacity:.9;margin-bottom:12px}
.top-bar .actions{display:flex;gap:8px}
.action-btn{background:#fff;color:#0f172a;border:0;width:42px;height:42px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 2px 5px rgba(0,0,0,.1);padding:0}
.action-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge-dot{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:#ef4444;color:#fff;border:2px solid #fff;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center}
.avatar-lg{width:56px;height:56px;border-radius:50%;border:3px solid rgba(255,255,255,.4);object-fit:cover;cursor:pointer;background:#fff}
main{max-width:1000px;margin:0 auto;padding:0 20px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);cursor:pointer;text-align:center;transition:.2s;overflow:hidden;display:flex;flex-direction:column}
.card:hover{border-color:var(--ac);box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.card .card-img-wrap{width:100%;height:160px;background:linear-gradient(135deg,#e0e7ff,#f1f5f9)}
.card .card-img-wrap img{width:100%;height:100%;object-fit:cover}
.card .card-body{padding:12px 10px;background:var(--surface);flex:1;display:flex;flex-direction:column;justify-content:center}
.card b{font-size:16px;display:block;font-weight:800}
.row{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s;flex-wrap:wrap}
.row:hover{border-color:var(--ac);box-shadow:var(--shadow-lg)}
.row>div{flex:1;min-width:0}
.row b{font-size:15px;display:block}
.row small{color:var(--mu);font-size:13px;display:block;margin-top:2px}
button,.btn{font-family:inherit;font-weight:700;border:0;border-radius:var(--r-sm);padding:10px 18px;background:var(--ac);color:#fff;cursor:pointer;transition:.15s;font-size:14px;touch-action:manipulation}
button:hover{background:var(--ac2)}
button:active{transform:scale(.97)}
button:disabled{opacity:.6;cursor:not-allowed}
button.s{background:var(--surface2);color:var(--tx)}
button.s:hover{background:var(--bd)}
button.d{background:var(--er)}button.d:hover{background:#dc2626}
button.g{background:var(--ok)}button.g:hover{background:#059669}
label{font-size:13px;color:var(--tx2);font-weight:700;display:block;margin-bottom:6px}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--surface);color:var(--tx);margin-bottom:14px;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
.box{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:22px;margin-bottom:20px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px;text-align:right;border-bottom:1px solid var(--bd);vertical-align:middle}
th{background:var(--surface2);font-weight:700;color:var(--tx2);font-size:12px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r)}
.b{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--tx2);display:inline-block}
.b.g{background:#d1fae5;color:#065f46}.b.r{background:#fee2e2;color:#991b1b}.b.y{background:#fef3c7;color:#92400e}
html.dark .b.g{background:#064e3b;color:#6ee7b7}html.dark .b.r{background:#7f1d1d;color:#fca5a5}html.dark .b.y{background:#78350f;color:#fcd34d}
.g{color:var(--ok)}.r{color:var(--er)}.y{color:var(--warn)}
.code{font-family:'Courier New',monospace;font-size:15px;letter-spacing:2px;direction:ltr;display:inline-block;background:var(--surface2);padding:3px 10px;border-radius:6px;color:var(--ac2);font-weight:700}
.mut{color:var(--mu);text-align:center;padding:40px 20px}
.player-wrap{width:100%;margin-bottom:16px}
.pl{position:relative;background:#000;border-radius:var(--r);overflow:hidden;width:100%;aspect-ratio:16/9;margin:0 auto;box-shadow:var(--shadow-lg)}
.pl iframe,.pl video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000;pointer-events:none;object-fit:contain}
.pl.is-embed iframe{pointer-events:auto}
.pl.is-yt iframe{pointer-events:none!important;transform:scale(1.01)!important}
.pl .video-blocker{position:absolute;inset:0;z-index:99;background:transparent;cursor:pointer;touch-action:none}
.pl .end-cover{position:absolute;inset:0;z-index:100;background:#000;display:none;align-items:center;justify-content:center}
.pl .end-cover button{background:var(--ac);color:#fff;padding:12px 22px}
.pl .big-play-overlay{position:absolute;inset:0;z-index:101;display:none;align-items:center;justify-content:center;pointer-events:none}
.pl .big-play-btn{width:80px;height:80px;border-radius:50%;background:rgba(15,15,15,.7);border:2px solid #fff;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;padding:0}
.pl .big-play-btn svg{width:40px;height:40px;fill:#fff;margin-left:4px}
.wm{position:absolute;pointer-events:none;z-index:22;display:flex;align-items:center;gap:6px;font-size:12px;opacity:.45;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:99px;animation:mv 24s linear infinite alternate;direction:ltr;color:#fff;white-space:nowrap}
.wm img{width:22px;height:22px;border-radius:50%;object-fit:cover}
@keyframes mv{0%{top:20%;left:4%}25%{top:70%;left:55%}50%{top:35%;left:70%}75%{top:80%;left:8%}100%{top:20%;left:60%}}
.custom-player-ctrl{direction:ltr;background:#1e1e2f;padding:10px 14px;border-radius:6px;margin-top:8px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ctrl-left,.ctrl-right{display:flex;align-items:center;flex-shrink:0}
.icon-btn{background:transparent;color:#fff;border:0;padding:6px;margin:0 2px;cursor:pointer;display:flex;align-items:center;justify-content:center;min-width:36px;min-height:36px;transition:transform .15s}
.icon-btn:hover{transform:scale(1.1);background:transparent}
.icon-btn svg{width:22px;height:22px;fill:#fff}
.custom-player-ctrl .time{font-size:12px;font-weight:600;color:#fff;direction:ltr;margin:0 4px;min-width:36px;text-align:center}
.time-sep{color:#fff;margin:0 2px}
.slider-wrap{position:relative;flex:1;height:4px;background:rgba(255,255,255,.3);border-radius:99px;margin:0 10px;min-width:80px}
.slider-fill{position:absolute;top:0;left:0;height:100%;width:0;background:#ff0000;border-radius:99px;pointer-events:none}
.slider-wrap input[type=range]{position:absolute;left:0;top:-9px;width:100%;height:22px;margin:0;padding:0;border:0;background:transparent;box-shadow:none;-webkit-appearance:none;appearance:none;cursor:pointer;z-index:2}
.slider-wrap input[type=range]::-webkit-slider-runnable-track{height:22px;background:transparent}
.slider-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#ff0000;border:0;margin-top:4px}
.slider-wrap input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#ff0000;border:0}
.player-wrap:fullscreen{background:#000;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center}
.player-wrap:fullscreen .pl{flex:1;min-height:0;aspect-ratio:auto;border-radius:0}
@media (orientation:landscape) and (pointer:coarse){
  body.is-watching .bottombar{display:none!important}
  body.is-watching main{padding:0!important}
  body.is-watching .player-wrap{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:99999!important;margin:0!important;background:#000!important;display:flex!important;flex-direction:column!important}
  body.is-watching .pl{flex:1!important;min-height:0!important;height:auto!important;aspect-ratio:auto!important;border-radius:0!important;margin:0!important}
}
.bottombar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);border:1px solid var(--bd);border-bottom:0;border-radius:22px 22px 0 0;display:flex;justify-content:space-around;gap:4px;padding:8px 16px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -5px 24px rgba(0,0,0,.1)}
.bottombar button{background:transparent;color:var(--tx2);border:0;padding:10px 4px;border-radius:25px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.bottombar button:hover{background:var(--surface2);color:var(--tx);transform:none;box-shadow:none}
.bottombar button.on{color:var(--ac);background:var(--ac-soft)}
.bottombar button.on svg{fill:var(--ac)}
.bottombar button svg{width:22px;height:22px;fill:var(--tx2)}
#t{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 22px;border-radius:var(--r);font-weight:700;display:none;z-index:300;box-shadow:var(--shadow-lg);max-width:90vw;text-align:center;font-size:14px}
#t.show{display:block;animation:pop .25s}
@keyframes pop{0%{transform:translateX(-50%) scale(.8);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
.profile-card{text-align:center;padding:30px 20px}
.profile-card img{width:100px;height:100px;border-radius:50%;border:4px solid var(--ac-soft);margin-bottom:16px;object-fit:cover;background:var(--surface2)}
.profile-card p{color:var(--mu);margin-bottom:20px}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:20px}
.settings-btn{background:var(--surface2);border:1px solid var(--bd);border-radius:var(--r);padding:16px 12px;text-align:center;cursor:pointer;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:8px}
.settings-btn:hover{border-color:var(--ac);background:var(--ac-soft)}
.settings-btn svg{width:28px;height:28px;fill:var(--ac)}
.settings-btn span{font-size:13px;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-content{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:460px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-lg)}
.modal-header{padding:16px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:16px}
.modal-body{padding:16px;overflow-y:auto;flex:1}
.noti-item{display:flex;align-items:flex-start;gap:12px;padding:14px;margin-bottom:10px;background:var(--surface2);border:1px solid var(--bd);border-radius:14px}
.noti-item.unread{background:var(--ac-soft);border-color:var(--ac)}
.noti-icon{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;flex-shrink:0}
.noti-icon svg{width:22px;height:22px;fill:#fff}
.noti-content{flex:1;min-width:0}
.noti-text{font-size:14px;line-height:1.6;font-weight:600;margin-bottom:4px;word-break:break-word;white-space:pre-wrap}
.noti-date{font-size:11px;color:var(--mu);font-weight:700}
.noti-dot{width:8px;height:8px;border-radius:50%;background:var(--er);display:inline-block;margin-left:4px}
.noti-actions button{padding:6px 10px;font-size:11px;background:var(--surface);color:var(--tx2);border:1px solid var(--bd)}
.noti-actions button:hover{background:var(--er);color:#fff}
.noti-empty{text-align:center;padding:50px 20px;color:var(--mu)}
.stats-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.stat-box{background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--bd);border-radius:var(--r);padding:16px;text-align:center}
.stat-box .stat-num{font-size:26px;font-weight:800;color:var(--ac);margin-bottom:4px}
.stat-box .stat-label{font-size:12px;color:var(--mu);font-weight:700}
.stat-box.ok .stat-num{color:var(--ok)}.stat-box.warn .stat-num{color:var(--warn)}
.stats-filter{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.stats-filter button{padding:8px 16px;font-size:12px;border-radius:99px;background:var(--surface2);color:var(--tx2);border:1px solid var(--bd)}
.stats-filter button.on{background:var(--ac);color:#fff}
.auth-container{max-width:400px;margin:0 auto;padding:40px 20px;text-align:center}
.auth-container h1{font-size:32px;color:var(--ac);margin-bottom:8px;letter-spacing:-1px}
.auth-container>p{color:var(--mu);margin-bottom:24px}
.auth-form{text-align:right}
.auth-form .error{color:var(--er);font-size:13px;margin-bottom:10px;display:none;line-height:1.6}
.auth-form .ok{color:var(--ok);font-size:14px;margin-bottom:10px;display:none;line-height:1.6;font-weight:700}
.auth-btn{width:100%;padding:14px;font-size:16px;border-radius:12px;margin-bottom:12px}
.link-btn{color:var(--ac);font-weight:700;text-decoration:none;cursor:pointer}
.admin-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;background:var(--surface2);padding:6px;border-radius:12px}
.admin-tabs button{flex:1 1 calc(33% - 6px);padding:10px;font-size:13px;border-radius:8px;background:var(--surface);color:var(--tx2);border:1px solid var(--bd)}
.admin-tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
@media(max-width:768px){.admin-tabs button{flex:1 1 45%}}
.code-input{font-size:26px;text-align:center;letter-spacing:8px;font-family:monospace}
.notice{background:var(--ac-soft);border:1px solid var(--ac);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;line-height:1.7}
.ban-screen{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.news-card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:16px;margin-bottom:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.news-card img{width:100%;max-height:400px;object-fit:contain;border-radius:var(--r-sm);border:1px solid var(--bd)}
.embed-box{position:relative;width:100%;padding-bottom:56.25%;height:0;border-radius:10px;overflow:hidden;background:#000}
.embed-box iframe,.embed-box video{position:absolute;inset:0;width:100%;height:100%;border:0}
.news-text{font-size:15px;line-height:1.7;white-space:pre-wrap}
.news-date{font-size:12px;color:var(--mu);font-weight:700}
.exam-card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.exam-card h3{font-size:17px;margin-bottom:8px}
.exam-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:12px}
.exam-q{background:var(--surface2);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:14px}
.exam-q .q-text{font-size:15px;font-weight:700;margin-bottom:12px;line-height:1.7}
.q-num{display:inline-block;background:var(--ac);color:#fff;width:26px;height:26px;border-radius:50%;text-align:center;line-height:26px;font-size:12px;font-weight:800;margin-left:8px}
.exam-opt{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:8px;background:var(--surface);border:1.5px solid var(--bd);border-radius:10px;cursor:pointer}
.exam-opt:hover,.exam-opt.selected{border-color:var(--ac);background:var(--ac-soft)}
.exam-opt input{margin:0;width:18px;height:18px;cursor:pointer}
.exam-opt span{font-size:14px;flex:1}
.exam-timer{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:12px 18px;border-radius:12px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;font-weight:800}
.exam-timer.warn{background:linear-gradient(135deg,var(--warn),#d97706)}
.exam-timer.danger{background:linear-gradient(135deg,var(--er),#dc2626)}
.exam-timer .time-big{font-size:22px;font-family:'Courier New',monospace}
.exam-result{text-align:center;padding:30px 20px}
.exam-result .score{font-size:60px;font-weight:900;margin:14px 0;color:var(--ac)}
.rv{font-size:13px;padding:8px 12px;border-radius:8px;margin-top:6px;line-height:1.6}
.rv.ok{background:#d1fae5;color:#065f46}.rv.bad{background:#fee2e2;color:#991b1b}.rv.good{background:#e0f2fe;color:#075985}
html.dark .rv.ok{background:#064e3b;color:#6ee7b7}html.dark .rv.bad{background:#7f1d1d;color:#fca5a5}html.dark .rv.good{background:#0c4a6e;color:#bae6fd}
.exam-vio{background:#fef3c7;color:#92400e;padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:13px;font-weight:700}
.msg-card{background:var(--surface2);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;line-height:1.7}
.msg-card small{color:var(--mu);font-size:12px;display:block;margin-bottom:6px}
.reply-box{background:var(--ac-soft);border-radius:10px;padding:10px 12px;margin-top:8px;white-space:pre-wrap}
@media(max-width:720px){main{padding:0 14px 40px}.top-bar{padding:16px}.exam-result .score{font-size:44px}}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.card .card-img-wrap{height:130px}}
</style>
</head>
<body>
<div id="loading-overlay"><div class="spinner"></div><p style="font-weight:700;color:var(--ac)">جارٍ التحميل...</p></div>
<div id="app"></div>
<div id="t" role="status" aria-live="polite"></div>
<input type="file" id="photoInput" accept="image/*" hidden>
<div class="modal" id="notiModal" onclick="if(event.target===this)closeNoti()">
  <div class="modal-content">
    <div class="modal-header"><h3>🔔 الإشعارات</h3><button class="s" onclick="closeNoti()" style="padding:6px 14px;font-size:13px">إغلاق</button></div>
    <div class="modal-body" id="notiBody"></div>
  </div>

    reader.onload=e=>{

          resolve(data);

      };

      im.src=e.target.result;
    };

  });
}

/* ---------- notifications ---------- */
function refreshNotifications(){
  const merged={};
  Object.entries(broadcastNotifications||{}).forEach(([id,n])=>{if(n&&typeof n==='object')merged[id]={...n,_key:id}});
  Object.entries(ownNotifications||{}).forEach(([id,n])=>{if(n&&typeof n==='object')merged[id]={...(merged[id]||{}),...n,_key:id}});
  notifications=Object.fromEntries(Object.entries(merged).filter(([,n])=>!n.dismissed));
  const unread=Object.values(notifications).filter(n=>!n.read).length;
  const dot=document.getElementById('notiBadge');
  if(dot){dot.textContent=unread>99?'99+':String(unread);dot.style.display=unread?'flex':'none'}
}
function openNoti(){const m=$('#notiModal');if(m)m.classList.add('show');renderNoti()}
function closeNoti(){const m=$('#notiModal');if(m)m.classList.remove('show')}
function renderNoti(){
  const body=$('#notiBody');if(!body)return;
  const list=Object.values(notifications).sort((a,b)=>(b.created||0)-(a.created||0));
  if(!list.length){body.innerHTML=`<div class="noti-empty"><p style="font-weight:700">لا توجد إشعارات حالياً</p></div>`;return}
  body.innerHTML=list.map(n=>`<div class="noti-item ${n.read?'':'unread'}">
    <div class="noti-icon"><svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg></div>
    <div class="noti-content">
      <div class="noti-text">${n.read?'':'<span class="noti-dot"></span>'}${esc(n.text||'إشعار جديد')}</div>
      <div class="noti-date">📅 ${fd(n.created)}</div>
    </div>
    <div class="noti-actions"><button onclick="delNoti('${esc(n._key)}')" title="مسح">✕</button></div>
  </div>`).join('')+`<div style="text-align:center;padding-top:12px"><button class="s" style="font-size:12px;padding:8px 20px" onclick="clearAllMyNotis()">مسح الكل</button></div>`;
  if(U){
    const up={};
    list.forEach(n=>{if(!n.read&&!broadcastNotifications[n._key]?.read)up[n._key]={text:n.text||'',created:n.created||Date.now(),read:true}});
    if(Object.keys(up).length)update(R('notifications/'+U.uid),up).catch(()=>{});
  }
}
async function delNoti(key){
  if(!confirm('مسح هذا الإشعار؟'))return;
  const n=notifications[key]||{};
  try{await set(R('notifications/'+U.uid+'/'+key),{text:n.text||'',created:n.created||Date.now(),read:true,dismissed:true});renderNoti()}
  catch(e){toast(fail(e))}
}
async function clearAllMyNotis(){
  if(!confirm('مسح كل الإشعارات؟'))return;
  try{
    const up={};Object.values(notifications).forEach(n=>{up[n._key]={text:n.text||'',created:n.created||Date.now(),read:true,dismissed:true}});
    if(Object.keys(up).length)await update(R('notifications/'+U.uid),up);
    renderNoti();
  }catch(e){toast(fail(e))}
}

function authMsg(e){
  const c=e?.code||'';
  if(c==='auth/network-request-failed')return 'تعذر الاتصال بالإنترنت، تحقق من الشبكة وحاول مرة أخرى';
  if(c==='auth/too-many-requests')return 'محاولات كثيرة جداً، انتظر قليلاً ثم حاول مرة أخرى';
  if(c==='auth/weak-password')return 'كلمة المرور ضعيفة، استخدم 6 أحرف على الأقل';
  if(c==='auth/email-already-in-use')return 'رقم الهاتف مسجل بالفعل، يمكنك تسجيل الدخول.';
  if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(c))return null;
  return 'حدث خطأ، حاول مرة أخرى';
}

const registerPhone=()=>once('register',doRegister);
async function doRegister(){
  const name=($('#reg-name')?.value||'').trim().replace(/\s+/g,' ');
  const phone=normPhone($('#reg-phone')?.value||'');
  const pass=$('#reg-pass')?.value||'',pass2=$('#reg-pass2')?.value||'';
  hideMsg('reg-error');
  if(name.split(' ').filter(Boolean).length<4)return showErr('reg-error','يجب كتابة الاسم الرباعي كاملاً (4 مقاطع)');
  if(!/^01[0-9]{9}$/.test(phone))return showErr('reg-error','رقم الهاتف يجب أن يكون 11 رقم ويبدأ بـ 01');
  if(pass.length<6)return showErr('reg-error','كلمة المرور يجب أن تكون 6 أحرف على الأقل');
  if(pass!==pass2)return showErr('reg-error','كلمتا المرور غير متطابقتين');
  try{
    const email=`${phone}@sigma.user`;
    const cred=await createUserWithEmailAndPassword(auth,email,pass);
    await updateProfile(cred.user,{displayName:name});
    await update(R('users/'+cred.user.uid),{name,phone,email,createdAt:Date.now()});
    toast('تم إنشاء الحساب بنجاح ✅');
  }catch(e){showErr('reg-error',authMsg(e)||'حدث خطأ، حاول مرة أخرى')}
}
const loginPhone=()=>once('login',doLogin);
async function doLogin(){
  const phone=normPhone($('#login-phone')?.value||'');
  const pass=$('#login-pass')?.value||'';
  hideMsg('login-error');
  if(!/^01[0-9]{9}$/.test(phone))return showErr('login-error','رقم الهاتف غير صحيح');
  if(!pass)return showErr('login-error','اكتب كلمة المرور');
  const failKey=`login_fails_${phone}`,lockKey=`login_lock_${phone}`;
  const lockTime=parseInt(store.get(lockKey)||'0',10);
  if(lockTime&&lockTime>Date.now()){
    return showErr('login-error',`تم قفل الحساب مؤقتاً. حاول بعد ${Math.ceil((lockTime-Date.now())/60000)} دقيقة.`);
  }
  try{
    await signInWithEmailAndPassword(auth,`${phone}@sigma.user`,pass);
    store.del(failKey);store.del(lockKey);
  }catch(e){
    const m=authMsg(e);
    if(m!==null)return showErr('login-error',m);
    const fails=parseInt(store.get(failKey)||'0',10)+1;
    if(fails>=3){store.set(lockKey,String(Date.now()+15*60*1000));store.del(failKey);showErr('login-error','تم إدخال كلمة مرور خاطئة 3 مرات. الحساب مقفل 15 دقيقة.')}
    else{store.set(failKey,String(fails));showErr('login-error',`رقم الهاتف أو كلمة المرور غير صحيحة (المحاولة ${fails} من 3)`)}
  }
}
const sendResetRequest=()=>once('reset',doResetRequest);

  try{

    showOk('rs-ok','تم إرسال طلبك للإدارة ✅ ستتواصل معك الإدارة وتعطيك كلمة مرور مؤقتة.');

}

/* ---------- own listeners + startup ---------- */
onAuthStateChanged(auth,async u=>{
  const gen=++authGen;
  clearListeners();stopHB();destroyPlayer();cleanupExam();
  U=u;myPhoto='';myPhone='';myGrade='';
  if(!u){
    teachers={};videos={};library={};news={};exams={};examAttempts={};myLogs={};mineVideos={};
    ownNotifications={};broadcastNotifications={};notifications={};ownComplaints={};allComplaints={};
    usersAdmin={};staffMap={};resetReqs={};A=false;IS_SUPERVISOR=false;S={v:'home'};
    document.body.classList.remove('is-watching');loadedTeachers=false;
    render();hideOverlay();return;
  }
  try{
    const [adm,stf,ban]=await Promise.all([G('admins/'+u.uid),G('staff/'+u.uid),G('bans/'+u.uid)]);
    if(gen!==authGen)return;
    A=adm===true;
    IS_SUPERVISOR=!A&&stf===true;
    if(!isStaff()){
      if(ban){showingBan=ban;render();hideOverlay();return}
      const ok=await enforceSingleDevice();
      if(gen!==authGen)return;
      if(!ok){const b=await G('bans/'+u.uid);showingBan=b||{oldDeviceLabel:''};render();hideOverlay();return}
    }
    attachListeners(u);
  }catch(e){toast('تعذر تحميل البيانات، حاول مرة أخرى')}
  if(gen!==authGen)return;
  render();hideOverlay();
});
function hideOverlay(){setTimeout(()=>{const ov=$('#loading-overlay');if(ov)ov.classList.add('hide')},250)}

  }
}

/* ---------- device session (single-device enforcement) ---------- */
async function enforceSingleDevice(){
  if(!U)return true;
  try{
    const devId=getDeviceId();
    const cur=(await G('sessions/'+U.uid))||{};
    const now=Date.now();
    if(cur.deviceId&&cur.deviceId!==devId&&now-(cur.updatedAt||0)<10*60*1000){
      await set(R('bans/'+U.uid),{uid:U.uid,name:U.displayName||'',email:U.email||'',oldDevice:cur.deviceId,oldDeviceLabel:cur.deviceLabel||'',newDevice:devId,newDeviceLabel:deviceLabel(),bannedAt:now,reason:'تسجيل دخول من جهاز آخر'});
      return false;
    }
    await update(R('sessions/'+U.uid),{deviceId:devId,deviceLabel:deviceLabel(),updatedAt:now});
    return true;
  }catch(e){return true}
}

const redeem=vid=>once('redeem_'+vid,()=>doRedeem(vid));
async function doRedeem(vid){
  const v=videos[vid];if(!v||v.disabled)return toast('الفيديو موقوف');
  const c=normDigits($('#cd')?.value||'').replace(/\D/g,'');
  if(!/^\d{6}$/.test(c))return toast('الكود يجب أن يكون 6 أرقام');
  const r=await runTransaction(R('codes/'+c),cur=>{
    if(cur===null)return cur;
    if(cur.videoId!==vid)return;
    if(cur.used&&cur.usedBy!==U.uid)return;
    if(!cur.used){cur.used=true;cur.usedBy=U.uid;cur.usedByName=U.displayName||'';cur.usedAt=Date.now()}
    return cur;
  });
  const vv=r.snapshot.val();
  if(!vv||vv.usedBy!==U.uid||vv.videoId!==vid)return toast('الكود غير صحيح أو مستخدم من قبل');
  await set(R(`users/${U.uid}/videos/${vid}`),c);
  mineVideos={...mineVideos,[vid]:c};
  go('watch',vid);
}

function buildStudentStats(){
  const rows=Object.entries(videos).map(([vid,v])=>{
    const log=myLogs[vid];const isOpen=!!mineVideos[vid];
    let status;
    if(v.disabled)status='<span class="b r">موقوف</span>';
    else if(!isOpen)status='<span class="b y">يحتاج كود</span>';
    else if(log&&log.completed)status='<span class="b g">حضره كاملاً</span>';
    else if(log)status='<span class="b y">شاهد جزءاً</span>';
    else status='<span class="b g">مفتوح</span>';
    return{vid,title:v.title||'-',teacher:teachers[v.teacherId]?.name||'-',grade:v.grade||'-',isOpen,log,watched:!!log,disabled:!!v.disabled,status,lastAt:log?.lastAt||0,seconds:log?.seconds||0};
  });
  const total=rows.length,opened=rows.filter(r=>r.isOpen).length,watched=rows.filter(r=>r.watched).length;
  let list=rows;
  if(studentStatsFilter==='watched')list=rows.filter(r=>r.watched);
  else if(studentStatsFilter==='available')list=rows.filter(r=>r.isOpen&&!r.disabled);
  else if(studentStatsFilter==='locked')list=rows.filter(r=>!r.isOpen);
  list.sort((a,b)=>(b.lastAt||0)-(a.lastAt||0));
  const tr=list.map(r=>`<tr>

      <div style="margin-top:14px">${att?`<button class="s" onclick="go('examResult','${esc(id)}')">عرض النتيجة والإجابات</button>`:`<button onclick="go('takeExam','${esc(id)}')">🚀 ابدأ الامتحان</button>`}</div>
    </div>`;
  }).join('');

function keysFor(e){const k={};(e.questions||[]).forEach((q,i)=>{if(q&&q.correct!==undefined)k[i]=q.correct});return k}
function ansMapOf(att){
  const a=att.answers;if(!a)return{};
  if(Array.isArray(a))return Object.fromEntries(a.filter(Boolean).map(x=>[x.q,x.ans]));
  return a;
}
function gradeRows(e,keys,ansMap){
  const qs=e.questions||[];
  const rows=qs.map((q,i)=>{
    const ans=ansMap[i],key=keys[i];let ok=false;
    if(ans!==undefined&&ans!==null&&ans!==''){
      if(q.type==='mcq')ok=Number(ans)===Number(key);
      else if(q.type==='tf')ok=ans===key;
      else{const k=String(key??'').trim().toLowerCase();ok=!!k&&String(ans).trim().toLowerCase()===k}
    }
    return{q,i,ans,key,ok};
  });
  return{rows,correct:rows.filter(r=>r.ok).length,total:qs.length};
}
async function getResult(id){
  const e=exams[id]||{};const att=examAttempts[id]||{};
  const keys=(await G('examKeys/'+id))||keysFor(e);
  const g=gradeRows(e,keys,ansMapOf(att));
  const score=g.total?Math.round(g.correct/g.total*100):0;
  if(att.score===undefined&&att.answers!==undefined){
    try{await update(ref(db),{
      [`examAttempts/${U.uid}/${id}/score`]:score,[`examAttempts/${U.uid}/${id}/correctCount`]:g.correct,
      [`examResults/${id}/${U.uid}/score`]:score,[`examResults/${id}/${U.uid}/correctCount`]:g.correct
    })}catch(err){}
  }
  return{...g,score,att};
}
function fmtAns(q,v){
  if(v===undefined||v===null||v==='')return'لم تُجب';
  if(q.type==='mcq')return esc(q.options?.[v]??'-');
  if(q.type==='tf')return v?'✔️ صح':'❌ خطأ';
  return esc(v);
}
function fmtKey(q,k){
  if(k===undefined||k===null||k==='')return'غير محددة';
  if(q.type==='mcq')return esc(q.options?.[k]??'-');
  if(q.type==='tf')return k?'✔️ صح':'❌ خطأ';
  return esc(k);
}

  const id=S.id,e=exams[id];

/* ----- taking an exam ----- */
const draftKey=id=>`exdraft_${U.uid}_${id}`;
function loadDraft(id){try{return JSON.parse(store.get(draftKey(id))||'{}')}catch(e){return{}}}
async function vTakeExam(){
  const id=S.id,e=exams[id];
  if(!e||e.disabled)return msg('هذا الامتحان غير متاح.');
  if(examAttempts[id]){go('examResult',id);return msg('جارٍ التحويل…')}
  if(!activeExamState||activeExamState.id!==id){
    let startedAt=await G(`examStarts/${U.uid}/${id}`);
    if(!startedAt){
      startedAt=Date.now();
      try{await set(R(`examStarts/${U.uid}/${id}`),startedAt)}
      catch(err){return msg('تعذر بدء الامتحان، حاول مرة أخرى')}
    }
    if(examAttempts[id])return vExamResult();
    cleanupExam();
    const st={id,startedAt,violations:0,answers:loadDraft(id),submitted:false,timer:null,_cleanup:null};
    activeExamState=st;
    attachExamGuards(st);
  }
  const st=activeExamState;
  const left=e.duration*60000-(Date.now()-st.startedAt);
  if(left<=0){setTimeout(()=>submitExam(true),0);return msg('انتهى وقت الامتحان، يتم التسليم تلقائياً…')}
  const qHTML=(e.questions||[]).map((q,i)=>{
    const a=st.answers[i];
    if(q.type==='mcq')return `<div class="exam-q"><div class="q-text"><span class="q-num">${i+1}</span> ${esc(q.text)}</div>
      ${q.options.map((o,idx)=>`<label class="exam-opt ${a===idx?'selected':''}"><input type="radio" name="q_${i}" value="${idx}" ${a===idx?'checked':''} onchange="recordAnswer(${i},${idx})"><span>${esc(o)}</span></label>`).join('')}</div>`;
    if(q.type==='tf')return `<div class="exam-q"><div class="q-text"><span class="q-num">${i+1}</span> ${esc(q.text)}</div>
      <label class="exam-opt ${a===true?'selected':''}"><input type="radio" name="q_${i}" ${a===true?'checked':''} onchange="recordAnswer(${i},true)"><span>✔️ صح</span></label>
      <label class="exam-opt ${a===false?'selected':''}"><input type="radio" name="q_${i}" ${a===false?'checked':''} onchange="recordAnswer(${i},false)"><span>❌ خطأ</span></label></div>`;
    return `<div class="exam-q"><div class="q-text"><span class="q-num">${i+1}</span> ${esc(q.text)}</div>
      <textarea rows="3" placeholder="اكتب إجابتك هنا..." oninput="recordAnswer(${i},this.value)">${esc(a||'')}</textarea></div>`;
  }).join('');
  return `<button class="s" onclick="confirmExitExam()" style="margin-bottom:16px">← خروج</button>
    <h2>${esc(e.title)}</h2>
    <div class="exam-timer" id="examTimer"><span>⏱ الوقت المتبقي</span><span class="time-big">${fmtClock(Math.max(0,left/1000))}</span></div>
    <div class="exam-vio" id="examVioBox" style="display:${st.violations?'block':'none'}">⚠️ المخالفات: <span id="examVioCount">${st.violations}</span></div>
    ${qHTML}
    <button onclick="submitExam(false)" style="width:100%;padding:16px;font-size:16px;margin-top:16px">📤 تسليم الامتحان</button>`;
}
function attachExamGuards(st){
  const prevent=ev=>ev.preventDefault();
  const evs=['copy','cut','paste','contextmenu'];
  const onVis=()=>{
    if(document.hidden&&activeExamState===st&&!st.submitted){
      st.violations++;toast('⚠️ تم تسجيل خروجك من الصفحة، مخالفة رقم '+st.violations);
      const b=$('#examVioBox'),c=$('#examVioCount');if(b&&c){b.style.display='block';c.textContent=st.violations}
    }
  };
  evs.forEach(ev=>document.addEventListener(ev,prevent));
  document.addEventListener('visibilitychange',onVis);
  st.timer=setInterval(()=>{
    if(activeExamState!==st||st.submitted)return;
    const e=exams[st.id];if(!e)return;
    const left=e.duration*60000-(Date.now()-st.startedAt);
    const el=$('#examTimer');
    if(el){const big=el.querySelector('.time-big');if(big)big.textContent=fmtClock(Math.max(0,left/1000));el.classList.toggle('warn',left<=120000&&left>30000);el.classList.toggle('danger',left<=30000)}
    if(left<=0)submitExam(true);
  },250);
  st._cleanup=()=>{evs.forEach(ev=>document.removeEventListener(ev,prevent));document.removeEventListener('visibilitychange',onVis)};
}
function recordAnswer(i,val){
  if(!activeExamState||activeExamState.submitted)return;
  if(val===''||val===undefined)delete activeExamState.answers[i];else activeExamState.answers[i]=val;
  store.set(draftKey(activeExamState.id),JSON.stringify(activeExamState.answers));
  document.querySelectorAll(`input[name="q_${i}"]`).forEach(inp=>{const o=inp.closest('.exam-opt');if(o)o.classList.toggle('selected',inp.checked)});
}
function confirmExitExam(){
  if(!activeExamState)return go('exams');
  if(!confirm('هل تريد الخروج من الامتحان؟ يمكنك الرجوع لاحقاً وستستكمل من حيث توقفت، لكن الوقت يستمر.'))return;
  cleanupExam();go('exams');
}
function cleanupExam(){
  const st=activeExamState;
  if(!st)return;
  if(st.timer)clearInterval(st.timer);
  if(st._cleanup){try{st._cleanup()}catch(e){}}
  activeExamState=null;
}
async function submitExam(force){
  const st=activeExamState;
  if(!st||st.submitted)return;
  if(!force&&!confirm('هل أنت متأكد من التسليم؟ لا يمكن التعديل بعدها.'))return;
  st.submitted=true;
  if(st.timer)clearInterval(st.timer);
  const e=exams[st.id]||{};
  const rec={studentName:myName||U.displayName||'',answers:st.answers,submittedAt:Date.now(),timeTaken:Math.round((Date.now()-st.startedAt)/1000),violations:st.violations,autoSubmit:!!force,total:(e.questions||[]).length};
  try{
    await update(ref(db),{[`examAttempts/${U.uid}/${st.id}`]:rec,[`examResults/${st.id}/${U.uid}`]:rec});
  }catch(err){
    st.submitted=false;
    if(st.timer)st.timer=setInterval(()=>{},1e9),clearInterval(st.timer);
    toast('تعذر التسليم، تحقق من الاتصال وحاول مرة أخرى');
    return;
  }
  store.del(draftKey(st.id));
  const id=st.id;
  cleanupExam();
  go('examResult',id);
}

    </div>

function onQTypeChange(sel){
  const item=sel.closest('.q-builder-item');if(!item)return;
  const t=sel.value;
  item.querySelector('.q-options-box').style.display=t==='mcq'?'':'none';
  item.querySelector('.q-tf-box').style.display=t==='tf'?'':'none';
  item.querySelector('.q-short-box').style.display=t==='short'?'':'none';
}
const createExam=()=>once('createExam',doCreateExam);
async function doCreateExam(){
  if(!isStaff())return toast('غير مصرح');
  const title=($('#exTitle')?.value||'').trim(),grade=$('#exGrade')?.value||'';
  const duration=clamp(parseInt($('#exDuration')?.value,10)||30,1,180);
  if(!title)return toast('اكتب عنوان الامتحان');
  const items=[...document.querySelectorAll('.q-builder-item')];
  if(!items.length)return toast('أضف سؤالاً واحداً على الأقل');
  if(items.length>100)return toast('الحد الأقصى 100 سؤال');
  const questions=[],keys={};
  for(let i=0;i<items.length;i++){
    const item=items[i];
    const type=item.querySelector('.q-type').value;
    const text=item.querySelector('.q-text').value.trim();
    if(!text)return toast('كل سؤال يحتاج نصاً');
    if(type==='mcq'){
      const opts=[...item.querySelectorAll('.q-opt')].map(x=>x.value.trim());
      if(opts.some(o=>!o))return toast('كل خيارات الاختيار من متعدد يجب أن تُملأ');
      const c=item.querySelector('input[type=radio]:checked');
      if(!c)return toast('حدد الإجابة الصحيحة لكل سؤال');
      questions.push({type:'mcq',text,options:opts});keys[i]=parseInt(c.value,10);
    }else if(type==='tf'){
      questions.push({type:'tf',text});keys[i]=item.querySelector('.q-tf-answer').value==='true';
    }else{
      questions.push({type:'short',text});keys[i]=item.querySelector('.q-short-answer').value.trim();
    }
  }
  const id='ex'+Date.now();
  await update(ref(db),{[`exams/${id}`]:{title,grade,duration,questions,created:Date.now(),createdBy:myName||U.displayName||'',disabled:false},[`examKeys/${id}`]:keys});
  toast('تم إنشاء الامتحان ✅');qBuildCounter=0;go('admin','','exams');
}

async function runMigration(){
  if(!A)return;
  if(!confirm('تشغيل الترحيل الآن؟'))return;
  try{
    const up={};
    const vs=(await G('videos'))||{};
    Object.entries(vs).forEach(([id,v])=>{if(v&&v.url){up[`vurls/${id}`]=v.url;up[`videos/${id}/url`]=null}});
    const cs=(await G('codes'))||{};
    Object.entries(cs).forEach(([code,c])=>{if(c&&c.url)up[`codes/${code}/url`]=null});
    const ex=(await G('exams'))||{};
    Object.entries(ex).forEach(([id,e])=>{
      const qs=e.questions||[];
      const keys={};
      qs.forEach((q,i)=>{if(q&&q.correct!==undefined)keys[i]=q.correct});
      if(Object.keys(keys).length)up[`examKeys/${id}`]=keys;
      if(qs.some(q=>q&&q.correct!==undefined))up[`exams/${id}/questions`]=qs.map(({correct,...rest})=>rest);
      if(e.attempts){
        Object.entries(e.attempts).forEach(([uid,att])=>{
          up[`examResults/${id}/${uid}`]=att;
          up[`examAttempts/${uid}/${id}`]=att;
        });
        up[`exams/${id}/attempts`]=null;
      }
    });
    const us=(await G('users'))||{};
    Object.entries(us).forEach(([uid,u])=>{if(u&&u.isSupervisor===true)up[`staff/${uid}`]=true});
    if(Object.keys(up).length)await update(ref(db),up);
    toast('تم الترحيل بنجاح ✅');scheduleRender(0);
  }catch(e){toast(fail(e))}
}

async function gen(vid,n){
  let ok=0,attempts=0;
  const max=n*10;
  while(ok<n&&attempts<max){
    const c=String(crypto.getRandomValues(new Uint32Array(1))[0]%900000+100000);
    try{
      const r=await runTransaction(R('codes/'+c),cur=>{if(cur!==null)return cur;return{videoId:vid,used:false,createdAt:Date.now()}});
      if(r.committed)ok++;
    }catch(e){}
    attempts++;
  }
  return ok;
}

  const headers=[...document.querySelectorAll('#pdf-src thead th')].map(th=>th.innerText.trim());
  const rows=[...document.querySelectorAll('#pdf-src tbody tr')].map(tr=>[...tr.querySelectorAll('td')].map(td=>td.innerText.trim())).filter(r=>r.length);
  printHTML(v.title,`<h2>${esc(v.title)}</h2><p>عدد السجلات: ${rows.length}</p><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
}
async function exportCodesPDF(vid){
  const v=videos[vid];if(!v)return;
  const s=await get(query(R('codes'),orderByChild('videoId'),equalTo(vid)));
  const codes=[];s.forEach(c=>{if(!c.val().used)codes.push(c.key)});
  if(!codes.length)return toast('لا توجد أكواد متاحة');
  const teacher=teachers[v.teacherId]?.name||'-';
  printHTML('أكواد '+v.title,`<h2>أكواد: ${esc(v.title)}</h2><p>المدرس: ${esc(teacher)} — الصف: ${esc(v.grade||'-')} — عدد الأكواد: ${codes.length}</p><table><thead><tr><th>الكود</th><th>الفيديو</th><th>المدرس</th></tr></thead><tbody>${codes.map(c=>`<tr><td style="font-family:monospace;font-size:16px;letter-spacing:2px">${esc(c)}</td><td>${esc(v.title)}</td><td>${esc(teacher)}</td></tr>`).join('')}</tbody></table>`);
}
