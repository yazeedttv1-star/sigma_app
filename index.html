<html lang="ar" dir="rtl">
<head>

<style>
:root{
  --bg:#f8fafc; --surface:#ffffff; --surface2:#f1f5f9;
  --tx:#0f172a; --tx2:#475569; --mu:#94a3b8;
  --ac:#2563eb; --ac2:#1d4ed8; --ac-soft:#dbeafe;
  --ok:#10b981; --er:#ef4444; --warn:#f59e0b;
  --bd:#e2e8f0; --r:16px; --r-sm:10px; --r-lg:22px;
  --shadow:0 1px 3px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.04);
  --shadow-lg:0 10px 40px rgba(15,23,42,.12);
}
html.dark{
  --bg:#0b1220; --surface:#111a2e; --surface2:#1a2440;
  --tx:#f1f5f9; --tx2:#cbd5e1; --mu:#64748b;
  --ac:#60a5fa; --ac2:#3b82f6; --ac-soft:#1e3a8a;
  --bd:#1e293b;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.3);
  --shadow-lg:0 10px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{min-height:100%;height:auto}
body{height:auto;min-height:100vh}
body{font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;
  padding-bottom:calc(120px + env(safe-area-inset-bottom));overflow-x:hidden;
  -webkit-user-select:none;user-select:none;transition:background .25s,color .25s}
input,select,textarea{-webkit-user-select:text;user-select:text}
h1,h2,h3{font-weight:800;line-height:1.3}
h2{font-size:20px;margin-bottom:16px;color:var(--tx)}
#loading-overlay{position:fixed;inset:0;z-index:9999;background:rgba(248,250,252,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .3s ease}
html.dark #loading-overlay{background:rgba(11,18,32,.7)}
#loading-overlay.hide{opacity:0;pointer-events:none}
.spinner{width:40px;height:40px;border:4px solid var(--ac-soft);border-top-color:var(--ac);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.top-bar{background:linear-gradient(135deg,var(--ac) 0%,var(--ac2) 100%);color:#fff;padding:24px 20px;border-bottom-left-radius:24px;border-bottom-right-radius:24px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-start;position:relative;box-shadow:var(--shadow)}
.top-bar .welcome h1{font-size:22px;margin-bottom:4px;font-weight:800}
.top-bar .welcome p{font-size:14px;opacity:.9;margin-bottom:12px}
.top-bar .user-area{display:flex;align-items:center;gap:8px}
.top-bar .avatar-lg{width:56px;height:56px;border-radius:50%;border:3px solid rgba(255,255,255,.4);object-fit:cover}
.top-bar .actions{display:flex;gap:8px;align-items:center}
.top-bar .action-btn{background:rgba(255,255,255,.2);color:#fff;border:0;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.top-bar .action-btn:hover{background:rgba(255,255,255,.3)}
.top-bar .action-btn.icon-only{width:42px;height:42px;padding:0;border-radius:50%;position:relative;flex:0 0 42px;background:#fff;color:#0f172a;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.top-bar .action-btn.icon-only svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top-bar .action-btn.icon-only .badge-dot{position:absolute!important;top:-2px!important;right:-2px!important;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:#ef4444!important;color:#fff!important;border:2px solid #fff!important;align-items:center;justify-content:center;font-size:10px;font-weight:800;display:flex}
main{max-width:1000px;margin:0 auto;padding:0 20px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:0;cursor:pointer;text-align:center;transition:.2s var(--shadow);overflow:hidden;position:relative;display:flex;flex-direction:column}
.card:hover{border-color:var(--ac);box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.card:active{transform:scale(.98)}
.card .card-img-wrap{width:100%;height:160px;background:linear-gradient(135deg,#e0e7ff 0%,#f1f5f9 100%);position:relative}
.card .card-img-wrap img{width:100%;height:100%;object-fit:cover}
.card .card-body{padding:12px 10px;background:var(--surface);flex:1;display:flex;flex-direction:column;justify-content:center}
.card b{font-size:16px;display:block;color:var(--tx);font-weight:800}
.row{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s var(--shadow)}
.row:hover{border-color:var(--ac);box-shadow:var(--shadow-lg)}
.row:active{transform:scale(.995)}
.row>div{flex:1;min-width:0}
.row b{font-size:15px;display:block;color:var(--tx)}
.row small{color:var(--mu);font-size:13px;display:block;margin-top:2px}
button,.btn{font-family:inherit;font-weight:700;border:0;border-radius:var(--r-sm);padding:10px 18px;background:var(--ac);color:#fff;cursor:pointer;transition:.15s;font-size:14px}
button:hover{background:var(--ac2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.3)}
button:active{transform:translateY(0) scale(.97)}
button.s{background:var(--surface2);color:var(--tx)}
button.s:hover{background:var(--bd);box-shadow:none;transform:none}
button.d{background:var(--er)}button.d:hover{background:#dc2626}
button.g{background:var(--ok)}button.g:hover{background:#059669}
label{font-size:13px;color:var(--tx2);font-weight:700;display:block;margin-bottom:6px}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--surface);color:var(--tx);margin-bottom:14px;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
.box{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:22px;margin-bottom:20px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px;text-align:right;border-bottom:1px solid var(--bd)}
th{background:var(--surface2);font-weight:700;color:var(--tx2);font-size:12px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r)}
.b{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--tx2)}
.b.g{background:#d1fae5;color:#065f46}
.b.r{background:#fee2e2;color:#991b1b}
.b.y{background:#fef3c7;color:#92400e}
html.dark .b.g{background:#064e3b;color:#6ee7b7}
html.dark .b.r{background:#7f1d1d;color:#fca5a5}
html.dark .b.y{background:#78350f;color:#fcd34d}
.g{color:var(--ok)}.r{color:var(--er)}.y{color:var(--warn)}
.code{font-family:'Courier New',monospace;font-size:15px;letter-spacing:2px;direction:ltr;display:inline-block;background:var(--surface2);padding:3px 10px;border-radius:6px;color:var(--ac2);font-weight:700}
.mut{color:var(--mu);text-align:center;padding:40px 20px}
.player-wrap{width:100%;margin-bottom:16px}
.pl{position:relative;background:#000;border-radius:var(--r);overflow:hidden;width:100%;aspect-ratio:16/9;max-height:80vh;margin:0 auto;box-shadow:var(--shadow-lg)}
.pl iframe,.pl video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
.pl.crop-yt iframe{height:115%!important;top:-7.5%!important}
.yt-bottom-mask{position:absolute;bottom:0;left:0;right:0;height:50px;z-index:11;background:#000;pointer-events:none}
.yt-top-mask{position:absolute;top:0;left:0;right:0;height:50px;z-index:11;background:#000;pointer-events:none}
.yt-shield{position:absolute;inset:0;z-index:10;background:transparent;cursor:pointer}
.wm{position:absolute;pointer-events:none;z-index:20;display:flex;align-items:center;gap:6px;font-size:12px;opacity:.45;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:99px;animation:mv 24s linear infinite alternate;direction:ltr;color:#fff}
.wm img{width:22px;height:22px;border-radius:50%;object-fit:cover}
@keyframes mv{0%{top:20%;left:4%}25%{top:70%;left:55%}50%{top:35%;left:70%}75%{top:80%;left:8%}100%{top:20%;left:60%}}
.custom-player-ctrl{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--bd);padding:12px 16px;border-radius:var(--r);margin-top:12px;box-shadow:var(--shadow)}
.custom-player-ctrl .progress-row{display:flex;align-items:center;gap:12px}
.custom-player-ctrl .play-btn{background:var(--ac);color:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:20px;font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;flex-shrink:0}
.custom-player-ctrl .play-btn:hover{background:var(--ac2);transform:scale(1.05)}
.custom-player-ctrl .progress-container{flex:1;display:flex;align-items:center;gap:8px}
.custom-player-ctrl input[type=range]{flex:1;padding:0;margin:0;height:6px;accent-color:var(--ac);cursor:pointer;background:transparent}
.custom-player-ctrl .time{font-family:monospace;font-size:14px;font-weight:700;color:var(--tx);direction:ltr;min-width:45px;text-align:center}
.custom-player-ctrl .tools-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;border-top:1px solid var(--bd);padding-top:10px}
.custom-player-ctrl .tools-row button{padding:6px 12px;font-size:13px;border-radius:8px;background:var(--surface2);color:var(--tx)}
.custom-player-ctrl .tools-row button:hover{background:var(--ac);color:#fff}
.custom-player-ctrl .tools-row select{width:auto;padding:6px 10px;margin:0;font-size:13px;border-radius:8px}
.bottombar{position:fixed;bottom:0;left:0;transform:none;z-index:40;background:var(--surface);border:1px solid var(--bd);border-bottom:0;border-radius:22px 22px 0 0;display:flex;justify-content:space-around;gap:4px;padding:8px 16px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -5px 24px rgba(0,0,0,.10);width:100%;max-width:none}
.bottombar button{background:transparent;color:var(--tx2);border:0;padding:10px 4px;border-radius:25px;font-size:11px;font-weight:700;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.bottombar button:hover{background:var(--surface2);color:var(--tx)}
.bottombar button.on{color:var(--ac);background:var(--ac-soft)}
.bottombar button.on svg{fill:var(--ac)}
.bottombar button.danger{color:var(--er)}
.bottombar button.danger:hover{background:var(--er);color:#fff}
.bottombar button.danger:hover svg{fill:#fff}
.bottombar button svg{width:22px;height:22px;fill:var(--tx2);transition:.15s}
.contact-btn-nav{color:#25D366 !important;}
.contact-btn-nav svg{fill:#25D366 !important;}
.contact-btn-nav:hover{background:#e8f5e9 !important;}
#t{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 22px;border-radius:var(--r);font-weight:700;display:none;z-index:100;box-shadow:var(--shadow-lg);max-width:90vw;text-align:center;font-size:14px}
#t.show{display:block;animation:pop .25s}
@keyframes pop{0%{transform:translateX(-50%) scale(.8);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
.profile-card{text-align:center;padding:30px 20px}
.profile-card img{width:100px;height:100px;border-radius:50%;border:4px solid var(--ac-soft);margin-bottom:16px;object-fit:cover}
.profile-card h2{margin-bottom:8px}
.profile-card p{color:var(--mu);font-size:15px;margin-bottom:24px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex;animation:pop .2s}
.modal-content{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:400px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-lg)}
.modal-header{padding:16px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:16px;margin:0}
.modal-body{padding:16px;overflow-y:auto;flex:1}
.noti-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--bd);font-size:13px;line-height:1.5}
.noti-item:last-child{border-bottom:0}
.noti-item span{display:block;color:var(--mu);font-size:11px;margin-top:4px}
.auth-container{max-width:400px;margin:0 auto;padding:40px 20px;text-align:center}
.auth-container h1{font-size:32px;color:var(--ac);margin-bottom:8px;font-weight:800;letter-spacing:-1px}
.auth-container p{color:var(--mu);margin-bottom:24px;font-size:15px}
.auth-btn{width:100%;padding:14px;font-size:16px;border-radius:12px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:10px}
.auth-btn.phone{background:var(--ac);color:#fff}
.auth-btn.phone:hover{background:var(--ac2)}
.auth-form{text-align:right}
.auth-form label{display:block;margin-bottom:6px;font-weight:700;font-size:13px;color:var(--tx2)}
.auth-form input{margin-bottom:12px}
.auth-form .error{color:var(--er);font-size:13px;margin-bottom:10px;display:none}
.admin-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;background:var(--surface2);padding:6px;border-radius:12px}
.admin-tabs button{flex:1 1 calc(50% - 6px);padding:10px;font-size:13px;border-radius:8px;background:var(--surface);color:var(--tx2);border:1px solid var(--bd)}
.admin-tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 2px 8px rgba(37,99,235,.3)}
@media(max-width:768px){.admin-tabs button{flex:1 1 100%}}
@media(max-width:720px){
  main{padding:0 14px 40px}
  h2{font-size:18px}
  .top-bar{padding:16px}
  .top-bar .welcome h1{font-size:18px}
  .pl.crop-yt iframe{height:118%!important;top:-9%!important}
  .yt-bottom-mask{height:55px}
  .yt-top-mask{height:55px}
}
@media(max-width:520px){
  .pl{max-height:60vh}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .card .card-img-wrap{height:130px}
  .card b{font-size:14px}
}
@media print{body{display:none}}
.ban-screen{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.ban-screen .box-max{max-width:420px}
.ban-screen h1{font-size:28px;color:var(--er);margin-bottom:14px}
.ban-screen p{color:var(--tx2);margin-bottom:24px;line-height:1.7}
.news-card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:16px;margin-bottom:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.news-card img{width:100%;max-height:300px;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--bd)}
.news-text{font-size:15px;line-height:1.7;color:var(--tx);white-space:pre-wrap}
.news-date{font-size:12px;color:var(--mu);font-weight:700;margin-top:4px}
</style>
</head>
<body>
<div id="loading-overlay">
  <div class="spinner"></div>
  <p style="font-family:Cairo,sans-serif;font-weight:700;color:var(--ac)">جارٍ التحميل...</p>
</div>
<div id="app"></div><div id="t"></div>
<div class="modal" id="notiModal">

    <div class="modal-body" style="padding:0; background:#333; display:flex; justify-content:center; align-items:center; min-height:300px;">

    </div>
    <div style="padding:16px; display:flex; gap:10px;">

      <button class="s" onclick="cancelCrop()" style="flex:1">إلغاء</button>
    </div>
  </div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const THEME_KEY='sigma-theme';
function initTheme(){const saved=localStorage.getItem(THEME_KEY);const prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;if(saved==='dark'||(!saved&&prefersDark))document.documentElement.classList.add('dark')}

function img(f,s){
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const cropImage = $('#cropImage');
      cropImage.src = e.target.result;
      $('#cropModal').classList.add('show');
      if (cropper) cropper.destroy();
      cropper = new Cropper(cropImage, { aspectRatio: 1, viewMode: 1, background: false, autoCropArea: 1 });
      cropResolve = (croppedDataUrl) => {
        $('#cropModal').classList.remove('show');
        cropper.destroy();
        cropper = null;
        if (!croppedDataUrl) return resolve(null);
        const imgObj = new Image();
        imgObj.onload = () => {
          const canvas = document.createElement('canvas');

async function registerPhone() {
  const name = $('#reg-name').value.trim();
  const phone = $('#reg-phone').value.trim();
  const pass = $('#reg-pass').value;
  const pass2 = $('#reg-pass2').value;
  const err = $('#reg-error');
  err.style.display = 'none';
  if (!name || name.split(' ').length < 4) { err.textContent = 'يجب كتابة الاسم الرباعي كاملاً (4 مقاطع)'; err.style.display = 'block'; return; }
  if (!/^01[0-9]{9}$/.test(phone)) { err.textContent = 'رقم الهاتف يجب أن يكون 11 رقم ويبدأ بـ 01'; err.style.display = 'block'; return; }
  if (pass.length < 6) { err.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل'; err.style.display = 'block'; return; }
  if (pass !== pass2) { err.textContent = 'كلمتا المرور غير متطابقتين'; err.style.display = 'block'; return; }
  try {
    const fakeEmail = `${phone}@sigma.user`;
    const userCredential = await createUserWithEmailAndPassword(auth, fakeEmail, pass);
    const user = userCredential.user;
    await updateProfile(user, { displayName: name });
    await set(R('users/' + user.uid), { name: name, phone: phone, email: fakeEmail, photo: '', createdAt: Date.now(), isSupervisor: false });
    toast('تم إنشاء الحساب بنجاح');
    setTimeout(() => location.reload(), 1000);
  } catch (e) {
    if (e.code === 'auth/email-already-in-use') { err.textContent = 'رقم الهاتف مسجل بالفعل، يمكنك تسجيل الدخول.'; } 
    else { err.textContent = 'حدث خطأ: ' + e.message; }
    err.style.display = 'block';
  }
}
async function loginPhone() {
  const phone = $('#login-phone').value.trim();
  const pass = $('#login-pass').value;
  const err = $('#login-error');
  err.style.display = 'none';
  if (!/^01[0-9]{9}$/.test(phone)) { err.textContent = 'رقم الهاتف غير صحيح'; err.style.display = 'block'; return; }
  const failKey = `login_fails_${phone}`;
  const lockKey = `login_lock_${phone}`;
  const lockTime = localStorage.getItem(lockKey);
  if (lockTime) {
    const remaining = Math.ceil((parseInt(lockTime) - Date.now()) / 60000);
    if (remaining > 0) {
      err.textContent = `تم قفل الحساب مؤقتاً. يرجى المحاولة بعد ${remaining} دقيقة.`;
      err.style.display = 'block'; return;
    } else {
      localStorage.removeItem(lockKey);
      localStorage.removeItem(failKey);
    }
  }
  try {
    const fakeEmail = `${phone}@sigma.user`;
    await signInWithEmailAndPassword(auth, fakeEmail, pass);
    localStorage.removeItem(failKey);
    toast('تم تسجيل الدخول بنجاح');
  } catch (e) {
    let fails = parseInt(localStorage.getItem(failKey) || "0") + 1;
    localStorage.setItem(failKey, fails);
    if (fails >= 3) {
      localStorage.setItem(lockKey, Date.now() + 15 * 60 * 1000);
      err.textContent = 'تم إدخال كلمة مرور خاطئة 3 مرات. الحساب مقفل لمدة 15 دقيقة.';
      localStorage.removeItem(failKey);
    } else {
      err.textContent = `رقم الهاتف أو كلمة المرور غير صحيحة (المحاولة ${fails} من 3)`;
    }
    err.style.display = 'block';
  }
}

async function updateProfilePhoto() {

async function redeem(vid){
  const v=videos[vid];if(!v||v.disabled)return toast('الفيديو موقوف');
  const c=$('#cd').value.trim();if(!/^\d{6}$/.test(c))return toast('الكود يجب أن يكون 6 أرقام');
  try{
    const r=await runTransaction(R('codes/'+c),cur=>{
      if(cur===null)return cur;
      if(cur.videoId!==vid)return;
      if(cur.used&&cur.usedBy!==U.uid)return;
      if(!cur.used)Object.assign(cur,{used:true,usedBy:U.uid,usedByName:U.displayName,usedByEmail:U.email,usedAt:Date.now()});
      return cur;
    });
    const vv=r?.snapshot.val();
    if(!vv||vv.usedBy!==U.uid||vv.videoId!==vid)return toast('الكود غير صحيح أو مستخدم من قبل');
    await set(R(`users/${U.uid}/videos/${vid}`),c);
    window.__mineVideos=window.__mineVideos||{};window.__mineVideos[vid]=c;
    go('watch',vid);
  }catch(e){ toast('حدث خطأ أثناء التحقق من الكود'); }
}

async function vWatch(){

  else{playerHTML=`<iframe id="vplayer" src="${esc(e.s)}" allow="autoplay;encrypted-media;fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" sandbox="allow-scripts allow-same-origin allow-presentation allow-popups"></iframe>`}
  let controlsHTML='';
  if(isYT||e.t==='v'){
    controlsHTML=`<div class="custom-player-ctrl"><div class="progress-row"><button id="playPauseBtn" class="play-btn" onclick="togglePlay()">▶</button><div class="progress-container"><span class="time" id="cTime">0:00</span><input type="range" id="cSeek" min="0" max="100" value="0" step="0.1" oninput="onSeek(this.value)"><span class="time" id="dTime">0:00</span></div></div><div class="tools-row"><button onclick="seekRel(-5)">⏪ -5 ثوان</button><button onclick="seekRel(5)">+5 ثوان ⏩</button><span style="color:var(--mu);font-size:13px;font-weight:700;margin:0 4px">السرعة:</span><select id="speedSelector" onchange="setRate(this.value)"><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1x (عادي)</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option></select><button onclick="toggleFullscreen()" id="fsBtn">⛶ ملء الشاشة</button></div></div>`;

function initPlayer(){const el=document.getElementById('vplayer');if(!el)return;if(el.tagName==='IFRAME'&&el.src.includes('youtube')){if(!window.YT){const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);window.onYouTubeIframeAPIReady=()=>setupYT()}else{setupYT()}}else if(el.tagName==='VIDEO'){el.addEventListener('timeupdate',updateUI);el.addEventListener('loadedmetadata',updateUI);el.addEventListener('play',()=>{document.getElementById('playPauseBtn').textContent='❚❚';updateUI()});el.addEventListener('pause',()=>{document.getElementById('playPauseBtn').textContent='▶';updateUI()})}}
function setupYT(){const iframe=document.getElementById('vplayer');if(!iframe)return;ytPlayer=new YT.Player(iframe,{events:{'onReady':()=>{updateUI();startPoll()},'onStateChange':(event)=>{if(event.data===1){document.getElementById('playPauseBtn').textContent='❚❚'}else{document.getElementById('playPauseBtn').textContent='▶'}}}})}
function startPoll(){stopPoll();pollInterval=setInterval(updateUI,250)}
function stopPoll(){if(pollInterval){clearInterval(pollInterval);pollInterval=null}}
function updateUI(){const seek=document.getElementById('cSeek');const cTime=document.getElementById('cTime');const dTime=document.getElementById('dTime');if(!seek)return;let cur=0,dur=0;if(ytPlayer&&ytPlayer.getCurrentTime){try{cur=ytPlayer.getCurrentTime()||0;dur=ytPlayer.getDuration()||0}catch(e){}}else{const vid=document.getElementById('vplayer');if(vid&&vid.tagName==='VIDEO'){cur=vid.currentTime||0;dur=vid.duration||0}}if(dur>0){seek.value=(cur/dur)*100;cTime.textContent=fmt(cur);dTime.textContent=fmt(dur)}}
function fmt(s){s=Math.max(0,Math.floor(s||0));const m=Math.floor(s/60),ss=s%60;return m+':'+String(ss).padStart(2,'0')}
function togglePlay(){if(ytPlayer&&ytPlayer.getPlayerState){const state=ytPlayer.getPlayerState();if(state===1){ytPlayer.pauseVideo()}else{ytPlayer.playVideo()}}else{const vid=document.getElementById('vplayer');if(vid&&vid.tagName==='VIDEO'){if(vid.paused)vid.play();else vid.pause()}}}
function onSeek(val){let dur=0,target=0;if(ytPlayer&&ytPlayer.getDuration){try{dur=ytPlayer.getDuration()||0;target=(val/100)*dur;ytPlayer.seekTo(target,true)}catch(e){}}else{const vid=document.getElementById('vplayer');if(vid&&vid.tagName==='VIDEO'){dur=vid.duration||0;vid.currentTime=(val/100)*dur}}}
function seekRel(seconds){let cur=0;if(ytPlayer&&ytPlayer.getCurrentTime){try{cur=ytPlayer.getCurrentTime()||0;ytPlayer.seekTo(cur+seconds,true)}catch(e){}}else{const vid=document.getElementById('vplayer');if(vid&&vid.tagName==='VIDEO'){cur=vid.currentTime||0;vid.currentTime=cur+seconds}}}
function setRate(rate){if(ytPlayer&&ytPlayer.setPlaybackRate){try{ytPlayer.setPlaybackRate(parseFloat(rate))}catch(e){}}else{const vid=document.getElementById('vplayer');if(vid&&vid.tagName==='VIDEO'){vid.playbackRate=parseFloat(rate)}}}
async function toggleFullscreen(){const box=document.getElementById('plbox');const btn=document.getElementById('fsBtn');if(!box)return;try{if(!document.fullscreenElement){const fn=box.requestFullscreen||box.webkitRequestFullscreen||box.msRequestFullscreen;if(!fn)return toast('ملء الشاشة غير مدعوم في هذا المتصفح');await fn.call(box)}else{const fn=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;if(fn)await fn.call(document)}}catch(e){toast('تعذر تغيير وضع الشاشة')}if(btn)btn.innerHTML=document.fullscreenElement?'⛶ خروج من ملء الشاشة':'⛶ ملء الشاشة'}
function stopHB(){clearInterval(hb);hb=null}

async function addNews(){
  const text = $('#newText').value.trim();
  const url = $('#newVid').value.trim();
  const file = $('#newImg').files[0];
  if(!text && !file && !url) return toast('يجب إضافة نص أو صورة أو فيديو على الأقل');
  try {
    let photo = '';
    if(file){
      photo = await img(file, 800);
      if(!photo) return toast('تم إلغاء قص الصورة');
    }
    const id = 'n' + Date.now();
    await set(R('news/' + id), { text, url, photo, created: Date.now() });
    toast('تم نشر الخبر بنجاح');
    $('#newText').value = '';
    $('#newVid').value = '';
    $('#newImg').value = '';
    render();
  } catch (e) {
    toast('تعذر نشر الخبر: ' + e.message);
  }
}
async function delNews(id){
  if(!confirm('حذف هذا الخبر؟')) return;
  await remove(R('news/' + id));
  toast('تم الحذف');
  render();
}

async function vAdminStudents() {
  if(!A)return'<div class="mut">غير مصرح.</div>';
  const users = await G('users') || {};
  const arr = Object.entries(users).map(([id,u])=>({id,...u})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(!arr.length) return '<div class="mut">لا يوجد طلاب مسجلون بعد.</div>';
  
  let html = `<div class="box"><label>بحث سريع (بالاسم أو الهاتف)</label><input id="searchStudent" placeholder="اكتب اسم الطالب..." oninput="filterStudents(this.value)"></div>
  <h2>الطلاب المسجلون (${arr.length})</h2><div class="tw"><table id="studentsTable"><thead><tr><th>الاسم</th><th>رقم الهاتف</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>`;
  
  arr.forEach(u => {
    const isSup = u.isSupervisor === true;
    const isAdmin = ADMIN_PHONES.includes(u.phone || '');
    html += `<tr class="student-row" data-search="${esc(u.name)} ${esc(u.phone)} ${esc(u.email)}">
      <td><b onclick="go('studentProfile','${u.id}')" style="cursor:pointer;color:var(--ac)">${esc(u.name||'-')}</b></td>
      <td dir="ltr">${esc(u.phone||'-')}</td>
      <td>${isAdmin ? '<span class="b r">أدمن</span>' : isSup ? '<span class="b y">مشرف</span>' : '<span class="b">طالب</span>'}</td>
      <td>
        ${!isAdmin ? `<button class="s" style="padding:4px 8px;font-size:12px;margin-left:4px" onclick="toggleSupervisor('${u.id}', ${isSup})">${isSup?'إلغاء الإشراف':'تعيين مشرف'}</button>
        <button class="d" style="padding:4px 8px;font-size:12px" onclick="delUser('${u.id}')">حذف</button>` : ''}
      </td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}

function filterStudents(q){
  const query = q.toLowerCase();
  document.querySelectorAll('.student-row').forEach(row => {
    const text = row.getAttribute('data-search').toLowerCase();
    row.style.display = text.includes(query) ? '' : 'none';
  });
}

async function vStudentProfile(){
  if(!A) return '<div class="mut">غير مصرح.</div>';
  const uid = S.id;
  const user = await G('users/'+uid);
  if(!user) return '<div class="mut">الطالب غير موجود.</div>';
  
  const allLogs = await G('logs') || {};
  const studentVideos = [];
  for (const vid in allLogs) {
    if(allLogs[vid][uid]) {
      studentVideos.push({ vid, title: videos[vid]?.title || 'محذوف', ...allLogs[vid][uid] });
    }
  }

  return `<button class="s" onclick="go('admin','','students')" style="margin-bottom:16px">← رجوع للطلاب</button>

    <div style="display:flex;gap:16px;align-items:center;margin-bottom:20px">
      <img src="${user.photo||badge||'https://ui-avatars.com/api/?name='+encodeURIComponent(user.name||'U')+'&background=2563eb&color=fff&size=100'}" style="width:80px;height:80px;border-radius:50%;border:3px solid var(--ac)">
      <div>
        <h2 style="margin:0">${esc(user.name)}</h2>
        <p style="margin:4px 0;color:var(--mu);direction:ltr">${esc(user.phone)}</p>
        <span class="b ${user.isSupervisor?'y':'g'}">${user.isSupervisor?'مشرف':'طالب'}</span>
      </div>
    </div>
    <h3>سجل المشاهدة (${studentVideos.length} فيديو)</h3>
    <div class="tw"><table>
      <tr><th>الفيديو</th><th>الكود</th><th>آخر مشاهدة</th><th>الحالة</th></tr>
      ${studentVideos.map(v=>`<tr><td>${esc(v.title)}</td><td><span class="code">${v.code||'-'}</span></td><td>${fd(v.lastAt)}</td><td>${v.completed?'<span class="g">أكمل</span>':'<span class="y">لم يكمل</span>'}</td></tr>`).join('') || '<tr><td colspan="4" class="mut">لا يوجد سجل مشاهدة.</td></tr>'}

  </div>`;
}

  catch(e){console.error(e);toast('تعذر إضافة الملف: '+(e.code||e.message||'خطأ'))}
}

async function saveEditLib(id){const n=$('#eltn').value.trim(),d=$('#eltd').value.trim(),u=$('#eltu').value.trim(),f=$('#eltp').files[0];if(!n||!u)return toast('أكمل الحقول');const l=library[id];let photo=l.photo||'';if(f){photo=await img(f,200);if(!photo)return toast('تم إلغاء القص')}await update(R('library/'+id),{title:n,desc:d,url:u,photo});toast('تم التعديل');go('admin','','library')}

async function gen(vid,n,video=videos[vid]){
  const v=video||videos[vid];
  if(!v) throw new Error('الفيديو غير موجود لتوليد الأكواد');
  let ok=0, attempts=0;
  while(ok<n && attempts < n*10){
    const c=String(crypto.getRandomValues(new Uint32Array(1))[0]%900000+100000);
    try{
      const r=await runTransaction(R('codes/'+c),cur=>cur===null?{videoId:vid,url:v.url,title:v.title,used:false,createdAt:Date.now()}:undefined);
      if(r.committed) ok++;
    }catch(e){}
    attempts++;
  }
  return ok;
}

function exportPDF(vid){const v=videos[vid];if(!v)return;const rows=[];document.querySelectorAll('#pdf-src tbody tr').forEach(tr=>{const tds=tr.querySelectorAll('td');if(tds.length)rows.push([...tds].map(td=>td.innerText.trim()))});const headers=[...document.querySelectorAll('#pdf-src thead th')].map(th=>th.innerText.trim());const win=window.open('','_blank');win.document.write(`<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>${v.title}</title><style>body{font-family:Cairo,sans-serif;padding:24px;color:#0f172a}h2{color:#2563eb}table{width:100%;border-collapse:collapse;margin-top:14px;font-size:12px}th,td{border:1px solid #cbd5e1;padding:8px;text-align:right}th{background:#2563eb;color:#fff}@media print{button{display:none}}</style></head><body><h2>${v.title}</h2><p>${v.desc||''}</p><p>عدد السجلات: ${rows.length}</p><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table><br><button onclick="window.print()">طباعة / حفظ PDF</button><script>window.onload=()=>setTimeout(()=>window.print(),400)<\/script></body></html>`);win.document.close()}

td>${fd(l.lastAt)}</td><td>${Math.round((l.seconds||0)/60)} د</td><td>${st(l)}</td></tr>`).join('')||'<tr><td colspan="7" class="mut">لم يفتحه أحد بعد.</td></tr>'}</tbody></table></div><h2>الأكواد</h2><div class="box tw"><table><thead><tr><th>الكود</th><th>الحالة</th><th>استخدمه</th><th>الوقت</th><th></th></tr></thead><tbody>${cs.map(x=>`<tr><td><span class="code">${x.c}</span></td><td>${x.used?'<span class="b r">مستخدم</span>':'<span class="b g">متاح</span>'}</td><td>${esc(x.usedByName||'-')}</td><td>${fd(x.usedAt)}</td><td>${x.used?'':`<button class="s" style="padding:5px 12px" onclick="cp('${x.c}')">نسخ</button>`}</td></tr>`).join('')}</tbody></table></div>`}
