<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>منصة سيجما التعليمية</title>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" id="mf">
<link rel="apple-touch-icon" id="ai">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8fafc; --surface:#ffffff; --surface2:#f1f5f9;
  --tx:#0f172a; --tx2:#475569; --mu:#94a3b8;
  --ac:#2563eb; --ac2:#1d4ed8; --ac-soft:#dbeafe;
  --ok:#10b981; --er:#ef4444; --warn:#f59e0b;
  --bd:#e2e8f0; --r:16px; --r-sm:10px; --r-lg:22px;
  --shadow:0 1px 3px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.04);
  --shadow-lg:0 10px 40px rgba(15,23,42,.12);
}
html.dark{
  --bg:#0b1220; --surface:#111a2e; --surface2:#1a2440;
  --tx:#f1f5f9; --tx2:#cbd5e1; --mu:#64748b;
  --ac:#60a5fa; --ac2:#3b82f6; --ac-soft:#1e3a8a;
  --bd:#1e293b;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.3);
  --shadow-lg:0 10px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{min-height:100%;height:auto;-webkit-text-size-adjust:100%}
body{font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx);
  min-height:100vh;min-height:100dvh;
  padding-bottom:calc(120px + env(safe-area-inset-bottom));overflow-x:hidden;
  -webkit-user-select:none;user-select:none;transition:background .25s,color .25s}
input,select,textarea{-webkit-user-select:text;user-select:text}
h1,h2,h3{font-weight:800;line-height:1.3}
h2{font-size:20px;margin-bottom:16px;color:var(--tx)}
#loading-overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:9999;background:rgba(248,250,252,.85);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .3s ease}
html.dark #loading-overlay{background:rgba(11,18,32,.85)}
#loading-overlay.hide{opacity:0;pointer-events:none}
.spinner{width:40px;height:40px;border:4px solid var(--ac-soft);border-top-color:var(--ac);
  border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.top-bar{background:linear-gradient(135deg,var(--ac) 0%,var(--ac2) 100%);color:#fff;
  padding:24px 20px;border-bottom-left-radius:24px;border-bottom-right-radius:24px;
  margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-start;
  position:relative;box-shadow:var(--shadow)}
.top-bar .welcome h1{font-size:22px;margin-bottom:4px;font-weight:800}
.top-bar .welcome p{font-size:14px;opacity:.9;margin-bottom:12px}
.top-bar .user-area{display:flex;align-items:center;gap:8px}
.top-bar .avatar-lg{width:56px;height:56px;border-radius:50%;border:3px solid rgba(255,255,255,.4);
  object-fit:cover;cursor:pointer;background:#fff}
.top-bar .actions{display:flex;gap:8px;align-items:center}
.top-bar .action-btn{background:rgba(255,255,255,.2);color:#fff;border:0;padding:6px 12px;
  border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.15s}
.top-bar .action-btn:hover{background:rgba(255,255,255,.3)}
.top-bar .action-btn.icon-only{width:42px;height:42px;padding:0;border-radius:50%;position:relative;
  flex:0 0 42px;background:#fff;color:#0f172a;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.top-bar .action-btn.icon-only svg{width:22px;height:22px;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top-bar .action-btn.icon-only .badge-dot{position:absolute;top:-2px;right:-2px;
  min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:#ef4444;
  color:#fff;border:2px solid #fff;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;display:flex}
main{max-width:1000px;margin:0 auto;padding:0 20px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:0;
  cursor:pointer;text-align:center;transition:.2s;overflow:hidden;position:relative;
  display:flex;flex-direction:column}
.card:hover{border-color:var(--ac);box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.card:active{transform:scale(.98)}
.card .card-img-wrap{width:100%;height:160px;background:linear-gradient(135deg,#e0e7ff 0%,#f1f5f9 100%);position:relative}
.card .card-img-wrap img{width:100%;height:100%;object-fit:cover;background:var(--surface2)}
.card .card-body{padding:12px 10px;background:var(--surface);flex:1;
  display:flex;flex-direction:column;justify-content:center}
.card b{font-size:16px;display:block;color:var(--tx);font-weight:800}
.row{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);
  padding:16px 18px;margin-bottom:12px;display:flex;align-items:center;gap:12px;
  cursor:pointer;transition:.15s;flex-wrap:wrap}
.row:hover{border-color:var(--ac);box-shadow:var(--shadow-lg)}
.row:active{transform:scale(.995)}
.row>div{flex:1;min-width:0}
.row b{font-size:15px;display:block;color:var(--tx)}
.row small{color:var(--mu);font-size:13px;display:block;margin-top:2px}
button,.btn{font-family:inherit;font-weight:700;border:0;border-radius:var(--r-sm);
  padding:10px 18px;background:var(--ac);color:#fff;cursor:pointer;transition:.15s;font-size:14px;
  touch-action:manipulation}
button:hover{background:var(--ac2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.3)}
button:active{transform:translateY(0) scale(.97)}
button:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
button.s{background:var(--surface2);color:var(--tx)}
button.s:hover{background:var(--bd);box-shadow:none;transform:none}
button.d{background:var(--er)}button.d:hover{background:#dc2626}
button.g{background:var(--ok)}button.g:hover{background:#059669}
label{font-size:13px;color:var(--tx2);font-weight:700;display:block;margin-bottom:6px}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:12px 14px;
  border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--surface);color:var(--tx);
  margin-bottom:14px;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);
  box-shadow:0 0 0 3px var(--ac-soft)}
.box{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);
  padding:22px;margin-bottom:20px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px;text-align:right;border-bottom:1px solid var(--bd)}
th{background:var(--surface2);font-weight:700;color:var(--tx2);font-size:12px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r)}
.b{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;
  background:var(--surface2);color:var(--tx2);display:inline-block}
.b.g{background:#d1fae5;color:#065f46}
.b.r{background:#fee2e2;color:#991b1b}
.b.y{background:#fef3c7;color:#92400e}
html.dark .b.g{background:#064e3b;color:#6ee7b7}
html.dark .b.r{background:#7f1d1d;color:#fca5a5}
html.dark .b.y{background:#78350f;color:#fcd34d}
.g{color:var(--ok)}.r{color:var(--er)}.y{color:var(--warn)}
.code{font-family:'Courier New',monospace;font-size:15px;letter-spacing:2px;direction:ltr;
  display:inline-block;background:var(--surface2);padding:3px 10px;border-radius:6px;
  color:var(--ac2);font-weight:700}
.mut{color:var(--mu);text-align:center;padding:40px 20px}
.player-wrap{width:100%;margin-bottom:16px;background:transparent}
.pl{position:relative;background:#000;border-radius:var(--r);overflow:hidden;width:100%;
  height:0;padding-bottom:56.25%;margin:0 auto;box-shadow:var(--shadow-lg)}
@supports (aspect-ratio:16/9){
  .pl{height:auto;padding-bottom:0;aspect-ratio:16/9}
}
.pl iframe,.pl video{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;
  border:0;display:block;background:#000;pointer-events:none;object-fit:contain}
.pl.is-embed iframe{pointer-events:auto}
.pl.is-yt iframe {pointer-events: none !important;transform: scale(1.01) !important;}
.pl .video-blocker{position:absolute;top:0;right:0;bottom:0;left:0;z-index:99;background:transparent;
  cursor:pointer;display:block;touch-action:none;}
.pl .end-cover{position:absolute;top:0;right:0;bottom:0;left:0;z-index:100;background:#000;
  display:none;align-items:center;justify-content:center}
.pl .end-cover button{background:var(--ac);color:#fff;padding:12px 22px;font-size:15px}
.pl .big-play-overlay{position:absolute;top:0;right:0;bottom:0;left:0;z-index:101;display:none;
  align-items:center;justify-content:center;background:transparent;pointer-events:none;transition:opacity .1s}
.pl .big-play-btn{width:80px;height:80px;border-radius:50%;background:rgba(15,15,15,.7);border:2px solid #fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;
  transition:transform .2s;padding:0}
.pl .big-play-btn:hover{transform:scale(1.1);background:rgba(15,15,15,.9)}
.pl .big-play-btn svg{width:40px;height:40px;fill:#fff;margin-left:4px}
.wm{position:absolute;pointer-events:none;z-index:22;display:flex;align-items:center;gap:6px;
  font-size:12px;opacity:.45;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:99px;
  animation:mv 24s linear infinite alternate;direction:ltr;color:#fff;white-space:nowrap}
.wm img{width:22px;height:22px;border-radius:50%;object-fit:cover}
@keyframes mv{0%{top:20%;left:4%}25%{top:70%;left:55%}50%{top:35%;left:70%}75%{top:80%;left:8%}100%{top:20%;left:60%}}
.custom-player-ctrl{direction:ltr;background:#1e1e2f;padding:10px 14px;border-radius:6px;margin-top:8px;
  box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap}
.custom-player-ctrl .ctrl-left{display:flex;align-items:center;flex-shrink:0}
.custom-player-ctrl .ctrl-right{display:flex;align-items:center;flex-shrink:0}
.custom-player-ctrl .icon-btn{background:transparent;color:#fff;border:0;border-radius:0;padding:6px;margin:0 2px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:0;min-width:36px;min-height:36px;
  transition:transform .15s;touch-action:manipulation}
.custom-player-ctrl .icon-btn:hover{transform:scale(1.1);background:transparent;box-shadow:none}
.custom-player-ctrl .icon-btn svg{width:22px;height:22px;fill:#fff}
.custom-player-ctrl .time{font-family:Cairo,sans-serif;font-size:12px;font-weight:600;color:#fff;
  direction:ltr;margin:0 4px;white-space:nowrap;min-width:36px;text-align:center}
.custom-player-ctrl .time-sep{color:#fff;margin:0 2px}
.custom-player-ctrl .slider-wrap{position:relative;flex:1;height:4px;background:rgba(255,255,255,.3);
  border-radius:99px;margin:0 10px;min-width:80px;order:0}
.custom-player-ctrl .slider-fill{position:absolute;top:0;left:0;height:100%;width:0;background:#ff0000;
  border-radius:99px;pointer-events:none}
.custom-player-ctrl .slider-wrap input[type=range]{position:absolute;left:0;top:-9px;width:100%;height:22px;
  margin:0;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;outline:none;
  -webkit-appearance:none;appearance:none;cursor:pointer;z-index:2;touch-action:none}
.custom-player-ctrl .slider-wrap input[type=range]:focus{box-shadow:none;outline:none}
.custom-player-ctrl .slider-wrap input[type=range]::-webkit-slider-runnable-track{height:22px;background:transparent;border:0}
.custom-player-ctrl .slider-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:14px;height:14px;border-radius:50%;background:#ff0000;border:0;margin-top:4px;cursor:pointer}
.custom-player-ctrl .slider-wrap input[type=range]::-moz-range-track{height:22px;background:transparent;border:0}
.custom-player-ctrl .slider-wrap input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;
  background:#ff0000;border:0;cursor:pointer}
.player-wrap:fullscreen{background:#000;display:flex;flex-direction:column;justify-content:center;
  width:100%;height:100%;margin:0;padding:0}
.player-wrap:-webkit-full-screen{background:#000;display:flex;flex-direction:column;justify-content:center;
  width:100%;height:100%;margin:0;padding:0}
.player-wrap:fullscreen .pl,.player-wrap:-webkit-full-screen .pl{flex:1;min-height:0;height:auto;padding-bottom:0;
  aspect-ratio:auto;border-radius:0;box-shadow:none}
.player-wrap:fullscreen .custom-player-ctrl,.player-wrap:-webkit-full-screen .custom-player-ctrl{border-radius:0;margin-top:0}
@media (orientation: landscape) and (pointer: coarse) {
  body.is-watching .bottombar { display: none !important; }
  body.is-watching main { padding: 0 !important; }
  body.is-watching .player-wrap {
    position: fixed !important;
    top: 0 !important; right: 0 !important; bottom: 0 !important; left: 0 !important;
    width: 100vw !important; height: 100vh !important;
    z-index: 99999 !important;
    margin: 0 !important; padding: 0 !important;
    background: #000 !important;
    display: flex !important; flex-direction: column !important;
  }
  body.is-watching .pl {
    flex: 1 !important; min-height: 0 !important; height: auto !important; width: 100% !important;
    padding-bottom: 0 !important; aspect-ratio: auto !important; border-radius: 0 !important; box-shadow: none !important;
    margin: 0 !important;
  }
  body.is-watching .custom-player-ctrl {
    width: 100% !important; border-radius: 0 !important; margin-top: 0 !important;
    padding-bottom: env(safe-area-inset-bottom) !important;
  }
}
.bottombar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);
  border:1px solid var(--bd);border-bottom:0;border-radius:22px 22px 0 0;
  display:flex;justify-content:space-around;gap:4px;
  padding:8px 16px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -5px 24px rgba(0,0,0,.10)}
.bottombar button{background:transparent;color:var(--tx2);border:0;padding:10px 4px;
  border-radius:25px;font-size:11px;font-weight:700;cursor:pointer;transition:.15s;
  display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.bottombar button:hover{background:var(--surface2);color:var(--tx);box-shadow:none;transform:none}
.bottombar button.on{color:var(--ac);background:var(--ac-soft)}
.bottombar button.on svg{fill:var(--ac)}
.bottombar button svg{width:22px;height:22px;fill:var(--tx2);transition:.15s}
#t{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:var(--tx);color:var(--bg);padding:12px 22px;border-radius:var(--r);
  font-weight:700;display:none;z-index:300;box-shadow:var(--shadow-lg);
  max-width:90vw;text-align:center;font-size:14px}
#t.show{display:block;animation:pop .25s}
@keyframes pop{0%{transform:translateX(-50%) scale(.8);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
.profile-card{text-align:center;padding:30px 20px}
.profile-card img{width:100px;height:100px;border-radius:50%;border:4px solid var(--ac-soft);
  margin-bottom:16px;object-fit:cover;background:var(--surface2)}
.profile-card h2{margin-bottom:8px}
.profile-card p{color:var(--mu);font-size:15px;margin-bottom:24px}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:20px}
.settings-btn{background:var(--surface2);border:1px solid var(--bd);border-radius:var(--r);
  padding:16px 12px;text-align:center;cursor:pointer;transition:.2s;display:flex;
  flex-direction:column;align-items:center;gap:8px}
.settings-btn:hover{border-color:var(--ac);background:var(--ac-soft);transform:translateY(-2px)}
.settings-btn svg{width:28px;height:28px;fill:var(--ac)}
.settings-btn span{font-size:13px;font-weight:700;color:var(--tx)}
.modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.5);z-index:200;display:none;
  align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex;animation:pop .2s}
.modal-content{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:400px;
  max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-lg)}
.modal-header{padding:16px;border-bottom:1px solid var(--bd);display:flex;
  justify-content:space-between;align-items:center}
.modal-header h3{font-size:16px;margin:0}
.modal-body{padding:16px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.noti-item{display:flex;align-items:flex-start;gap:12px;padding:14px;margin-bottom:10px;
  background:var(--surface2);border:1px solid var(--bd);border-radius:14px;transition:.2s;position:relative}
.noti-item:hover{border-color:var(--ac);box-shadow:var(--shadow)}
.noti-item.unread{background:var(--ac-soft);border-color:var(--ac)}
html.dark .noti-item.unread{background:rgba(30,58,138,.35)}
.noti-icon{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));
  display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 10px rgba(37,99,235,.35)}
.noti-icon svg{width:22px;height:22px;fill:#fff}
.noti-content{flex:1;min-width:0}
.noti-text{font-size:14px;line-height:1.6;color:var(--tx);font-weight:600;margin-bottom:4px;word-break:break-word}
.noti-date{font-size:11px;color:var(--mu);font-weight:700;display:flex;align-items:center;gap:4px}
.noti-unread-dot{width:8px;height:8px;border-radius:50%;background:var(--er);display:inline-block;margin-right:4px}
.noti-actions{display:flex;gap:6px;flex-shrink:0}
.noti-actions button{padding:6px 10px;font-size:11px;border-radius:8px;
  background:var(--surface);border:1px solid var(--bd);color:var(--tx2);font-weight:700}
.noti-actions button:hover{background:var(--er);color:#fff;border-color:var(--er)}
.noti-empty{text-align:center;padding:50px 20px;color:var(--mu)}
.noti-empty svg{width:60px;height:60px;fill:var(--bd);margin-bottom:14px}
.stats-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.stat-box{background:linear-gradient(135deg,var(--surface),var(--surface2));
  border:1px solid var(--bd);border-radius:var(--r);padding:16px;text-align:center;transition:.2s}
.stat-box:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-box .stat-num{font-size:26px;font-weight:800;color:var(--ac);margin-bottom:4px}
.stat-box .stat-label{font-size:12px;color:var(--mu);font-weight:700}
.stat-box.ok .stat-num{color:var(--ok)}
.stat-box.warn .stat-num{color:var(--warn)}
.stats-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r);border:1px solid var(--bd)}
.stats-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface)}
.stats-table th{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;
  padding:12px 10px;font-size:12px;font-weight:800;text-align:right;white-space:nowrap}
.stats-table td{padding:12px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
.stats-table tr:last-child td{border-bottom:0}
.stats-table tr:hover td{background:var(--surface2)}
.stats-table .grade-chip{display:inline-block;padding:3px 8px;border-radius:8px;
  background:var(--ac-soft);color:var(--ac2);font-size:11px;font-weight:700;white-space:nowrap}
html.dark .stats-table .grade-chip{background:rgba(30,58,138,.5);color:#93c5fd}
.stats-filter{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.stats-filter button{padding:8px 16px;font-size:12px;border-radius:99px;
  background:var(--surface2);color:var(--tx2);border:1px solid var(--bd)}
.stats-filter button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.auth-container{max-width:400px;margin:0 auto;padding:40px 20px;text-align:center}
.auth-container h1{font-size:32px;color:var(--ac);margin-bottom:8px;font-weight:800;letter-spacing:-1px}
.auth-container p{color:var(--mu);margin-bottom:24px;font-size:15px}
.auth-btn{width:100%;padding:14px;font-size:16px;border-radius:12px;margin-bottom:12px;
  display:flex;align-items:center;justify-content:center;gap:10px}
.auth-btn.phone{background:var(--ac);color:#fff}
.auth-btn.phone:hover{background:var(--ac2)}
.auth-form{text-align:right}
.auth-form label{display:block;margin-bottom:6px;font-weight:700;font-size:13px;color:var(--tx2)}

function img(f,maxSize=800){
  return new Promise((resolve,reject)=>{
    if(!f)return resolve(null);
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('تعذر قراءة الصورة'));
    reader.onload=e=>{
      const im=new Image();
      im.onload=()=>{
        try{
          let w=im.width,h=im.height;
          if(w>maxSize||h>maxSize){
            const ratio=Math.min(maxSize/w,maxSize/h);
            w=Math.max(1,Math.round(w*ratio));
            h=Math.max(1,Math.round(h*ratio));
          }
          const c=document.createElement('canvas');
          c.width=w;c.height=h;
          const ctx=c.getContext('2d');
          ctx.drawImage(im,0,0,w,h);
          let data;
          try{data=c.toDataURL('image/jpeg',0.8)}catch(err){data=c.toDataURL('image/png')}
          if(!data||data==='data:,')return reject(new Error('تعذر معالجة الصورة'));
          resolve(data);
        }catch(err){reject(err)}
      };
      im.onerror=()=>reject(new Error('صيغة الصورة غير مدعومة'));
      im.src=e.target.result;
    };
    reader.readAsDataURL(f);
  });
}

function ytId(u){
  try{
    const url=new URL(u);
    const host=url.hostname.replace(/^(www\.|m\.)/,'');
    let id='';
    if(host==='youtu.be')id=url.pathname.slice(1).split('/')[0];
    else if(host==='youtube.com'||host==='youtube-nocookie.com'||host==='music.youtube.com'){
      if(url.pathname==='/watch')id=url.searchParams.get('v')||'';
      else{const m=url.pathname.match(/^\/(embed|shorts|live|v)\/([\w-]+)/);if(m)id=m[2]}
    }
    return /^[\w-]{11}$/.test(id)?id:'';
  }catch(e){return ''}
}
function embed(u,full){
  u=String(u||'').trim();
  if(!/^https?:\/\//i.test(u))return{t:'f',s:''};
  const yt=ytId(u);
  if(yt){
    const origin=location.origin&&location.origin.startsWith('http')?'&origin='+encodeURIComponent(location.origin):'';
    const base=full
      ?'rel=0&playsinline=1&modestbranding=1&enablejsapi=1&cc_load_policy=0'
      :'rel=0&playsinline=1&modestbranding=1&enablejsapi=1&controls=0&showinfo=0&iv_load_policy=3&fs=0&disablekb=1&cc_load_policy=0';
    return{t:'yt',id:yt,s:`https://www.youtube-nocookie.com/embed/${yt}?${base}${origin}`};
  }
  const dm=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:.*&)?id=)([\w-]+)/);
  if(dm)return{t:'drive',s:`https://drive.google.com/file/d/${dm[1]}/preview`,id:dm[1]};
  if(/\.(mp4|webm|ogg|m4v)(\?|#|$)/i.test(u))return{t:'v',s:u};
  return{t:'f',s:u};
}

  if(P.type==='native'){const d=P.el?P.el.duration:0;return Number.isFinite(d)?d:0}
  if(P.type==='yt'&&P.yt){try{return P.yt.getDuration()||0}catch(e){return 0}}
  return 0;
}
function pSeekTo(t){
  if(P.type==='native'&&P.el){P.el.currentTime=t}
  else if(P.type==='yt'&&P.yt){try{P.yt.seekTo(t,true)}catch(e){}}
}
function isMutedNow(){
  if(P.type==='native')return !!(P.el&&P.el.muted);
  if(P.type==='yt'&&P.yt){try{return P.yt.isMuted()}catch(e){return false}}
  return false;
}

function syncProgress(){
  if(P.seeking)return;
  const cur=pGetTime(),dur=pGetDur();
  setText('cTime',fmtTime(cur));
  setText('dTime',fmtTime(dur));
  const pct=dur>0?clamp(cur/dur*100,0,100):0;
  const seek=document.getElementById('cSeek');
  if(seek)seek.value=String(Math.round(pct*10));
  const fill=document.getElementById('seekFill');
  if(fill)fill.style.width=pct+'%';
}
function syncMute(){setMuteIcon(isMutedNow())}
function showEndCover(on){
  const c=document.getElementById('endCover');

function fmtTime(value){
  if(!Number.isFinite(value)||value<0)return '0:00';
  const n=Math.floor(value);
  const h=Math.floor(n/3600),m=Math.floor((n%3600)/60),s=n%60;
  const ss=String(s).padStart(2,'0');
  return h>0?`${h}:${String(m).padStart(2,'0')}:${ss}`:`${m}:${ss}`;
}
function fmtClock(sec){
  if(!Number.isFinite(sec)||sec<0)sec=0;
  const m=Math.floor(sec/60),s=Math.floor(sec%60);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function destroyPlayer(){
  if(P.ytTimer){clearInterval(P.ytTimer);P.ytTimer=null}
  if(P.yt){try{P.yt.destroy()}catch(e){}}
  P.yt=null;P.el=null;P.type=null;P.seeking=false;
  P.token++;
  pendingEmbed=null;
}

function initPlayer(){
  destroyPlayer();
  const pe=pendingEmbedSnapshot;
  if(!pe)return;
  const token=P.token;
  if(pe.type==='v')initNative(token);
  else if(pe.type==='yt')initYT(pe.id,token);
  else P.type='embed';
  bindSeek();
}

function initNative(token){
  const v=document.getElementById('vplayer');
  if(!v||token!==P.token)return;
  P.type='native';P.el=v;
  v.addEventListener('play',syncPlayUI);
  v.addEventListener('pause',syncPlayUI);
  v.addEventListener('ended',()=>{syncPlayUI();syncProgress()});
  v.addEventListener('timeupdate',syncProgress);
  v.addEventListener('loadedmetadata',syncProgress);
  v.addEventListener('durationchange',syncProgress);
  v.addEventListener('volumechange',syncMute);
  v.addEventListener('error',()=>toast('تعذر تشغيل الفيديو، تحقق من الرابط أو الاتصال'));
  syncPlayUI();syncProgress();syncMute();
}

function initYT(id,token){
  P.type='yt';
  const guard=setTimeout(()=>{if(token===P.token&&!P.yt)toast('تعذر تحميل مشغل يوتيوب، تحقق من الاتصال')},12000);
  loadYT(ok=>{
    clearTimeout(guard);
    if(token!==P.token)return;
    if(!ok){toast('تعذر تحميل مشغل يوتيوب');return}
    const iframe=document.getElementById('vplayer');
    if(!iframe)return;
    try{
      P.yt=new YT.Player('vplayer',{
        events:{
          onReady:()=>{
            if(token!==P.token)return;
            startYTTimer();
            syncPlayUI();syncMute();syncProgress();
          },
          onStateChange:e=>{
            if(token!==P.token)return;
            syncPlayUI();
            if(e.data===0)showEndCover(true);
            else if(e.data===1)showEndCover(false);
          }
        }
      });
    }catch(e){toast('تعذر تشغيل الفيديو')}
  });
}
function startYTTimer(){
  if(P.ytTimer)clearInterval(P.ytTimer);
  P.ytTimer=setInterval(()=>{
    if(!P.yt)return;
    syncPlayUI();syncProgress();syncMute();
  },250);
}

function bindSeek(){
  const s=document.getElementById('cSeek');
  if(!s||s._bound)return;
  s._bound=true;
  const start=()=>{P.seeking=true};
  s.addEventListener('pointerdown',start);
  s.addEventListener('touchstart',start,{passive:true});
  s.addEventListener('input',()=>{
    P.seeking=true;
    const dur=pGetDur();
    setText('cTime',fmtTime(dur*(s.value/1000)));
    const f=document.getElementById('seekFill');
    if(f)f.style.width=(s.value/10)+'%';
  });
  s.addEventListener('change',()=>{
    const dur=pGetDur();
    if(dur>0)pSeekTo(dur*(s.value/1000));
    P.seeking=false;
    syncProgress();
  });
  const endDrag=()=>setTimeout(()=>{P.seeking=false},300);
  s.addEventListener('pointerup',endDrag);
  s.addEventListener('touchend',endDrag);
  s.addEventListener('pointercancel',endDrag);
}

function togglePlay(){
  const isPlaying = pIsPlaying();
  const nextState = !isPlaying;
  const icon = document.getElementById('playIcon');
  if(icon) icon.innerHTML = ICON(nextState ? PAUSE_PATH : PLAY_PATH);
  const ov = document.getElementById('bigPlayOverlay');
  if(ov) ov.style.display = nextState ? 'none' : 'flex';
  if(P.type==='native'&&P.el){
    if(nextState) P.el.play().catch(()=>toast('تعذر التشغيل، اضغط مرة أخرى'));
    else P.el.pause();
    return;
  }
  if(P.type==='yt'&&P.yt){
    try{ nextState ? P.yt.playVideo() : P.yt.pauseVideo(); }catch(e){}
  }
}
function seekRel(sec){
  if(P.type==='native'&&P.el){
    const d=pGetDur();if(!d)return;
    P.el.currentTime=clamp(P.el.currentTime+sec,0,d);
  }else if(P.type==='yt'&&P.yt){
    try{
      const d=P.yt.getDuration()||0;
      P.yt.seekTo(clamp((P.yt.getCurrentTime()||0)+sec,0,d),true);
    }catch(e){}
  }
  syncProgress();
}
function toggleMute(){
  if(P.type==='native'&&P.el){P.el.muted=!P.el.muted}
  else if(P.type==='yt'&&P.yt){
    try{if(P.yt.isMuted())P.yt.unMute();else P.yt.mute()}catch(e){}
  }else return;
  syncMute();
}
function replayYT(){
  if(P.yt){try{P.yt.seekTo(0,true);P.yt.playVideo()}catch(e){}}
  showEndCover(false);
}

function isFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
function lockLandscape(){
  try{const o=screen.orientation;if(o&&o.lock)o.lock('landscape').catch(()=>{})}catch(e){}
}
function unlockOrientation(){
  try{const o=screen.orientation;if(o&&o.unlock)o.unlock()}catch(e){}
}
function toggleFullscreen(){
  if(isFS()){
    const f=document.exitFullscreen||document.webkitExitFullscreen;
    if(f){try{const p=f.call(document);if(p&&p.catch)p.catch(()=>{})}catch(e){}}
    unlockOrientation();
    return;
  }
  const wrap=document.getElementById('playerWrap');
  if(!wrap)return;
  const req=wrap.requestFullscreen||wrap.webkitRequestFullscreen||wrap.webkitRequestFullScreen||wrap.msRequestFullscreen;
  if(req){
    try{
      const p=req.call(wrap);
      if(p&&p.then)p.then(lockLandscape).catch(fallbackFS);
      else lockLandscape();
      return;
    }catch(e){}
  }
  fallbackFS();
}
function fallbackFS(){
  if(P.type==='native'&&P.el&&P.el.webkitEnterFullscreen){
    try{P.el.webkitEnterFullscreen();return}catch(e){}
  }
  toast('ملء الشاشة غير مدعوم هنا، أدر الهاتف للوضع الأفقي');
}
function onFsChange(){
  if(!isFS())unlockOrientation();
  setFsIcon(isFS());
}

  if(name.split(' ').filter(Boolean).length<4)return showErr('reg-error','يجب كتابة الاسم الرباعي كاملاً (4 مقاطع)');
  if(!/^01[0-9]{9}$/.test(phone))return showErr('reg-error','رقم الهاتف يجب أن يكون 11 رقم ويبدأ بـ 01');
  if(pass.length<6)return showErr('reg-error','كلمة المرور يجب أن تكون 6 أحرف على الأقل');
  if(pass!==pass2)return showErr('reg-error','كلمتا المرور غير متطابقتين');
  try{
    const fakeEmail=`${phone}@sigma.user`;
    const cred=await createUserWithEmailAndPassword(auth,fakeEmail,pass);
    await updateProfile(cred.user,{displayName:name});
    await set(R('users/'+cred.user.uid),{name,phone,email:fakeEmail,photo:'',createdAt:Date.now(),isSupervisor:false});
    toast('تم إنشاء الحساب بنجاح');
    setTimeout(()=>location.reload(),800);
  }catch(e){
    const m=authMsg(e);
    showErr('reg-error',m||'حدث خطأ غير متوقع');
  }
}
function loginPhone(){return once('login',doLogin)}
async function doLogin(){
  const phone=normPhone($('#login-phone')?.value||'');
  const pass=$('#login-pass')?.value||'';
  const err=$('#login-error');if(err)err.style.display='none';
  if(!/^01[0-9]{9}$/.test(phone))return showErr('login-error','رقم الهاتف غير صحيح');
  if(!pass)return showErr('login-error','اكتب كلمة المرور');
  const failKey=`login_fails_${phone}`,lockKey=`login_lock_${phone}`;
  const lockTime=parseInt(store.get(lockKey)||'0',10);
  if(lockTime){
    const remaining=Math.ceil((lockTime-Date.now())/60000);
    if(remaining>0)return showErr('login-error',`تم قفل الحساب مؤقتاً. يرجى المحاولة بعد ${remaining} دقيقة.`);
    store.del(lockKey);store.del(failKey);
  }
  try{
    await signInWithEmailAndPassword(auth,`${phone}@sigma.user`,pass);
    store.del(failKey);
    toast('تم تسجيل الدخول بنجاح');
  }catch(e){
    const m=authMsg(e);
    if(m!==null)return showErr('login-error',m);
    const fails=parseInt(store.get(failKey)||'0',10)+1;
    if(fails>=3){
      store.set(lockKey,String(Date.now()+15*60*1000));
      store.del(failKey);
      showErr('login-error','تم إدخال كلمة مرور خاطئة 3 مرات. الحساب مقفل لمدة 15 دقيقة.');
    }else{
      store.set(failKey,String(fails));
      showErr('login-error',`رقم الهاتف أو كلمة المرور غير صحيحة (المحاولة ${fails} من 3)`);
    }
  }
}

  const views={

    exams:vExams,exam:vExamDetail,takeExam:vTakeExam,examResult:vExamResult
  };

  let res;
  try{res=fn()}
  catch(e){a.innerHTML=shell(`<div class="mut">حدث خطأ: ${esc(e.message)}</div>`);afterRender();return}
  if(res&&typeof res.then==='function'){

    });
    return;
  }
  a.innerHTML=shell(res??'');afterRender();

async function buildStudentStats(){
  const myVids=mineVideos||{};
  const allLogs=(await G('logs'))||{};
  const mine={};
  for(const vid in allLogs){
    const rec=allLogs[vid]&&allLogs[vid][U.uid];
    if(rec)mine[vid]=rec;
  }
  const totalVideos=Object.keys(videos).length;
  const watchedCount=Object.keys(mine).length;
  const openedCount=Object.keys(myVids).length;
  const lockedCount=Math.max(0,totalVideos-openedCount);
  const rows=[];
  for(const [vid,v] of Object.entries(videos)){
    const teacher=teachers[v.teacherId];
    const log=mine[vid];
    const isOpen=A||IS_SUPERVISOR||!!myVids[vid];
    let status='';
    if(v.disabled&&!A&&!IS_SUPERVISOR)status='<span class="b r">موقوف</span>';
    else if(!isOpen)status='<span class="b y">يحتاج كود</span>';
    else if(log&&log.completed)status='<span class="b g">حضره كاملاً</span>';
    else if(log)status='<span class="b y">شاهد جزءاً</span>';
    else status='<span class="b g">مفتوح</span>';
    rows.push({
      vid,title:v.title||'-',teacher:teacher?.name||'-',grade:v.grade||'-',
      desc:v.desc||'',isOpen,status,log,watched:!!log,
      seconds:log?(log.seconds||0):0,disabled:!!v.disabled
    });
  }
  let filtered=rows;
  if(studentStatsFilter==='watched')filtered=rows.filter(r=>r.watched);
  else if(studentStatsFilter==='available')filtered=rows.filter(r=>r.isOpen&&!r.disabled);
  else if(studentStatsFilter==='locked')filtered=rows.filter(r=>!r.isOpen);
  filtered.sort((a,b)=>{
    const score=r=>r.watched?3:(r.isOpen?2:1);
    const d=score(b)-score(a);
    if(d)return d;
    return (b.log?.lastAt||0)-(a.log?.lastAt||0);
  });
  const summary=`
    <div class="stats-summary">
      <div class="stat-box"><div class="stat-num">${totalVideos}</div><div class="stat-label">إجمالي المحاضرات</div></div>
      <div class="stat-box ok"><div class="stat-num">${openedCount}</div><div class="stat-label">مفتوحة لك</div></div>
      <div class="stat-box warn"><div class="stat-num">${lockedCount}</div><div class="stat-label">تحتاج كود</div></div>
      <div class="stat-box"><div class="stat-num">${watchedCount}</div><div class="stat-label">حضرتها</div></div>
    </div>`;
  const filterBar=`
    <div class="stats-filter">
      <button class="${studentStatsFilter==='all'?'on':''}" onclick="setStatsFilter('all')">الكل</button>
      <button class="${studentStatsFilter==='watched'?'on':''}" onclick="setStatsFilter('watched')">حضرتها (${watchedCount})</button>
      <button class="${studentStatsFilter==='available'?'on':''}" onclick="setStatsFilter('available')">مفتوحة (${openedCount})</button>
      <button class="${studentStatsFilter==='locked'?'on':''}" onclick="setStatsFilter('locked')">مقفلة (${lockedCount})</button>
    </div>`;
  if(!filtered.length){
    return `<div class="box">
      <h2 style="color:var(--ac2);margin-bottom:14px">📊 إحصائياتي</h2>
      ${summary}${filterBar}
      <div class="mut" style="padding:30px">لا توجد محاضرات مطابقة.</div>
    </div>`;
  }
  const tableRows=filtered.map(r=>{
    const watchBtn=r.isOpen&&!r.disabled
      ?`<button class="s" style="padding:5px 10px;font-size:11px;border-radius:8px" onclick="go('watch','${esc(r.vid)}')">مشاهدة</button>`
      :(!r.disabled?`<button style="padding:5px 10px;font-size:11px;border-radius:8px" onclick="go('code','${esc(r.vid)}')">فتح بكود</button>`:'-');
    const mins=Math.round(r.seconds/60);
    return `<tr>

function filterTeacherVideos(q){
  const query=String(q||'').toLowerCase().trim();
  document.querySelectorAll('.teacher-video-row').forEach(row=>{
    const txt=(row.getAttribute('data-search')||'').toLowerCase();
    row.style.display=(!query||txt.includes(query))?'':'none';
  });
  document.querySelectorAll('.grade-section').forEach(h=>{
    let next=h.nextElementSibling;
    let hasVisible=false;
    while(next && !next.classList.contains('grade-section')){
      if(next.classList.contains('teacher-video-row') && next.style.display!=='none'){hasVisible=true;break}
      next=next.nextElementSibling;
    }
    h.style.display=hasVisible?'':'none';
  });
}

function redeem(vid){return once('redeem_'+vid,()=>doRedeem(vid))}
async function doRedeem(vid){
  const v=videos[vid];if(!v||v.disabled)return toast('الفيديو موقوف');
  const cd=$('#cd');if(!cd)return;
  const c=normDigits(cd.value).replace(/\D/g,'');
  if(!/^\d{6}$/.test(c))return toast('الكود يجب أن يكون 6 أرقام');
  try{
    const r=await runTransaction(R('codes/'+c),cur=>{
      if(cur===null)return cur;
      if(cur.videoId!==vid)return cur;
      if(cur.used&&cur.usedBy!==U.uid)return cur;
      if(!cur.used){
        cur.used=true;
        cur.usedBy=U.uid;
        cur.usedByName=U.displayName||'';
        cur.usedByEmail=U.email||'';
        cur.usedAt=Date.now();
      }
      return cur;
    });
    const vv=r.snapshot.val();
    if(!vv||vv.usedBy!==U.uid||vv.videoId!==vid)return toast('الكود غير صحيح أو مستخدم من قبل');
    await set(R(`users/${U.uid}/videos/${vid}`),c);
    mineVideos={...mineVideos,[vid]:c};
    go('watch',vid);
  }catch(e){toast('حدث خطأ أثناء التحقق من الكود')}
}

      </button>

function onQTypeChange(sel){
  const item=sel.closest('.q-builder-item');
  if(!item)return;
  const type=sel.value;
  item.querySelector('.q-options-box').style.display=type==='mcq'?'':'none';
  item.querySelector('.q-tf-box').style.display=type==='tf'?'':'none';
  item.querySelector('.q-short-box').style.display=type==='short'?'':'none';
}
function createExam(){return once('createExam',doCreateExam)}
async function doCreateExam(){
  if(!A&&!IS_SUPERVISOR)return toast('غير مصرح');
  const title=document.getElementById('exTitle')?.value.trim()||'';
  const grade=document.getElementById('exGrade')?.value||'';
  const duration=Math.min(180,Math.max(1,(+document.getElementById('exDuration')?.value)||30));
  if(!title)return toast('اكتب عنوان الامتحان');
  const questions=[];
  const items=document.querySelectorAll('.q-builder-item');
  if(!items.length)return toast('أضف سؤالاً واحداً على الأقل');
  if(items.length>100)return toast('الحد الأقصى 100 سؤال');
  for(const item of items){
    const type=item.querySelector('.q-type').value;
    const text=item.querySelector('.q-text').value.trim();
    if(!text)return toast('كل سؤال يحتاج نصاً');
    if(type==='mcq'){
      const opts=[...item.querySelectorAll('.q-opt')].map(i=>i.value.trim());
      if(opts.some(o=>!o))return toast('كل خيارات MCQ يجب أن تُملأ');
      const correct=item.querySelector('input[type=radio]:checked');
      if(!correct)return toast('حدد الإجابة الصحيحة لكل سؤال MCQ');
      questions.push({type:'mcq',text,options:opts,correct:parseInt(correct.value,10)});
    }else if(type==='tf'){
      const ans=item.querySelector('.q-tf-answer').value==='true';
      questions.push({type:'tf',text,correct:ans});
    }else{
      const ans=item.querySelector('.q-short-answer').value.trim();
      questions.push({type:'short',text,correct:ans});
    }
  }
  try{
    const id='ex'+Date.now();
    await set(R('exams/'+id),{
      title,grade,duration,questions,
      created:Date.now(),createdBy:U.displayName||'',createdByUid:U.uid,
      disabled:false
    });
    toast('تم إنشاء الامتحان بنجاح ✅');
    qBuildCounter=0;
    go('admin','','exams');
  }catch(e){toast('تعذر الحفظ: '+(e.code||e.message))}
}
async function toggleExamDisabled(id){
  const e=exams[id];if(!e)return;
  try{await update(R('exams/'+id),{disabled:!e.disabled});toast(e.disabled?'تم التفعيل':'تم الإيقاف');render()}
  catch(err){toast('تعذر التعديل')}

async function delExam(id){
  if(!confirm('حذف الامتحان وكل محاولاته؟'))return;

}

let activeExamTimer=null;
let activeExamState=null;

function vTakeExam(){
  const e=exams[S.id];
  if(!e)return vExams();
  const att=examAttempts[S.id];
  if(att)return vExamResult();
  cleanupExam();
  activeExamState={
    id:S.id,
    startedAt:Date.now(),
    violations:0,
    answers:{},
    submitted:false
  };
  const questions=e.questions||[];
  const preventCopy=ev=>{ev.preventDefault();return false};
  document.addEventListener('copy',preventCopy);
  document.addEventListener('cut',preventCopy);
  document.addEventListener('paste',preventCopy);
  document.addEventListener('contextmenu',preventCopy);
  const onVis=()=>{
    if(document.hidden && activeExamState && !activeExamState.submitted){
      activeExamState.violations++;
      toast('⚠️ تم تسجيل خروجك من التبويب — المخالفة رقم '+activeExamState.violations);
    }
  };
  document.addEventListener('visibilitychange',onVis);
  const startMs=Date.now();
  const totalMs=e.duration*60*1000;
  activeExamTimer=setInterval(()=>{
    if(!activeExamState||activeExamState.submitted){clearInterval(activeExamTimer);return}
    const left=totalMs-(Date.now()-startMs);
    const timerEl=document.getElementById('examTimer');
    if(timerEl){
      const big=timerEl.querySelector('.time-big');
      if(big)big.textContent=fmtClock(Math.max(0,left/1000));
      timerEl.classList.remove('warn','danger');
      if(left<=30000)timerEl.classList.add('danger');
      else if(left<=120000)timerEl.classList.add('warn');
    }
    if(left<=0){
      clearInterval(activeExamTimer);
      toast('⏰ انتهى وقت الامتحان — يتم التسليم تلقائياً');
      submitExam(true);
    }
  },250);

  const qHTML=questions.map((q,i)=>{
    const num=i+1;
    if(q.type==='mcq'){
      return `<div class="exam-q">
        <div class="q-text"><span class="q-num">${num}</span> ${esc(q.text)}</div>
        ${q.options.map((opt,idx)=>`
          <label class="exam-opt">
            <input type="radio" name="q_${i}" value="${idx}" onchange="recordAnswer(${i},${idx})">
            <span>${esc(opt)}</span>
          </label>`).join('')}
      </div>`;
    }
    if(q.type==='tf'){
      return `<div class="exam-q">
        <div class="q-text"><span class="q-num">${num}</span> ${esc(q.text)}</div>
        <label class="exam-opt">
          <input type="radio" name="q_${i}" value="true" onchange="recordAnswer(${i},true)">
          <span>✔️ صح</span>
        </label>
        <label class="exam-opt">
          <input type="radio" name="q_${i}" value="false" onchange="recordAnswer(${i},false)">
          <span>❌ خطأ</span>
        </label>
      </div>`;
    }
    return `<div class="exam-q">
      <div class="q-text"><span class="q-num">${num}</span> ${esc(q.text)}</div>
      <textarea placeholder="اكتب إجابتك هنا..." oninput="recordAnswer(${i},this.value)" rows="3"></textarea>
    </div>`;
  }).join('');

  return `<button class="s" onclick="confirmExitExam()" style="margin-bottom:16px">← خروج</button>
    <h2>${esc(e.title)}</h2>
    <div class="exam-timer" id="examTimer">
      <span>⏱ الوقت المتبقي</span>
      <span class="time-big">${fmtClock(e.duration*60)}</span>
    </div>
    <div class="exam-vio" style="display:none" id="examVioBox">⚠️ المخالفات: <span id="examVioCount">0</span></div>
    ${qHTML}
    <button onclick="submitExam(false)" style="width:100%;padding:16px;font-size:16px;margin-top:16px">📤 تسليم الامتحان</button>
  `;
}

function recordAnswer(i,val){
  if(!activeExamState)return;
  activeExamState.answers[i]=val;
  const box=document.getElementById('examVioBox');
  const cnt=document.getElementById('examVioCount');
  if(activeExamState.violations>0 && box && cnt){
    box.style.display='block';
    cnt.textContent=String(activeExamState.violations);
  }
  document.querySelectorAll(`input[name="q_${i}"]`).forEach(inp=>{
    const opt=inp.closest('.exam-opt');
    if(opt)opt.classList.toggle('selected',inp.checked);
  });
}

function confirmExitExam(){
  if(!activeExamState)return go('exams');
  if(!confirm('هل تريد الخروج من الامتحان؟ سيتم اعتبار محاولتك ملغاة.'))return;
  cleanupExam();
  go('exams');
}
function cleanupExam(){
  if(activeExamTimer){clearInterval(activeExamTimer);activeExamTimer=null}
  if(activeExamState){
    const st=activeExamState;
    activeExamState=null;
    if(st._cleanup){try{st._cleanup()}catch(e){}}
  }
}

function submitExam(force){
  const st=activeExamState;
  if(!st||st.submitted)return;
  if(!force && !confirm('هل أنت متأكد من تسليم الامتحان؟ لا يمكنك التعديل بعدها.'))return;
  st.submitted=true;
  const e=exams[st.id];
  if(!e){cleanupExam();return}
  const questions=e.questions||[];
  let correct=0;
  const answers=[];
  questions.forEach((q,i)=>{
    const ans=st.answers[i];
    let isCorrect=false;
    if(q.type==='mcq')isCorrect=(ans===q.correct);
    else if(q.type==='tf')isCorrect=(ans===q.correct);
    else isCorrect=(String(ans||'').trim().toLowerCase()===String(q.correct||'').trim().toLowerCase() && !!q.correct);
    if(isCorrect)correct++;
    answers.push({q:i,ans:ans??null,correct:isCorrect});
  });
  const score=questions.length?Math.round(correct/questions.length*100):0;
  const timeTaken=Math.round((Date.now()-st.startedAt)/1000);
  const attempt={
    studentUid:U.uid,
    studentName:U.displayName||'',
    score, answers, timeTaken,
    violations:st.violations,
    submittedAt:Date.now(),
    autoSubmit:!!force
  };
  const examId=st.id;
  try{
    update(R('exams/'+examId+'/attempts/'+U.uid),attempt).catch(()=>{});
    set(R('examAttempts/'+U.uid+'/'+examId),attempt).catch(()=>{});
  }catch(err){}
  cleanupExam();
  go('examResult',examId);
}

async function vExamResult(){
  const e=exams[S.id];if(!e)return vExams();
  const att=examAttempts[S.id]||{};
  const score=att.score||0;

async function gen(vid,n,video){
  const v=video||videos[vid];
  if(!v)throw new Error('الفيديو غير موجود لتوليد الأكواد');
  let ok=0,attempts=0;
  const maxAttempts=n*10;
  while(ok<n&&attempts<maxAttempts){
    const c=String(crypto.getRandomValues(new Uint32Array(1))[0]%900000+100000);
    try{
      const r=await runTransaction(R('codes/'+c),cur=>{
        if(cur!==null)return cur;
        return{videoId:vid,url:v.url,title:v.title||'',used:false,createdAt:Date.now()};
      });
      if(r.committed)ok++;
    }catch(e){}
    attempts++;
  }
  return ok;
}

async function toggleVid(id){

const cp=async t=>{
  try{
    if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t)}
    else{
      const el=document.createElement('textarea');el.value=t;el.setAttribute('readonly','');
      el.style.position='fixed';el.style.top='0';el.style.opacity='0';
      document.body.appendChild(el);el.select();el.setSelectionRange(0,t.length);
      const ok=document.execCommand('copy');el.remove();
      if(!ok)throw new Error('تعذر النسخ');
    }
    toast('تم النسخ');
  }catch(e){toast('تعذر النسخ تلقائياً؛ حاول تحديد النص ونسخه')}
};
async function copyFree(id){
  try{
    const s=await get(query(R('codes'),orderByChild('videoId'),equalTo(id)));
    const a=[];
    s.forEach(c=>{if(!c.val().used)a.push(c.key)});
    if(!a.length)return toast('لا توجد أكواد متاحة');
    const v = videos[id];
    const teacher = teachers[v?.teacherId]?.name || '-';
    const title = v?.title || '-';
    let text = `📌 *بيانات الفيديو*\n`;
    text += `📚 العنوان: ${title}\n`;
    text += `👨‍🏫 المدرس: ${teacher}\n`;
    text += `📅 الصف: ${v?.grade || '-'}\n`;
    text += `---------------------------\n`;
    text += `🔑 *الأكواد المتاحة (${a.length})*:\n`;
    text += a.join('\n');
    cp(text);
  }catch(e){toast('تعذر جلب الأكواد')}
}
function exportPDF(vid){

  const rows=[];

    const tds=tr.querySelectorAll('td');
    if(tds.length)rows.push([...tds].map(td=>td.innerText.trim()));

  const win=window.open('','_blank');
  if(!win)return toast('اسمح بالنوافذ المنبثقة لتصدير الملف');
  win.document.write(`<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>${esc(v.title)}</title><style>body{font-family:Cairo,sans-serif,Tahoma;padding:24px}h2{color:#2563eb}table{width:100%;border-collapse:collapse;margin-top:14px;font-size:12px}th,td{border:1px solid #cbd5e1;padding:8px;text-align:right}th{background:#2563eb;color:#fff}@media print{button{display:none}}</style></head><body><h2>${esc(v.title)}</h2><p>${esc(v.desc||'')}</p><p>عدد السجلات: ${rows.length}</p><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table><br><button onclick="window.print()">طباعة / حفظ PDF</button></body></html>`);
  win.document.close();
  setTimeout(()=>{try{win.focus();win.print()}catch(e){}},600);
}

async function vVid(){
  const id=S.id,v=videos[id];if(!v)return vAdmin();
  const cs=[];
  const snap=await get(query(R('codes'),orderByChild('videoId'),equalTo(id)));
  snap.forEach(c=>{cs.push({c:c.key,...c.val()})});
  cs.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const lg=Object.values((await G('logs/'+id))||{}).sort((a,b)=>(b.lastAt||0)-(a.lastAt||0));
  const st=l=>l.completed?'<span class="g">حضره كاملاً</span>':l.seconds>20?'<span class="y">شاهد جزءًا</span>':'<span>فتح فقط</span>';

  const avgSeconds=totalViews?Math.round(lg.reduce((s,x)=>s+(x.seconds||0),0)/totalViews):0;
  return`<button class="s" onclick="go('admin','','videos')">← رجوع</button><h2 style="margin-top:14px">${esc(v.title)} ${v.disabled?'<span class="b r">موقوف</span>':''}</h2>

    <div class="stat-box"><div class="stat-num">${totalViews}</div><div class="stat-label">فتحوه</div></div>
    <div class="stat-box ok"><div class="stat-num">${completionRate}%</div><div class="stat-label">نسبة الإكمال</div></div>
    <div class="stat-box warn"><div class="stat-num">${Math.round(avgSeconds/60)} د</div><div class="stat-label">متوسط المشاهدة</div></div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
    <div style="width:110px"><label for="gn">العدد</label><input id="gn" type="number" min="1" max="500" value="10" style="margin-bottom:0"></div>
    <button onclick="moreCodes('${esc(id)}')">توليد أكواد</button>
    <button class="s" onclick="moreCodes('${esc(id)}',1)">كود لطالب</button>
    <button class="s" onclick="copyFree('${esc(id)}')">نسخ المتاح</button>
    <button class="s" onclick="exportCodesPDF('${esc(id)}')">تصدير الأكواد PDF</button>
    <button class="s" onclick="go('edit','${esc(id)}','video')">تعديل</button>
    <button class="${v.disabled?'g':'d'}" onclick="toggleVid('${esc(id)}')">${v.disabled?'تفعيل':'إيقاف'}</button>
    <button class="s" onclick="exportPDF('${esc(id)}')">تصدير سجل الطلاب PDF</button>
    <button class="d" onclick="delV('${esc(id)}')">حذف</button>
  </div></div>
  <h2>سجل الطلاب</h2><div class="box tw"><table id="pdf-src"><thead><tr><th>الطالب</th><th>الهاتف</th><th>الكود المستخدم</th><th>أول فتح</th><th>آخر نشاط</th><th>المشاهدة</th><th>الحالة</th></tr></thead><tbody>${lg.map(l=>`<tr><td>${esc(l.name)}</td><td>${esc(l.email)}</td><td>${esc(l.code||'-')}</td><td>${fd(l.openedAt)}</td><td>${fd(l.lastAt)}</td><td>${Math.round((l.seconds||0)/60)} د</td><td>${st(l)}</td></tr>`).join('')||'<tr><td colspan="7" class="mut">لم يفتحه أحد بعد.</td></tr>'}</tbody></table></div>
