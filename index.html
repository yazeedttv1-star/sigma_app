<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سيجما</title>
<meta name="theme-color" content="#3b82f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" id="mf">
<link rel="apple-touch-icon" id="ai">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8fafc; --surface:#ffffff; --surface2:#f1f5f9;
  --tx:#0f172a; --tx2:#475569; --mu:#94a3b8;
  --ac:#3b82f6; --ac2:#2563eb; --ac-soft:#dbeafe;
  --ok:#10b981; --er:#ef4444; --warn:#f59e0b;
  --bd:#e2e8f0; --r:16px; --r-sm:10px; --r-lg:22px;
  --shadow:0 1px 3px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.04);
  --shadow-lg:0 10px 40px rgba(15,23,42,.12);
}
html.dark{
  --bg:#0b1220; --surface:#111a2e; --surface2:#1a2440;
  --tx:#f1f5f9; --tx2:#cbd5e1; --mu:#64748b;
  --ac:#60a5fa; --ac2:#3b82f6; --ac-soft:#1e3a8a;
  --bd:#1e293b;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.3);
  --shadow-lg:0 10px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));overflow-x:hidden;
  -webkit-user-select:none;user-select:none;transition:background .25s,color .25s}
input,select,textarea{-webkit-user-select:text;user-select:text}
h1,h2,h3{font-weight:800;line-height:1.3}
h2{font-size:20px;margin-bottom:16px;color:var(--tx)}
h3{font-size:16px;margin-bottom:10px}

header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);
  padding:calc(12px + env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;gap:12px}
html.dark header{background:rgba(17,26,46,.85)}
.logo{font-weight:800;font-size:22px;color:var(--ac);cursor:pointer;margin-inline-end:auto;
  display:flex;align-items:center;gap:8px;letter-spacing:-.5px}
.logo:before{content:'';width:8px;height:22px;background:var(--ac);border-radius:4px}
.chip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2);font-weight:600}
.chip img,.avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--surface2);border:2px solid var(--ac-soft)}
.header-btn{background:var(--surface2);color:var(--tx);border:0;border-radius:var(--r-sm);
  padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.header-btn:hover{background:var(--ac);color:#fff}

main{max-width:1000px;margin:0 auto;padding:24px 20px 40px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);
  padding:20px 16px;cursor:pointer;text-align:center;transition:.2s var(--shadow)}
.card:hover{border-color:var(--ac);box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.card:active{transform:scale(.98)}
.card .ph{width:88px;height:88px;border-radius:50%;object-fit:cover;margin:0 auto 12px;
  display:block;background:var(--surface2);border:3px solid var(--ac-soft)}
.card b{font-size:15px;display:block;color:var(--tx)}

.row{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);
  padding:16px 18px;margin-bottom:12px;display:flex;align-items:center;gap:12px;
  cursor:pointer;transition:.15s var(--shadow)}
.row:hover{border-color:var(--ac);box-shadow:var(--shadow-lg)}
.row:active{transform:scale(.995)}
.row>div{flex:1;min-width:0}
.row b{font-size:15px;display:block;color:var(--tx)}
.row small{color:var(--mu);font-size:13px;display:block;margin-top:2px}

button,.btn{font-family:inherit;font-weight:600;border:0;border-radius:var(--r-sm);
  padding:10px 18px;background:var(--ac);color:#fff;cursor:pointer;transition:.15s;font-size:14px}
button:hover{background:var(--ac2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(59,130,246,.3)}
button:active{transform:translateY(0) scale(.97)}
button.s{background:var(--surface2);color:var(--tx)}
button.s:hover{background:var(--bd);box-shadow:none;transform:none}
button.d{background:var(--er)}button.d:hover{background:#dc2626;box-shadow:0 4px 12px rgba(239,68,68,.3)}
button.g{background:var(--ok)}button.g:hover{background:#059669;box-shadow:0 4px 12px rgba(16,185,129,.3)}
button.w{background:var(--warn);color:#fff}button.w:hover{background:#d97706}

label{font-size:13px;color:var(--tx2);font-weight:600;display:block;margin-bottom:6px}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:11px 14px;
  border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--surface);color:var(--tx);
  margin-bottom:14px;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}

.box{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);
  padding:22px;margin-bottom:20px;box-shadow:var(--shadow)}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tabs button{background:var(--surface2);color:var(--tx2);padding:9px 18px;font-size:14px}
.tabs button.on{background:var(--ac);color:#fff}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px;text-align:right;border-bottom:1px solid var(--bd)}
th{background:var(--surface2);font-weight:700;color:var(--tx2);font-size:12px;text-transform:uppercase;letter-spacing:.3px}
tr:hover td{background:var(--surface2)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r)}

.b{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--tx2)}
.b.g{background:#d1fae5;color:#065f46}
.b.r{background:#fee2e2;color:#991b1b}
.b.y{background:#fef3c7;color:#92400e}
html.dark .b.g{background:#064e3b;color:#6ee7b7}
html.dark .b.r{background:#7f1d1d;color:#fca5a5}
html.dark .b.y{background:#78350f;color:#fcd34d}
.g{color:var(--ok)}.r{color:var(--er)}.y{color:var(--warn)}

.code{font-family:'Courier New',monospace;font-size:15px;letter-spacing:2px;direction:ltr;
  display:inline-block;background:var(--surface2);padding:3px 10px;border-radius:6px;color:var(--ac2);font-weight:700}

.center{text-align:center;padding:15vh 20px 0}
.center h1{font-size:clamp(40px,10vw,64px);color:var(--ac);margin-bottom:12px;letter-spacing:-2px}
.center p{color:var(--mu);margin-bottom:32px;font-size:15px}
.center button{padding:14px 32px;font-size:16px;border-radius:var(--r)}
.mut{color:var(--mu);text-align:center;padding:40px 20px}

.player-wrap{width:100%;margin-bottom:16px}
.pl{position:relative;background:#000;border-radius:var(--r);overflow:hidden;
  width:100%;aspect-ratio:16/9;max-height:80vh;margin:0 auto;box-shadow:var(--shadow-lg)}
.pl iframe,.pl video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
.pl.bl iframe,.pl.bl video{filter:blur(30px)}
.pl:fullscreen,.pl:-webkit-full-screen{aspect-ratio:auto;max-height:100vh;border-radius:0;
  display:flex;align-items:center;justify-content:center;background:#000}
.pl:fullscreen iframe,.pl:fullscreen video,.pl:-webkit-full-screen iframe,.pl:-webkit-full-screen video{
  position:relative;inset:auto;width:100%;height:100%;object-fit:contain}
.wm{position:absolute;pointer-events:none;z-index:3;display:flex;align-items:center;gap:6px;font-size:12px;
  opacity:.55;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px;
  animation:mv 24s linear infinite alternate;direction:ltr;color:#fff}
.wm img{width:22px;height:22px;border-radius:50%}
@keyframes mv{0%{top:6%;left:4%}25%{top:70%;left:55%}50%{top:35%;left:70%}75%{top:80%;left:8%}100%{top:12%;left:60%}}
.blk{position:absolute;top:0;right:0;width:64px;height:64px;z-index:4}

/* Video toolbar */
.vtoolbar{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);
  padding:12px;margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:var(--shadow)}
.vtoolbar .grp{display:flex;align-items:center;gap:6px;background:var(--surface2);
  border-radius:var(--r-sm);padding:4px 8px}
.vtoolbar .grp span.lbl{font-size:12px;color:var(--tx2);padding-inline:4px;font-weight:600}
.vtoolbar button{padding:7px 12px;font-size:13px}
.vtoolbar button.ic{min-width:36px;display:inline-flex;align-items:center;justify-content:center}
.vtoolbar .time{font-family:monospace;font-size:13px;background:var(--surface);border:1px solid var(--bd);
  border-radius:8px;padding:6px 10px;color:var(--tx);direction:ltr;min-width:66px;text-align:center;font-weight:700}
.vtoolbar select{padding:7px 10px;margin:0;width:auto;font-size:13px}
.vtoolbar .spacer{flex:1}
.vtoolbar .note{width:100%;font-size:12px;color:var(--mu);text-align:center;margin-top:4px;line-height:1.6}

.bottombar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);
  border-top:1px solid var(--bd);display:flex;justify-content:center;gap:6px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.06)}
.bottombar button{background:transparent;color:var(--tx2);display:flex;align-items:center;justify-content:center;
  gap:6px;padding:10px 18px;border-radius:var(--r-sm);font-size:13px;font-weight:700;
  flex:0 1 auto;max-width:140px;white-space:nowrap}
.bottombar button:hover{background:var(--surface2);color:var(--tx);transform:none;box-shadow:none}
.bottombar button.on{background:var(--ac-soft);color:var(--ac2);transform:none;box-shadow:none}
html.dark .bottombar button.on{background:var(--ac);color:#fff}

#t{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:var(--tx);color:var(--bg);padding:12px 22px;border-radius:var(--r);
  font-weight:700;display:none;z-index:100;box-shadow:var(--shadow-lg);max-width:90vw;text-align:center;font-size:14px}
#t.show{display:block;animation:pop .25s}
@keyframes pop{0%{transform:translateX(-50%) scale(.8);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}

@media(max-width:720px){
  header{padding:10px 14px calc(10px + env(safe-area-inset-top)) 14px}
  header .logo{font-size:19px}
  .header-btn{padding:7px 11px;font-size:12px}
  main{padding:18px 14px 30px}
  .vtoolbar{padding:10px;gap:8px}
  .vtoolbar button{padding:6px 10px;font-size:12px}
  h2{font-size:18px}
}
@media(max-width:520px){
  header .chip span{display:none}
  .pl{max-height:60vh}
  .vtoolbar .grp span.lbl{display:none}
  .bottombar button{padding:8px 12px;font-size:12px}
  .center h1{font-size:44px}
}
@media(max-width:380px){
  .bottombar button{padding:7px 8px;font-size:11px;gap:4px}
  h2{font-size:17px}
}
@media print{body{display:none}}

.ban-screen{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;
  justify-content:center;padding:20px;text-align:center}
.ban-screen .box-max{max-width:420px}
.ban-screen h1{font-size:28px;color:var(--er);margin-bottom:14px}
.ban-screen p{color:var(--tx2);margin-bottom:24px;line-height:1.7}
</style>
</head>
<body>
<div id="app"></div><div id="t"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut,setPersistence,browserLocalPersistence} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase,ref,get,set,update,remove,runTransaction,query,orderByChild,equalTo,onValue} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const ADMIN_EMAILS=["yazeedttv1@gmail.com"];
const app=initializeApp({apiKey:"AIzaSyCoHGEyhlsjmB_diUNm-R8SXB0Gm0kXw0A",authDomain:"sigma-6f162.firebaseapp.com",databaseURL:"https://sigma-6f162-default-rtdb.firebaseio.com",projectId:"sigma-6f162",storageBucket:"sigma-6f162.firebasestorage.app",messagingSenderId:"420365348074",appId:"1:420365348074:web:0aaecb71ec613bb32abb93"});
const auth=getAuth(app),db=getDatabase(app);
setPersistence(auth,browserLocalPersistence).catch(()=>{});

const R=p=>ref(db,p),G=async p=>(await get(R(p))).val();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=t=>t?new Date(t).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'}):'-';

let U=null,A=false,S={v:'home'},teachers={},videos={},badge='',hb=null,ip=null;
let banned=null,unsubBan=null;
let drivePlayer=null; // كائن مشغل درايف
const DEVICE_KEY='sigma-device-id';
function getDeviceId(){
  let id=localStorage.getItem(DEVICE_KEY);
  if(!id){id='d'+Date.now()+Math.random().toString(36).slice(2,8);localStorage.setItem(DEVICE_KEY,id)}
  return id;
}
function deviceLabel(){
  const ua=navigator.userAgent;
  if(/android/i.test(ua))return'Android';
  if(/iPhone|iPad|iPod/i.test(ua))return'iOS';
  if(/Windows/i.test(ua))return'Windows';
  if(/Mac/i.test(ua))return'Mac';
  if(/Linux/i.test(ua))return'Linux';
  return'جهاز';
}

const THEME_KEY='sigma-theme';
function initTheme(){
  const saved=localStorage.getItem(THEME_KEY);
  const prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  if(saved==='dark'||(!saved&&prefersDark))document.documentElement.classList.add('dark');
}
function toggleTheme(){
  document.documentElement.classList.toggle('dark');
  localStorage.setItem(THEME_KEY,document.documentElement.classList.contains('dark')?'dark':'light');
  render();
}
initTheme();

function toast(m){const t=$('#t');t.textContent=m;t.classList.add('show');clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove('show'),2400)}
const img=(f,s)=>new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=s;const m=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,s,s);r(c.toDataURL('image/jpeg',.8))};i.src=URL.createObjectURL(f)});

(()=>{const c=document.createElement('canvas');c.width=c.height=192;const x=c.getContext('2d');
const g=x.createLinearGradient(0,0,192,192);g.addColorStop(0,'#3b82f6');g.addColorStop(1,'#2563eb');
x.fillStyle=g;x.fillRect(0,0,192,192);x.fillStyle='#fff';x.font='bold 120px sans-serif';
x.textAlign='center';x.textBaseline='middle';x.fillText('Σ',96,104);
const u=c.toDataURL();$('#ai').href=u;
const m={name:'سيجما',short_name:'سيجما',start_url:location.pathname,display:'standalone',
  background_color:'#f8fafc',theme_color:'#3b82f6',dir:'rtl',lang:'ar',
  icons:[{src:u,sizes:'192x192',type:'image/png'}]};
$('#mf').href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}))})();
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;render()});

addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
 if(e.key==='PrintScreen'){navigator.clipboard?.writeText('');toast('التصوير ممنوع');e.preventDefault()}
 if(e.key==='F12'||(e.ctrlKey||e.metaKey)&&['s','p','u'].includes(k)||(e.ctrlKey||e.metaKey)&&e.shiftKey&&['i','j','c','s'].includes(k))e.preventDefault()});
document.addEventListener('visibilitychange',()=>$('.pl')?.classList.toggle('bl',document.hidden));
addEventListener('dragstart',e=>e.preventDefault());

/* ===== embed ===== */
function embed(u){u=u.trim();let m;
 if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([\w-]{11})/))return{t:'f',s:`https://www.youtube-nocookie.com/embed/${m[1]}?rel=0&modestbranding=1&playsinline=1&enablejsapi=1`,yt:m[1]};
 if(m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?.*?id=)([\w-]+)/))return{t:'drive',s:`https://drive.google.com/file/d/${m[1]}/preview`,id:m[1]};
 if(/facebook\.com|fb\.watch/.test(u))return{t:'f',s:`https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(u)}&show_text=false`};
 if(m=u.match(/tiktok\.com\/.*video\/(\d+)/))return{t:'f',s:`https://www.tiktok.com/embed/v2/${m[1]}`};
 if(/\.(mp4|webm|ogg)(\?|$)/i.test(u))return{t:'v',s:u};
 return{t:'f',s:u}}

/* ===== Single-Device (المدير مستثنى) ===== */
async function enforceSingleDevice(){
  const devId=getDeviceId();
  const sessionsRef=R('sessions/'+U.uid);
  const cur=(await get(sessionsRef)).val()||{};
  const now=Date.now();
  const existingDevice=cur.deviceId;
  const existingTs=cur.updatedAt||0;
  if(existingDevice&&existingDevice!==devId&&now-existingTs<10*60*1000){
    await set(R('bans/'+U.uid),{
      uid:U.uid,name:U.displayName||'',email:U.email||'',
      photo:U.photoURL||'',
      oldDevice:existingDevice,oldDeviceLabel:cur.deviceLabel||'',
      newDevice:devId,newDeviceLabel:deviceLabel(),
      bannedAt:now,reason:'تسجيل دخول من جهاز آخر'
    });
    return false;
  }
  await set(sessionsRef,{deviceId:devId,deviceLabel:deviceLabel(),updatedAt:now,
    name:U.displayName||'',email:U.email||''});
  const ban=(await G('bans/'+U.uid));
  if(ban&&ban.newDevice===devId){await remove(R('bans/'+U.uid))}
  return true;
}
async function checkBan(){return await G('bans/'+U.uid)}
function renderBanned(ban){
  document.body.innerHTML=`<div class="ban-screen"><div class="box-max">
    <h1>⛔ تم حظر حسابك</h1>
    <p>تم اكتشاف تسجيل دخول من جهاز آخر.<br>
    حسابك مسجّل على: <b>${esc(ban.oldDeviceLabel||'جهاز سابق')}</b><br>
    حاول الدخول من: <b>${esc(ban.newDeviceLabel||'جهاز جديد')}</b><br><br>
    تواصل مع المدير لفك الحظر.</p>
    <p style="font-size:12px;color:var(--mu)">الإيميل: ${esc(ban.email||'')}</p>
    <button onclick="signOut(auth).then(()=>location.reload())">خروج</button>
  </div></div>`;
}

/* ===== Auth ===== */
onAuthStateChanged(auth,async u=>{
  if(unsubBan){unsubBan();unsubBan=null}
  U=u;A=!!u&&ADMIN_EMAILS.includes((u.email||'').toLowerCase());
  if(u){
    try{
      if(!A){
        const ban=await checkBan();
        if(ban){
          banned=ban;renderBanned(ban);
          unsubBan=onValue(R('bans/'+U.uid),snap=>{
            if(!snap.val()){banned=null;location.reload()}
          });
          return;
        }
        const ok=await enforceSingleDevice();
        if(!ok){
          const b=await checkBan();
          if(b){banned=b;renderBanned(b);return}
        }
      }
      teachers=await G('teachers')||{};
      videos=await G('videos')||{};
      badge=await G('settings/badge')||'';
    }catch(e){console.error(e)}
  }else{teachers={};videos={};badge=''}
  if(!u&&S.v!=='home')S={v:'home'};
  if(!banned)render();
});

const login=async()=>{try{
  const provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});
  await signInWithPopup(auth,provider);
}catch(e){
  if(e.code==='auth/popup-blocked')toast('المتصفح منع النافذة');
  else if(e.code==='auth/unauthorized-domain')toast('النطاق غير مصرح به');
  else if(e.code==='auth/operation-not-allowed')toast('فعّل تسجيل الدخول بجوجل');
  else toast('تعذر تسجيل الدخول: '+e.code)}};

const go=(v,id,tab)=>{stopHB();destroyDrivePlayer();S={v,id,tab:tab!==undefined?tab:S.tab};window.scrollTo({top:0,behavior:'auto'});render()};
const inst=async()=>{ip.prompt();await ip.userChoice;ip=null;render()};
const out=()=>{stopHB();destroyDrivePlayer();if(unsubBan)unsubBan();signOut(auth)};

function render(){
  const a=$('#app');
  if(!U){a.innerHTML=`<div class="center"><h1>Σ سيجما</h1><p>منصتك التعليمية الحديثة</p>
    <button onclick="login()">الدخول بحساب جوجل</button></div>`;return}
  let body='';

async function redeem(vid){
  const v=videos[vid];if(!v||v.disabled)return toast('الفيديو موقوف');
  const c=$('#cd').value.trim();if(!/^\d{6}$/.test(c))return toast('الكود يجب أن يكون 6 أرقام');
  const r=await runTransaction(R('codes/'+c),cur=>{
    if(cur===null)return cur;
    if(cur.videoId!==vid)return;
    if(cur.used&&cur.usedBy!==U.uid)return;
    if(!cur.used)Object.assign(cur,{used:true,usedBy:U.uid,usedByName:U.displayName,usedByEmail:U.email,usedAt:Date.now()});
    return cur}).catch(()=>null);
  const vv=r?.snapshot.val();
  if(!vv||vv.usedBy!==U.uid||vv.videoId!==vid)return toast('الكود غير صحيح أو مستخدم من قبل');
  await set(R(`users/${U.uid}/videos/${vid}`),c);
  window.__mineVideos=window.__mineVideos||{};window.__mineVideos[vid]=c;
  go('watch',vid);
}

  }else{
    pl=`<iframe id="vplayer" src="${esc(e.s)}" allow="autoplay;encrypted-media;fullscreen" allowfullscreen referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-presentation allow-popups"></iframe>`;

function initPlayerToolbar(){
  const v=document.getElementById('vplayer');
  if(!v)return;
  const off=document.getElementById('tOffset');
  if(off)off.textContent='0s';
  // إن كان درايف، نفعّل أدوات التحكم عبر postMessage (تجريبي)
  if(v.dataset.drive==='1'){
    // نرسل أمر جاهزية — درايف لا يدعم API عاماً، لكن بعض المتصفحات تسمح بـ postMessage
    v.addEventListener('load',()=>{try{v.contentWindow.postMessage('{"event":"listening"}','*')}catch(e){}});
  }
}

function getVideo(){return document.getElementById('vplayer')}

function seekRel(delta){
  const v=getVideo();if(!v)return;
  if(v.tagName==='VIDEO'){
    const t=Math.max(0,Math.min((v.duration||0),v.currentTime+delta));v.currentTime=t;
    const off=document.getElementById('tOffset');
    if(off)off.textContent=(delta>0?'+':'-')+Math.abs(delta)+'s';
  }else if(v.dataset.drive==='1'){
    // محاولة التحكم عبر postMessage — قد لا تعمل بسبب سياسات درايف
    try{
      v.contentWindow.postMessage(JSON.stringify({event:'command',func:'seekTo',args:[delta]}),'*');
      toast('حاول استخدام شريط التقدم في المشغل');
    }catch(e){toast('غير متاح لهذا النوع')}
  }else if(v.tagName==='IFRAME'&&/youtube/.test(v.src)){
    try{
      v.contentWindow.postMessage(JSON.stringify({event:'command',func:'seekTo',args:[Math.max(0,delta)]}),'*');
    }catch(e){toast('غير متاح لهذا النوع')}
  }else{toast('غير متاح لهذا النوع')}
}

function setRate(r){
  const v=getVideo();if(!v)return;
  if(v.tagName==='VIDEO'){v.playbackRate=+r}
  else{toast('غيّر السرعة من أدوات المشغل نفسه (درايف/يوتيوب)')}
}

function resetOffset(){
  const v=getVideo();if(v&&v.tagName==='VIDEO')v.playbackRate=1;
  const off=document.getElementById('tOffset');if(off)off.textContent='0s';
  const sel=document.getElementById('vrate');if(sel)sel.value='1';
}

function toggleFullscreen(){
  const box=document.getElementById('plbox');if(!box)return;
  if(!document.fullscreenElement){
    (box.requestFullscreen||box.webkitRequestFullscreen||box.msRequestFullscreen).call(box).catch(()=>{});
  }else{(document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen).call(document).catch(()=>{})}
}

async function gen(vid,n){const v=videos[vid];let ok=0;
  while(ok<n){const c=String(crypto.getRandomValues(new Uint32Array(1))[0]%900000+100000);
    const r=await runTransaction(R('codes/'+c),cur=>cur===null?{videoId:vid,url:v.url,title:v.title,used:false,createdAt:Date.now()}:undefined);
    if(r.committed)ok++}
  return ok}

  <span class="b">${lg.length} فتحوه</span> <span class="b g">${lg.filter(x=>x.completed).length} أكملوه</span></p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end">
    <div style="width:110px"><label>العدد</label><input id="gn" type="number" min="1" value="10" style="margin-bottom:0"></div>
    <button onclick="moreCodes('${id}')">توليد أكواد</button>
    <button class="s" onclick="moreCodes('${id}',1)">كود لطالب واحد</button>
    <button class="s" onclick="copyFree('${id}')">نسخ المتاح</button>
    <button class="${v.disabled?'g':'d'}" onclick="toggleVid('${id}')">${v.disabled?'تفعيل الأكواد':'إيقاف الأكواد'}</button>
    <button class="s" onclick="exportPDF('${id}')">تصدير PDF</button>
    <button class="d" onclick="delV('${id}')">حذف الفيديو</button>
  </div></div>
  <h2>سجل الطلاب</h2><div class="box tw"><table id="pdf-src"><thead><tr>
  <th>الطالب</th><th>الإيميل</th><th>أول فتح</th><th>آخر نشاط</th><th>المشاهدة</th><th>الحالة</th></tr></thead><tbody>
  ${lg.map(l=>`<tr><td>${esc(l.name)}</td><td>${esc(l.email)}</td><td>${fd(l.openedAt)}</td>
  <td>${fd(l.lastAt)}</td><td>${Math.round((l.seconds||0)/60)} د</td><td>${st(l)}</td></tr>`).join('')||
  '<tr><td colspan="6" class="mut">لم يفتحه أحد بعد.</td></tr>'}</tbody></table></div>
  <h2>الأكواد</h2><div class="box tw"><table><thead><tr>
  <th>الكود</th><th>الحالة</th><th>استخدمه</th><th>الوقت</th><th></th></tr></thead><tbody>
  ${cs.map(x=>`<tr><td><span class="code">${x.c}</span></td>
  <td>${x.used?'<span class="b r">مستخدم</span>':'<span class="b g">متاح</span>'}</td>
  <td>${esc(x.usedByName||'-')}</td><td>${fd(x.usedAt)}</td>
  <td>${x.used?'':`<button class="s" style="padding:5px 12px" onclick="cp('${x.c}')">نسخ</button>`}</td></tr>`).join('')}
  </tbody></table></div>`;
}

Object.assign(window,{login,go,out,inst,redeem,addT,delT,setB,addV,moreCodes,delV,cp,toggleVid,exportPDF,
  toggleTheme,seekRel,setRate,resetOffset,toggleFullscreen,unban,keepBan});
render();
</script>
</body>
</html>
