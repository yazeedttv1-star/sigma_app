<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سنتر سيجما التعليمي</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Cairo', sans-serif; }
  body { background: #f0f4f8; min-height: 100vh; }
  .navbar-brand { font-weight: 700; }
  .card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
  .btn-google { background: #fff; border: 1px solid #dadce0; color: #3c4043; font-weight: 600; }
  .btn-google:hover { background: #f8f9fa; }
  .badge-admin { background: #dc3545; }
  .schedule-item { border-right: 4px solid #0d6efd; padding: 12px 16px; margin-bottom: 10px; background: #fff; border-radius: 10px; }
  .news-item { border-right: 4px solid #198754; padding: 12px 16px; margin-bottom: 10px; background: #fff; border-radius: 10px; }
  .hidden { display: none !important; }
  .loading { text-align: center; padding: 40px; color: #888; }
  #authSection { max-width: 420px; margin: 80px auto; }
  .file-preview { max-width: 100%; max-height: 300px; border-radius: 8px; margin-top: 8px; }
  .tab-btn.active { background: #0d6efd !important; color: #fff !important; }
  footer { text-align: center; padding: 20px; color: #888; font-size: 14px; }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <span class="navbar-brand">🎓 سنتر سيجما التعليمي</span>
    <div class="ms-auto d-flex align-items-center gap-2">
      <span id="userInfo" class="text-white small"></span>
      <button id="logoutBtn" class="btn btn-sm btn-light hidden">خروج</button>
    </div>
  </div>
</nav>

<!-- Auth Section -->
<div id="authSection" class="card p-4">
  <h4 class="text-center mb-4">تسجيل الدخول</h4>
  <p class="text-center text-muted small">سجّل بجوجل لعرض المواعيد والأخبار</p>
  <button id="googleLogin" class="btn btn-google w-100 d-flex align-items-center justify-content-center gap-2">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
    الدخول بحساب جوجل
  </button>
</div>

<!-- Main App -->
<div id="appSection" class="container my-4 hidden">

  <!-- Admin Panel -->
  <div id="adminPanel" class="card p-3 mb-4 hidden">
    <div class="d-flex gap-2 mb-3">
      <button class="btn btn-outline-primary tab-btn active" data-tab="sched">📅 إدارة المواعيد</button>
      <button class="btn btn-outline-primary tab-btn" data-tab="news">📰 إدارة الأخبار</button>
      <span class="badge badge-admin ms-auto align-self-center">أدمن</span>
    </div>

    <!-- Schedule Admin -->
    <div id="tab-sched">
      <div class="row g-2 mb-3">
        <div class="col-md-3">
          <select id="schedDay" class="form-select">
            <option value="today">اليوم</option>
            <option value="tomorrow">بكرة</option>
            <option value="week">هذا الأسبوع</option>
          </select>
        </div>
        <div class="col-md-4"><input id="schedTitle" class="form-control" placeholder="عنوان الدرس"></div>
        <div class="col-md-3"><input id="schedTime" class="form-control" placeholder="الوقت (مثال: 5 مساءً)"></div>
        <div class="col-md-2"><button id="addSched" class="btn btn-primary w-100">إضافة</button></div>
      </div>
      <input id="schedNote" class="form-control mb-2" placeholder="ملاحظة (اختياري)">
      <input id="schedFile" type="file" accept="image/*,application/pdf" class="form-control mb-2">
      <div id="schedFilePreview"></div>
    </div>

    <!-- News Admin -->
    <div id="tab-news" class="hidden">
      <input id="newsTitle" class="form-control mb-2" placeholder="عنوان الخبر">
      <textarea id="newsBody" class="form-control mb-2" rows="3" placeholder="نص الخبر"></textarea>
      <input id="newsFile" type="file" accept="image/*,application/pdf" class="form-control mb-2">
      <button id="addNews" class="btn btn-success">نشر الخبر</button>
    </div>
  </div>

  <!-- Tabs -->
  <ul class="nav nav-pills mb-3">
    <li class="nav-item"><button class="nav-link active" data-view="schedules">📅 المواعيد</button></li>
    <li class="nav-item"><button class="nav-link" data-view="news">📰 الأخبار</button></li>
  </ul>

  <!-- Schedules View -->
  <div id="view-schedules">
    <div class="d-flex gap-2 mb-3">
      <button class="btn btn-sm btn-outline-primary day-filter active" data-day="today">اليوم</button>
      <button class="btn btn-sm btn-outline-primary day-filter" data-day="tomorrow">بكرة</button>
      <button class="btn btn-sm btn-outline-primary day-filter" data-day="week">الأسبوع</button>
    </div>
    <div id="schedulesList" class="loading">جاري التحميل...</div>
  </div>

  <!-- News View -->
  <div id="view-news" class="hidden">
    <div id="newsList" class="loading">جاري التحميل...</div>
  </div>
</div>

<footer>© 2026 سنتر سيجما التعليمي</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, push, set, onValue, remove, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL, deleteObject }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyCoHGEyhlsjmB_diUNm-R8SXB0Gm0kXw0A",
  authDomain: "sigma-6f162.firebaseapp.com",
  databaseURL: "https://sigma-6f162-default-rtdb.firebaseio.com",
  projectId: "sigma-6f162",
  storageBucket: "sigma-6f162.firebasestorage.app",
  messagingSenderId: "420365348074",
  appId: "1:420365348074:web:0aaecb71ec613bb32abb93"
};

const ADMIN_EMAIL = "yazeedttv1@gmail.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const storage = getStorage(app);

let currentUser = null;
let isAdmin = false;

/* ========== AUTH ========== */
document.getElementById("googleLogin").onclick = () => {
  signInWithPopup(auth, new GoogleAuthProvider()).catch(e => alert("خطأ: " + e.message));
};
document.getElementById("logoutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  if (user) {
    isAdmin = user.email === ADMIN_EMAIL;
    document.getElementById("authSection").classList.add("hidden");
    document.getElementById("appSection").classList.remove("hidden");
    document.getElementById("logoutBtn").classList.remove("hidden");
    document.getElementById("userInfo").textContent = user.displayName || user.email;
    if (isAdmin) document.getElementById("adminPanel").classList.remove("hidden");
    else document.getElementById("adminPanel").classList.add("hidden");
    loadSchedules();
    loadNews();
  } else {
    document.getElementById("authSection").classList.remove("hidden");
    document.getElementById("appSection").classList.add("hidden");
    document.getElementById("logoutBtn").classList.add("hidden");
    document.getElementById("userInfo").textContent = "";
  }
});

/* ========== TABS (Admin) ========== */
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const tab = btn.dataset.tab;
    document.getElementById("tab-sched").classList.toggle("hidden", tab !== "sched");
    document.getElementById("tab-news").classList.toggle("hidden", tab !== "news");
  };
});

/* ========== TABS (Views) ========== */
document.querySelectorAll("[data-view]").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("[data-view]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const v = btn.dataset.view;
    document.getElementById("view-schedules").classList.toggle("hidden", v !== "schedules");
    document.getElementById("view-news").classList.toggle("hidden", v !== "news");
  };
});

/* ========== Day Filter ========== */
let currentDayFilter = "today";
document.querySelectorAll(".day-filter").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".day-filter").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentDayFilter = btn.dataset.day;
    renderSchedules();
  };
});

/* ========== FILE PREVIEW ========== */
document.getElementById("schedFile").onchange = (e) => {
  const f = e.target.files[0];
  const prev = document.getElementById("schedFilePreview");
  prev.innerHTML = "";
  if (!f) return;
  if (f.type.startsWith("image/")) {
    const img = document.createElement("img");
    img.src = URL.createObjectURL(f);
    img.className = "file-preview";
    prev.appendChild(img);
  } else {
    prev.innerHTML = `<div class="alert alert-info py-2 mt-2">📄 ${f.name}</div>`;
  }
};

/* ========== UPLOAD HELPER ========== */
async function uploadFile(file, folder) {
  if (!file) return null;
  const path = `${folder}/${Date.now()}_${file.name}`;
  const r = sRef(storage, path);
  await uploadBytes(r, file);
  const url = await getDownloadURL(r);
  return { url, path, type: file.type, name: file.name };
}

/* ========== SCHEDULES ========== */
document.getElementById("addSched").onclick = async () => {
  const day = document.getElementById("schedDay").value;
  const title = document.getElementById("schedTitle").value.trim();
  const time = document.getElementById("schedTime").value.trim();
  const note = document.getElementById("schedNote").value.trim();
  const file = document.getElementById("schedFile").files[0];
  if (!title) return alert("اكتب عنوان الدرس");

  try {
    const fileData = await uploadFile(file, "schedules");
    await set(push(ref(db, "schedules")), {
      day, title, time, note,
      file: fileData,
      createdBy: currentUser.email,
      createdAt: serverTimestamp()
    });
    document.getElementById("schedTitle").value = "";
    document.getElementById("schedTime").value = "";
    document.getElementById("schedNote").value = "";
    document.getElementById("schedFile").value = "";
    document.getElementById("schedFilePreview").innerHTML = "";
    alert("✅ تمت الإضافة");
  } catch (e) { alert("خطأ: " + e.message); }
};

let schedulesCache = [];
function loadSchedules() {
  onValue(ref(db, "schedules"), (snap) => {
    schedulesCache = [];
    snap.forEach(c => schedulesCache.push({ id: c.key, ...c.val() }));
    schedulesCache.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    renderSchedules();
  });
}

function renderSchedules() {
  const list = document.getElementById("schedulesList");
  const filtered = schedulesCache.filter(s => s.day === currentDayFilter);
  if (filtered.length === 0) {
    list.innerHTML = `<div class="alert alert-light text-center">لا توجد مواعيد</div>`;
    return;
  }
  list.innerHTML = filtered.map(s => `
    <div class="schedule-item">
      <div class="d-flex justify-content-between">
        <h6 class="mb-1">${escapeHtml(s.title)}</h6>
        ${isAdmin ? `<button class="btn btn-sm btn-outline-danger" onclick="delSched('${s.id}')">🗑️</button>` : ""}
      </div>
      ${s.time ? `<div class="text-muted small">🕐 ${escapeHtml(s.time)}</div>` : ""}
      ${s.note ? `<div class="small mt-1">${escapeHtml(s.note)}</div>` : ""}
      ${renderFile(s.file)}
    </div>
  `).join("");
}

window.delSched = async (id) => {
  if (!confirm("حذف الموعد؟")) return;
  const item = schedulesCache.find(x => x.id === id);
  try {
    if (item?.file?.path) { try { await deleteObject(sRef(storage, item.file.path)); } catch(e){} }
    await remove(ref(db, "schedules/" + id));
  } catch (e) { alert("خطأ: " + e.message); }
};

/* ========== NEWS ========== */
document.getElementById("addNews").onclick = async () => {
  const title = document.getElementById("newsTitle").value.trim();
  const body = document.getElementById("newsBody").value.trim();
  const file = document.getElementById("newsFile").files[0];
  if (!title) return alert("اكتب عنوان الخبر");

  try {
    const fileData = await uploadFile(file, "news");
    await set(push(ref(db, "news")), {
      title, body,
      file: fileData,
      createdBy: currentUser.email,
      createdAt: serverTimestamp()
    });
    document.getElementById("newsTitle").value = "";
    document.getElementById("newsBody").value = "";
    document.getElementById("newsFile").value = "";
    alert("✅ تم النشر");
  } catch (e) { alert("خطأ: " + e.message); }
};

let newsCache = [];
function loadNews() {
  onValue(ref(db, "news"), (snap) => {
    newsCache = [];
    snap.forEach(c => newsCache.push({ id: c.key, ...c.val() }));
    newsCache.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    renderNews();
  });
}

function renderNews() {
  const list = document.getElementById("newsList");
  if (newsCache.length === 0) {
    list.innerHTML = `<div class="alert alert-light text-center">لا توجد أخبار</div>`;
    return;
  }
  list.innerHTML = newsCache.map(n => `
    <div class="news-item">
      <div class="d-flex justify-content-between">
        <h6 class="mb-1">${escapeHtml(n.title)}</h6>
        ${isAdmin ? `<button class="btn btn-sm btn-outline-danger" onclick="delNews('${n.id}')">🗑️</button>` : ""}
      </div>
      ${n.body ? `<div class="small mt-1">${escapeHtml(n.body)}</div>` : ""}
      ${renderFile(n.file)}
    </div>
  `).join("");
}

window.delNews = async (id) => {
  if (!confirm("حذف الخبر؟")) return;
  const item = newsCache.find(x => x.id === id);
  try {
    if (item?.file?.path) { try { await deleteObject(sRef(storage, item.file.path)); } catch(e){} }
    await remove(ref(db, "news/" + id));
  } catch (e) { alert("خطأ: " + e.message); }
};

/* ========== HELPERS ========== */
function renderFile(f) {
  if (!f || !f.url) return "";
  if (f.type?.startsWith("image/")) {
    return `<img src="${f.url}" class="file-preview" onclick="window.open('${f.url}','_blank')">`;
  }
  return `<a href="${f.url}" target="_blank" class="btn btn-sm btn-outline-secondary mt-2">📄 تحميل ${escapeHtml(f.name || "الملف")}</a>`;
}
function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
</script>
</body>
</html>
